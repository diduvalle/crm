<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliação</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../estilo/tokens.css">
<link rel="stylesheet" href="../estilo/componentes.css">
<style>
/* A página onde o formando responde ao teste.
   O link é pessoal (o token identifica quem é), por isso não há conta nem
   palavra-passe - e não há pergunta "Nome". O que se escreve vai sendo
   guardado sozinho; submeter é o único passo irreversível.

   O VISUAL É O DO crm.cr0x.org, não o do interior da app: papel, tinta,
   azul, e as letras da casa - Archivo em tudo o que se lê e se clica, e
   Space Mono nas etiquetas. É a mesma cara do badge e da página de
   entrada, porque é tudo material que a mesma pessoa recebe.
   Os componentes continuam a vir de estilo/ - o que se faz aqui é trocar
   os valores das cores, uma vez, em cima. */
:root{
  --bg:#efe9dd; --surface:#f7f4ed; --surface2:#ebe4d8; --surface3:#e3dbcc;
  --border:#d6cdbd; --text:#171412; --muted:#6f655c; --muted2:#8a7f75;
  --g900:#00405f; --g800:#005e95; --g700:#005e95; --g600:#0078bf; --g500:#0078bf;
  --g400:#4aa3d4; --g300:#8cc2e2; --g200:#cfe4f1; --g100:#e3eef6; --g50:#f2f7fb;
  --g-texto:#005e95;
  --shadow:0 1px 2px rgba(23,20,18,.05),0 4px 14px rgba(23,20,18,.07);
  --shadow-md:0 2px 6px rgba(23,20,18,.07),0 12px 28px -12px rgba(23,20,18,.18);
  --shadow-primary:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -6px rgba(0,94,149,.45);
  --papel-fundo:#efe9dd; --risco:#d6cdbd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;font-size:17px;background:var(--bg);color:var(--text);line-height:1.6}
/* os controlos são de letra sem serifa: num campo, a serifa atrapalha */
button,input,select,textarea,.btn{font-family:Archivo,system-ui,sans-serif}
.folha{max-width:760px;margin:0 auto;padding:0 20px 80px}

/* cabeçalho */
.topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 12px;
  border-bottom:1.5px solid var(--text);margin-bottom:26px}
.topo-l{display:flex;align-items:center;gap:12px}
.marca{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  padding:5px;flex:none;display:grid;place-items:center}
.marca img{width:100%;height:100%;object-fit:contain}
.topo h1{font-family:Archivo,system-ui,sans-serif;font-size:1.06rem;font-weight:800;line-height:1.3;
  letter-spacing:-.01em}
.topo .sub{font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--g800);margin-top:3px}
.topo-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.barra{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:var(--g600);width:0;transition:width .25s}
.guardado{font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px;
  opacity:0;transition:opacity .2s}
.guardado.on{opacity:1}
.guardado svg{width:13px;height:13px}

/* perguntas */
.sec{margin:36px 0 8px;padding-top:22px;border-top:1.5px solid var(--text)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.sec h2{font-family:Archivo,system-ui,sans-serif;font-size:1.22rem;font-weight:800;letter-spacing:-.015em}
.sec p{font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--g800);margin-top:5px}
.perg{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.perg-cab{display:flex;gap:12px;align-items:flex-start;margin-bottom:15px}
.num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface3);color:var(--muted);
  display:grid;place-items:center;font-family:"Space Mono",ui-monospace,monospace;
  font-size:.74rem;font-weight:700;color:#4a423c}
.perg h3{font-family:Archivo,system-ui,sans-serif;font-size:1rem;font-weight:700;flex:1;line-height:1.45}
.pts{flex:none;font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:5px}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);
  border-radius:var(--r);cursor:pointer;background:var(--bg);transition:border-color .12s,background .12s}
.op:hover{border-color:var(--g500);background:var(--g50)}
.op input{margin-top:4px;flex:none;accent-color:var(--g600);width:16px;height:16px}
.op span{font-size:1rem;line-height:1.45}
.op.escolhida{border-color:var(--g600);background:var(--g50)}
.vf{display:flex;gap:10px}
.vf .op{flex:1;justify-content:center;align-items:center}
.vf .op span{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:.95rem}
.perg textarea{width:100%;min-height:140px;font-size:.95rem;line-height:1.6;padding:13px 15px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--text);resize:vertical}
.perg textarea:focus{outline:0;border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}

/* rodapé de submissão */
.fim{margin-top:28px;padding:22px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rl);display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.fim .txt{flex:1;min-width:200px}
.fim strong{display:block;font-family:Archivo,system-ui,sans-serif;font-size:1rem;font-weight:700}
.fim span{font-size:.92rem;color:var(--muted)}

/* estados e resultado */
.aviso{max-width:560px;margin:90px auto;text-align:center;padding:0 20px}
.aviso .marca{margin:0 auto 20px;width:52px;height:52px}
.aviso h1{font-family:Archivo,system-ui,sans-serif;font-size:1.5rem;font-weight:800;
  letter-spacing:-.015em;margin-bottom:10px}
.aviso p{color:var(--muted);font-size:1rem}
.nota{display:flex;align-items:center;gap:20px;padding:24px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap}
.nota .v{font-family:Archivo,system-ui,sans-serif;font-size:2.8rem;font-weight:800;line-height:1;
  letter-spacing:-.02em;color:var(--g800)}
.nota .de{font-family:Archivo,system-ui,sans-serif;font-size:.95rem;color:var(--muted);font-weight:600}
.nota .pc{margin-left:auto}
.certo{border-color:var(--ok)}
.errado{border-color:var(--danger)}
.op.certa{border-color:var(--ok);background:rgba(15,157,88,.08)}
.op.errada{border-color:var(--danger);background:var(--danger-bg)}
.resp-txt{white-space:pre-wrap;font-size:1rem;padding:13px 15px;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--r)}
.coment{margin-top:12px;padding:12px 15px;border-left:3px solid var(--g600);background:var(--g50);
  border-radius:0 var(--r) var(--r) 0;font-size:.96rem}
.coment b{display:block;font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.14em;color:var(--g800);margin-bottom:4px;font-weight:700}
.esconde{display:none!important}
@media(max-width:600px){ .folha{padding:0 14px 60px} .perg{padding:17px} .topo h1{font-size:.98rem} }
</style>
</head>
<body>

<div id="ecra"></div>

<div class="aviso esconde" id="aviso">
  <div class="marca"><img src="/favicon.svg" alt=""></div>
  <h1 id="avisoT">Não foi possível abrir</h1>
  <p id="avisoP">Este link pode estar incompleto ou já não ser válido. Fala com o teu formador.</p>
</div>

<noscript><div class="aviso"><h1>Ative o JavaScript</h1><p>Esta página precisa de JavaScript para mostrar a avaliação.</p></div></noscript>

<script>
(function(){
'use strict';
var SUPA='https://qgfzbyhfyqvmmmdiqycu.supabase.co';
var KEY='sb_publishable_atlEEoeN4-CWY8mD7KQNsw_m1cXjdIE';
var T=new URLSearchParams(location.search).get('t')||'';
var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

var D=null;          // o que o servidor devolveu
var R={};            // as respostas, tal como vão para o servidor
var porGravar=false, aGravar=false, timer=null;

var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var $=function(s){ return document.querySelector(s); };
var ic={
  ok:'M20 6 9 17l-5-5',
  disco:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8'
};
var svg=function(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
  'stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>'; };
var num=function(n){ return (Math.round(n*100)/100).toString().replace('.',','); };

function rpc(nome, args){
  return fetch(SUPA+'/rest/v1/rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args)}).then(function(r){
      if(!r.ok) throw new Error('rpc '+nome);
      return r.json();
    });
}

function falhou(t,p){
  $('#ecra').innerHTML='';
  $('#aviso').className='aviso';
  if(t) $('#avisoT').textContent=t;
  if(p) $('#avisoP').textContent=p;
}

if(!UUID.test(T)){ falhou(); return; }

rpc('teste_abrir',{p_token:T}).then(function(d){
  if(!d||!d.modo) return falhou();
  D=d; R=d.respostas||{};
  pintar();
}).catch(function(){ falhou('Não foi possível ligar','Tenta outra vez daqui a pouco. Se continuar, avisa o teu formador.'); });

/* ---------- desenhar ---------- */
function pintar(){
  document.title=D.titulo||'Avaliação';
  var modo=D.modo;
  if(modo==='resultado')  return pintarResultado();
  if(modo==='entregue')   return pintarEstado('Entregaste a tua avaliação',
    'Está com o formador. Quando a correção estiver feita recebes o resultado neste mesmo link.');
  if(modo==='fechado')    return pintarEstado('As respostas estão fechadas',
    'O prazo desta avaliação terminou. Fala com o teu formador se precisares de responder.');
  pintarFormulario();
}

function pintarEstado(t,p){
  $('#ecra').innerHTML='';
  $('#aviso').className='aviso';
  $('#avisoT').textContent=t; $('#avisoP').textContent=p;
}

function cabecalho(extra){
  return '<div class="topo"><div class="folha" style="padding-bottom:0"><div class="topo-l">'+
    '<div class="marca"><img src="/favicon.svg" alt=""></div>'+
    '<div><h1>'+esc(D.titulo)+'</h1><div class="sub">'+esc(D.nome)+
      (D.modulo?' · UFCD '+esc(D.modulo):'')+'</div></div>'+
    '<div class="topo-r">'+(extra||'')+'</div></div>'+
    '<div class="barra"><i id="barra"></i></div></div></div>';
}

function pintarFormulario(){
  var html=cabecalho('<span class="guardado" id="guardado">'+svg(ic.disco)+'Guardado</span>')+
    '<div class="folha"><div id="lista"></div>'+
    '<div class="fim"><div class="txt"><strong>Já respondeste a tudo?</strong>'+
      '<span id="falta"></span></div>'+
      '<button class="btn" id="submeter">Submeter</button></div></div>';
  $('#ecra').innerHTML=html;

  var lista=$('#lista'), n=0;
  (D.itens||[]).forEach(function(it){
    if(it.tipo==='seccao'){
      lista.insertAdjacentHTML('beforeend','<div class="sec"><h2>'+esc(it.enunciado)+'</h2>'+
        (it.ajuda?'<p>'+esc(it.ajuda)+'</p>':'')+'</div>');
      return;
    }
    n++;
    var pts=Number(it.pontos)||0;
    var corpo='';
    if(it.tipo==='escolha'){
      corpo='<div class="ops">'+(it.opcoes||[]).map(function(o,i){
        return '<label class="op'+(R[it.id]===i?' escolhida':'')+'" data-op="'+it.id+'|'+i+'">'+
          '<input type="radio" name="q'+it.id+'" value="'+i+'"'+(R[it.id]===i?' checked':'')+'>'+
          '<span>'+esc(o)+'</span></label>';
      }).join('')+'</div>';
    } else if(it.tipo==='vf'){
      corpo='<div class="vf">'+[['Verdadeiro',true],['Falso',false]].map(function(p){
        return '<label class="op'+(R[it.id]===p[1]?' escolhida':'')+'" data-op="'+it.id+'|'+p[1]+'">'+
          '<input type="radio" name="q'+it.id+'" value="'+p[1]+'"'+(R[it.id]===p[1]?' checked':'')+'>'+
          '<span>'+p[0]+'</span></label>';
      }).join('')+'</div>';
    } else {
      corpo='<textarea data-txt="'+it.id+'" placeholder="Escreve aqui a tua resposta…">'+
        esc(R[it.id]||'')+'</textarea>';
    }
    lista.insertAdjacentHTML('beforeend','<div class="perg" data-perg="'+it.id+'">'+
      '<div class="perg-cab"><span class="num">'+n+'</span><h3>'+esc(it.enunciado)+'</h3>'+
      (pts?'<span class="pts">'+num(pts)+' pt'+(pts===1?'':'s')+'</span>':'')+'</div>'+
      (it.ajuda?'<p class="muted" style="font-size:.84rem;margin:-8px 0 12px 36px">'+esc(it.ajuda)+'</p>':'')+
      corpo+'</div>');
  });

  lista.addEventListener('change',function(e){
    var l=e.target.closest('[data-op]'); if(!l) return;
    var p=l.dataset.op.split('|'), id=p[0], v=p[1];
    R[id]=(v==='true')?true:(v==='false')?false:Number(v);
    l.parentNode.querySelectorAll('.op').forEach(function(o){
      o.classList.toggle('escolhida', o===l); });
    marcar();
  });
  lista.addEventListener('input',function(e){
    var t=e.target;
    if(!t.dataset||!t.dataset.txt) return;
    R[t.dataset.txt]=t.value;
    marcar();
  });
  $('#submeter').addEventListener('click',submeter);
  progresso();
}

function marcar(){ porGravar=true; progresso(); clearTimeout(timer); timer=setTimeout(gravar,1200); }

function porResponder(){
  return (D.itens||[]).filter(function(it){
    if(it.tipo==='seccao') return false;
    var v=R[it.id];
    return v===undefined||v===null||(typeof v==='string'&&!v.trim());
  });
}

function progresso(){
  var total=(D.itens||[]).filter(function(i){ return i.tipo!=='seccao'; }).length;
  var falta=porResponder().length, feito=total-falta;
  var b=$('#barra'); if(b) b.style.width=(total?Math.round(feito/total*100):0)+'%';
  var f=$('#falta');
  if(f) f.textContent=falta? ('Faltam '+falta+' de '+total+'.') : ('Respondeste às '+total+'.');
}

function gravar(){
  if(!porGravar||aGravar) return;
  aGravar=true; porGravar=false;
  rpc('teste_guardar',{p_token:T,p_respostas:R}).then(function(){
    var g=$('#guardado'); if(g){ g.classList.add('on'); setTimeout(function(){ g.classList.remove('on'); },1600); }
  }).catch(function(){ porGravar=true; }).then(function(){
    aGravar=false;
    if(porGravar) setTimeout(gravar,800);
  });
}

/* Sair a meio com coisas por gravar: o navegador pergunta antes de fechar. */
window.addEventListener('beforeunload',function(e){
  if(porGravar){ gravar(); e.preventDefault(); e.returnValue=''; }
});

function submeter(){
  var falta=porResponder().length;
  var txt=falta
    ? 'Ainda faltam '+falta+' pergunta(s). Depois de submeteres não podes voltar atrás.'
    : 'Depois de submeteres não podes voltar atrás.';
  if(!confirm(txt+'\n\nSubmeter agora?')) return;
  var b=$('#submeter'); b.disabled=true; b.textContent='A submeter…';
  rpc('teste_submeter',{p_token:T,p_respostas:R}).then(function(r){
    if(!r||!r.ok) throw new Error('nao');
    porGravar=false;
    return rpc('teste_abrir',{p_token:T});
  }).then(function(d){ D=d; R=d.respostas||{}; window.scrollTo(0,0); pintar(); })
    .catch(function(){
      b.disabled=false; b.textContent='Submeter';
      alert('Não foi possível submeter. Tenta outra vez; o que escreveste está guardado.');
    });
}

/* ---------- resultado ---------- */
function pintarResultado(){
  var total=Number(D.pontos_total)||0, nota=Number(D.nota)||0;
  var pc=total?Math.round(nota/total*100):0;
  var html=cabecalho()+'<div class="folha">'+
    '<div class="nota"><div><div class="v">'+num(nota)+'</div></div>'+
      '<div><div class="de">de '+num(total)+' pontos</div>'+
      '<div class="muted" style="font-size:.84rem">Entregue a '+
        (D.submetido_em?new Date(D.submetido_em).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-')+'</div></div>'+
      '<div class="pc"><span class="pill '+(pc>=50?'green':'amber')+'">'+pc+'%</span></div></div>'+
    (D.comentario?'<div class="coment" style="margin-bottom:22px"><b>Comentário do formador</b>'+esc(D.comentario)+'</div>':'')+
    '<div id="lista"></div></div>';
  $('#ecra').innerHTML=html;
  var b=$('#barra'); if(b) b.style.width='100%';

  var lista=$('#lista'), n=0;
  (D.itens||[]).forEach(function(it){
    if(it.tipo==='seccao'){
      lista.insertAdjacentHTML('beforeend','<div class="sec"><h2>'+esc(it.enunciado)+'</h2>'+
        (it.ajuda?'<p>'+esc(it.ajuda)+'</p>':'')+'</div>');
      return;
    }
    n++;
    var pts=Number(it.pontos)||0;
    var dados=(D.pontos||{})[it.id];
    var ganhos=dados===undefined?null:Number(dados);
    var minha=R[it.id];
    var corpo='', classe='';
    if(it.tipo==='escolha'){
      corpo='<div class="ops">'+(it.opcoes||[]).map(function(o,i){
        var c=(it.certa===i), m=(minha===i);
        return '<div class="op'+(c?' certa':(m?' errada':''))+'">'+
          '<span style="flex:1">'+esc(o)+'</span>'+
          (m?'<span class="pill '+(c?'green':'red')+'">a tua</span>':
             (c?'<span class="pill green">certa</span>':''))+'</div>';
      }).join('')+'</div>';
      classe=(ganhos>0)?'certo':'errado';
    } else if(it.tipo==='vf'){
      corpo='<div class="vf">'+[['Verdadeiro',true],['Falso',false]].map(function(p){
        var c=(it.certa===p[1]), m=(minha===p[1]);
        return '<div class="op'+(c?' certa':(m?' errada':''))+'">'+
          '<span>'+p[0]+'</span>'+(m?'<span class="pill '+(c?'green':'red')+'">a tua</span>':'')+'</div>';
      }).join('')+'</div>';
      classe=(ganhos>0)?'certo':'errado';
    } else {
      corpo='<div class="resp-txt">'+(minha?esc(minha):'<span class="muted">(sem resposta)</span>')+'</div>';
    }
    var com=(D.comentarios||{})[it.id];
    lista.insertAdjacentHTML('beforeend','<div class="perg '+classe+'">'+
      '<div class="perg-cab"><span class="num">'+n+'</span><h3>'+esc(it.enunciado)+'</h3>'+
      '<span class="pts">'+(ganhos===null?'-':num(ganhos))+' / '+num(pts)+'</span></div>'+
      corpo+
      (com?'<div class="coment"><b>Comentário</b>'+esc(com)+'</div>':'')+'</div>');
  });
}
})();
</script>
</body>
</html>
