<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repositório - CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Space+Mono:wght@400;700&display=swap">
<!-- Archivo e Space Mono: as letras do crm.cr0x.org. A Archivo
     não se vê no ecrã do Repo - é a imagem dos gráficos que a desenha. -->
<link rel="stylesheet" href="../estilo/tokens.css">
<link rel="stylesheet" href="../estilo/componentes.css">
<style>
/* Fundo do ecrã de entrada: a imagem da plataforma (absoluto, porque o componentes.css vive em /estilo/) */
:root{--login-bg:url('/background.png')}
/* Só o que é do repositório. O resto vem de estilo/ (partilhado com a app). */
.nav-link{background:none;border:0;width:100%;text-align:left;font:inherit}
.profile .sair{margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;cursor:pointer}
.profile .sair:hover{background:rgba(255,255,255,.2)}
.profile .sair svg{width:16px;height:16px}
.nav-search svg{width:16px;height:16px;flex:none}
.made-by svg{width:14px;height:14px;flex:none}
.app.nav-collapsed .profile .sair{margin-left:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
tr.clickable{cursor:pointer}
.tag{align-self:flex-start}
td .tag{align-self:auto}
.hidden{display:none!important}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .nav{flex-direction:row}
  .nav-group,.nav-foot,.brand-txt,.nav-search{display:none}
  .nav-link.active::before{display:none}
}

/* CARTÃO DE TURMA */
.tc{display:flex;flex-direction:column;gap:10px;padding:20px}
.tc h3{font-size:1.05rem;font-weight:800}
.tc-meta{display:flex;flex-wrap:wrap;gap:6px}
.tc-drive{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-drive svg{flex:none;width:16px;height:16px}
.tc-drive.falta{color:var(--warn)}
/* Cinco botões não cabem numa linha de cartão: em vez de se espremerem (o
   "Badges" chegou a sair cortado e o "Abrir" a desaparecer), passam à linha. */
.tc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.tc-foot>.btn,.tc-foot>.btn-sec{flex:none}
/* onde a linha parte: em cima o que é da turma, em baixo para onde se vai */
/* o cartão tem um canto: lá vive a roda dentada das definições */
.tc{position:relative}
.tc-meta,.tc h3{padding-right:34px}
.tc-cog{position:absolute;top:14px;right:14px;width:30px;height:30px;border:1px solid transparent;
  border-radius:8px;background:transparent;color:var(--muted2);display:grid;place-items:center;
  cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.tc-cog svg{width:16px;height:16px}
.tc-cog:hover{background:var(--surface2);color:var(--text);border-color:var(--border)}
/* o lápis do nome: o mesmo da barra lateral, mas dentro da linha do título */
.tc h3 .lapis-t{position:static;transform:none;display:inline-grid;vertical-align:middle;margin-left:5px}
.tc:hover .lapis-t,.lapis-t:focus-visible{opacity:1}
.nome-in{width:100%;font:inherit;font-size:1.05rem;font-weight:800;padding:3px 9px;
  border:1.5px solid var(--g600);border-radius:9px;background:var(--surface);color:var(--text);outline:0}
/* o dourado do badge: so existe aqui, nao entra no sistema de estilos */
.btn-ouro{background:#d4af37;border-color:#d4af37;color:#241d0a}
.btn-ouro:hover{background:#c8a42d;border-color:#c8a42d}
/* o principal do cartão encosta à direita; com quebra de linha, fica sozinho
   e alinhado à direita na linha de baixo */
.tc-foot>.btn:last-child{margin-left:auto}
/* o Badges e o Abrir andam juntos, encostados à direita */
.tc-foot>.btn-ouro{margin-left:auto}
.tc-foot>.btn-ouro~.btn{margin-left:0}
/* cartão de escola */
.esc-cab{display:flex;align-items:center;gap:10px}
.esc-logo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--border);flex:none;padding:3px}
.esc-logo-vazio{display:grid;place-items:center;color:var(--muted)}
.esc-logo-vazio svg{width:20px;height:20px}
.tc-fora{border-style:dashed}
.tc-arq{filter:grayscale(1);background:var(--surface2)}
/* apagar a escola: discreto como o lápis da barra, acende no cartão */
.tc-lixo{width:30px;height:30px;flex:none;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted2);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s,background .12s,color .12s}
.tc-lixo svg{width:15px;height:15px}
.tc:hover .tc-lixo,.tc-lixo:focus-visible{opacity:1}
.tc-lixo:hover{background:var(--danger-bg);color:var(--danger)}
/* atribuir o badge de cada formando */
.cod-b{display:flex;align-items:center;gap:6px}
.cod-b input{width:112px;font:inherit;font-size:.82rem;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.cod-b input:focus{outline:0;border-color:var(--g500)}
/* O louro do cum laude: um por turma. Apagado enquanto ninguem o tem,
   aceso a dourado em quem o leva. */
.cl-b{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--regua);
  border-radius:999px;background:var(--surface);color:var(--fraco);font-size:.74rem;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:.14s}
.cl-b svg{width:15px;height:15px;flex:0 0 auto}
.cl-b:hover{border-color:#c5a03f;color:#8a6d1f;background:#fdf8ea}
.cl-b.on{border-color:#c5a03f;color:#5c4508;background:linear-gradient(180deg,#f5e6b0,#e6cc72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
.t-center{text-align:center}
.trocar{border:0;background:none;color:var(--muted2);cursor:pointer;padding:2px;border-radius:6px;display:inline-grid;place-items:center;vertical-align:middle;margin-left:4px}
.trocar svg{width:14px;height:14px}
.trocar:hover{background:var(--surface2);color:var(--text)}
/* as turmas da escola aberta, por baixo dela na barra */
.nav-sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 6px 17px;padding-left:9px;border-left:1.5px solid var(--regua)}
.nav-turma{display:flex;align-items:center;gap:7px;width:100%;text-align:left;font-family:Archivo,system-ui,sans-serif;font-size:.82rem;font-weight:600;color:var(--tinta-2);background:none;border:0;border-radius:8px;padding:6px 9px;cursor:pointer}
.nav-turma .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-turma:hover{background:rgba(23,20,18,.06);color:var(--tinta)}
[data-theme="dark"] .nav-turma:hover{background:rgba(239,233,221,.08)}
.nav-turma.active{background:var(--papel-claro);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--regua)}
.nav-turma.fora{color:var(--fraco)}
.nav-turma-fora{margin-left:auto;display:grid;place-items:center;opacity:.75}
.nav-turma-fora svg{width:14px;height:14px}
.app.nav-collapsed .nav-sub{display:none}
/* confirmação com código: o que não se desfaz escreve-se à mão */
.perda{margin:12px 0 0;padding-left:20px}
.perda li{font-size:.88rem;margin-bottom:5px}
.cod-caixa{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2)}
.cod-caixa>div{display:flex;flex-direction:column;gap:3px}
.cod{font-family:"Space Mono",ui-monospace,monospace;font-size:1.45rem;font-weight:700;letter-spacing:.28em;color:var(--danger)}
.cod-in{width:112px;margin-left:auto;font-family:"Space Mono",ui-monospace,monospace;font-size:1.15rem;font-weight:700;letter-spacing:.18em;text-align:center;padding:9px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}
.cod-in:focus{outline:0;border-color:var(--danger)}
.modal-foot button:disabled{cursor:not-allowed;background:var(--surface3);color:var(--muted);border-color:transparent;box-shadow:none}
.sec-titulo{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}

/* CABEÇALHO DE SECÇÃO COM VOLTAR */
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0;margin-bottom:6px}
.voltar:hover{color:var(--g-texto)}
.voltar svg{width:16px;height:16px}

/* EDITOR DE TEXTO RICO */
.rt-toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 8px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface2)}
.rt-tb{height:30px;min-width:30px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;font-weight:700}
.rt-tb:hover{border-color:var(--g400);background:var(--g50);color:var(--g-texto)}
.rt-tb svg{width:15px;height:15px}
.rt-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.rt-editor{min-height:120px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:0 0 10px 10px;padding:12px 14px;background:var(--surface2);color:var(--text);outline:none;font-size:.9rem}
.rt-editor:focus{border-color:var(--g400);box-shadow:0 0 0 3px rgba(0,120,191,.14);background:var(--surface)}
.rt-editor:empty:before{content:attr(data-placeholder);color:var(--muted2)}
.rt-editor p{margin:0 0 9px}
.rt-editor ul,.rt-editor ol{margin:0 0 9px 20px}
.rt-editor a{color:var(--g700);text-decoration:underline}

/* MARCADORES */
.vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.var-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;background:var(--surface3);color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:'Space Mono',ui-monospace,monospace}
.var-chip:hover{border-color:var(--g400);color:var(--g-texto);background:var(--g50)}

/* AVISO RGPD */
.nota-rgpd{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.78rem;font-weight:600;line-height:1.45}
.nota-rgpd svg{flex:none;width:16px;height:16px;margin-top:1px}

/* SECÇÃO RECOLHÍVEL */
.fold{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.fold>summary{padding:11px 14px;background:var(--surface2);cursor:pointer;font-weight:700;font-size:.86rem;list-style:none;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);transform:rotate(-45deg);transition:transform .18s;margin-left:2px}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary .sub{font-weight:500;color:var(--muted);font-size:.78rem;margin-left:auto}
.fold-body{padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--border)}

/* PRÉ-VISUALIZAÇÃO DO EMAIL */
.preview{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.preview-head{background:linear-gradient(135deg,var(--g800),var(--g600));color:#fff;padding:14px 18px;font-weight:800;font-size:.92rem}
.preview-body{padding:18px}
.preview-body .pv-title{font-weight:700;font-size:1rem;margin:0 0 10px}
.preview-body .pv-text{color:var(--muted);font-size:.88rem;min-height:40px}
.preview-body .pv-text p{margin:0 0 9px}
.preview-body .pv-text ul,.preview-body .pv-text ol{margin:0 0 9px 20px}
.preview-body .pv-text a{color:var(--g700);text-decoration:underline}
.preview-body .pv-saud{font-size:.88rem}
.pv-btn{display:inline-block;margin-top:16px;background:var(--g800);color:#fff;padding:10px 20px;border-radius:8px;font-weight:700;font-size:.85rem}

/* o empty state é um "herói": ícone maior, mas com tamanho fixo */
.empty svg{width:34px;height:34px;flex:none}

/* (a lista de turmas do CRM saiu: as turmas escolhem-se dentro da escola) */

/* o partilhado só define .field .hint; aqui usamos notas soltas (prévia, avisos) */
.hint{font-size:.74rem;color:var(--muted);font-weight:500}
/* o cabeçalho do modal é flex: sem isto o botão de atualizar era espremido */
.modal-head .icon-btn{flex:none}

/* botão de copiar o link pessoal de um formando (dashboard) */
.lnk-copy{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;vertical-align:middle;margin-left:7px;padding:0}
.lnk-copy:hover{border-color:var(--g400);color:var(--g-texto);background:var(--g50)}
.lnk-copy svg{width:13px;height:13px}
/* ---- Barra lateral: papel e tinta da landing (crm.cr0x.org), não o azul
   da app. Só aqui no Repo; a app continua com a barra dela. ---- */
:root{--papel:#efe9dd;--papel-claro:#fdfbf7;--tinta:#171412;--tinta-2:#4a423c;--fraco:#6f655c;--regua:rgba(23,20,18,.16);
  /* o conteúdo na mesma família da barra: papel e tinta, com o azul só como acento */
  --bg:#f6f1e7;--surface:#fffdf9;--surface2:#faf5ec;--surface3:#f2ece1;--border:#e3dbcb;
  --text:#171412;--muted:#5f574f;--muted2:#6b6058;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 4px 14px rgba(60,45,25,.07);
  --shadow-md:0 2px 4px rgba(60,45,25,.07),0 10px 26px -10px rgba(60,45,25,.16);
  --shadow-lg:0 18px 48px rgba(60,45,25,.18)}
[data-theme="dark"]{--papel:#171412;--papel-claro:#221e1b;--tinta:#efe9dd;--tinta-2:#cfc6b8;--fraco:#9a9084;--regua:rgba(239,233,221,.14);
  --bg:#14110f;--surface:#1c1815;--surface2:#232019;--surface3:#2a251f;--border:#342e26;
  --text:#efe9dd;--muted:#b5aa9c;--muted2:#9a9084}
.sidebar{background:var(--papel);color:var(--tinta);border-right:1.5px solid var(--regua);
  background-image:radial-gradient(var(--regua) .6px,transparent .7px);background-size:14px 14px}
.brand-logo{background:var(--papel-claro);border:1.5px solid var(--tinta);box-shadow:none;border-radius:10px}
.brand-txt h1{font-family:Archivo,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;color:var(--tinta)}
.brand-txt p{font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco)}
.nav-search{background:var(--papel-claro);border:1px solid var(--regua)}
.nav-search input{color:var(--tinta)} .nav-search input::placeholder{color:var(--fraco)} .nav-search svg{color:var(--fraco)}
.nav-group{font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.2em;color:var(--g600);font-weight:400}
.nav-link{font-family:Archivo,system-ui,sans-serif;font-weight:600;color:var(--tinta-2)}
.nav-link:hover{background:rgba(23,20,18,.06);color:var(--tinta)}
[data-theme="dark"] .nav-link:hover{background:rgba(239,233,221,.08)}
.nav-link.active{background:var(--papel-claro);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--regua)}
.nav-link.active::before{left:-2px;width:3px;height:60%;background:var(--g600);border-radius:2px}
.nav::-webkit-scrollbar-thumb{background:var(--regua)}
.nav-foot{border-top:1.5px solid var(--regua)}
.profile{background:var(--papel-claro);border:1px solid var(--regua)}
.profile-txt strong{font-family:Archivo,system-ui,sans-serif;color:var(--tinta)} .profile-txt span{color:var(--fraco)}
.avatar{background:var(--tinta);color:var(--papel)}
.profile .sair{background:transparent;border-color:var(--regua);color:var(--tinta-2)} .profile .sair:hover{background:var(--tinta);color:var(--papel)}
.made-by{color:var(--fraco);font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem} .made-by:hover{color:var(--tinta)}
.legal-link{color:var(--fraco);opacity:1;font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem}
/* as escolas na barra: um item por escola, lápis ao passar o rato para mudar o nome */
.nav-escola{position:relative;padding-right:34px}
.nav-esc-ini,.nav-esc-logo{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:inherit;line-height:1;background:var(--tinta);color:var(--papel)}
.nav-esc-logo{object-fit:contain;background:var(--papel-claro);border:1px solid var(--regua);padding:2px}
.nav-escola .lbl{overflow:hidden;text-overflow:ellipsis}
.lapis{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--fraco);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s,background .12s}
.lapis svg{width:14px;height:14px}
.nav-escola:hover .lapis,.lapis:focus-visible{opacity:1}
.lapis:hover{background:var(--papel-claro);color:var(--tinta)}
.nav-esc-input{flex:1;min-width:0;font:inherit;font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:.88rem;padding:3px 7px;border:1.5px solid var(--g600);border-radius:7px;background:var(--papel-claro);color:var(--tinta);outline:0}
.nav-escola.a-editar{padding-right:12px}
.nav-vazio{padding:8px 12px;font-size:.78rem;color:var(--fraco);font-family:"Space Mono",ui-monospace,monospace}
.app.nav-collapsed .nav-escola{padding-right:0} .app.nav-collapsed .lapis{display:none}
/* mover uma turma sem escola para uma escola */
.mover{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:600}
.mover select{flex:1;min-width:0;font:inherit;font-size:.8rem;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
/* TESTES: construtor, pauta e gráficos */
.add-lin{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.guardar-lin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);position:sticky;bottom:14px}
.guardar-lin .btn{margin-left:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--g600)}
.chk input:disabled{opacity:.45}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.item.seccao{background:var(--surface2);border-style:dashed}
.item-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.item-cab .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface3);color:var(--muted);
  display:grid;place-items:center;font-size:.76rem;font-weight:800}
.item-cab select{font:inherit;font-size:.8rem;font-weight:700;padding:5px 8px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);color:var(--text)}
.pts-in{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);font-weight:700}
.pts-in input{width:64px;font:inherit;font-size:.82rem;padding:5px 8px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);color:var(--text)}
.item-acc{margin-left:auto;display:flex;gap:2px}
.item-acc button{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted2);
  display:grid;place-items:center;cursor:pointer}
.item-acc button:hover{background:var(--surface2);color:var(--text)}
.item-acc button svg{width:15px;height:15px}
.item-acc .fora:hover{background:var(--danger-bg);color:var(--danger)}
.item textarea{width:100%;min-height:58px;font:inherit;font-size:.9rem;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);color:var(--text);resize:vertical}
.item textarea:focus,.op-in:focus{outline:0;border-color:var(--g500)}
.ops-ed{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.op-lin{display:flex;align-items:center;gap:9px}
.op-lin input[type=radio]{width:17px;height:17px;accent-color:var(--ok);flex:none;cursor:pointer}
.op-in{flex:1;min-width:0;font:inherit;font-size:.88rem;padding:8px 11px;border:1px solid var(--border);
  border-radius:9px;background:var(--surface);color:var(--text)}
.tc-lixo.mini{width:26px;height:26px;opacity:.55}
.tc-lixo.mini svg{width:14px;height:14px}
.item:hover .tc-lixo.mini{opacity:1}
.vf-ed{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px}
.op-vf{display:flex;align-items:center;gap:7px;font-size:.88rem;font-weight:700;cursor:pointer}
.op-vf input{width:17px;height:17px;accent-color:var(--ok)}
/* pauta e gráficos */
.cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi strong{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.76rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.g-bolhas{display:grid;gap:14px}
.g-bolha{padding:18px 20px}
.g-cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.g-cab h4{flex:1;min-width:0;font-size:.9rem;font-weight:700;line-height:1.45}
.g-cab .pill,.g-cab .g-copiar{flex:none;margin-top:1px}
.g-copiar{white-space:nowrap}
.g-copiar svg{width:14px;height:14px}
.g-pe{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:.76rem;color:var(--muted);font-weight:600}
.g-lin{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:.82rem}
.g-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-bar{flex:none;width:46%;height:16px;border-radius:5px;background:var(--surface3);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--g500)}
.g-bar.ok i{background:var(--ok)}
.g-bar.vazia i{background:var(--muted2);opacity:.45}
.g-n{flex:none;width:58px;text-align:right;color:var(--muted);font-weight:700}
.corrigir-q{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.corrigir-q:first-child{border-top:0;padding-top:0;margin-top:0}
.corrigir-q .enun{font-size:.88rem;font-weight:700;margin-bottom:7px}
.corrigir-q .dada{white-space:pre-wrap;font-size:.86rem;padding:10px 12px;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--r)}
.corrigir-q .linha{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.corrigir-q .linha input[type=number]{width:80px;font:inherit;font-size:.86rem;padding:6px 9px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.corrigir-q .linha input[type=text]{flex:1;min-width:160px;font:inherit;font-size:.86rem;padding:6px 9px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.nota-fim{display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:800}
.nota-fim .v{font-size:1.5rem;color:var(--g700)}
</style>
</head>
<body>

<!-- ENTRADA -->
<div class="portal" id="login">
  <div class="login-bg"></div>
  <div class="login-panel">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo"><img src="../favicon.svg" alt=""></div>
        <div><h1>Repositório</h1><p>Acesso aos materiais das turmas</p></div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="sidebar">

    <div class="nav-search">

    <nav class="nav">

        <div class="profile-txt"><strong>Gestor</strong><span>Acesso privado</span></div>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Voltar à app</span>

  <div class="main">
    <header class="header">
      <div class="header-l">
        <button class="icon-btn" id="btnRecolher" title="Recolher menu">

        <div><h2 id="hTitulo">Escolas</h2><div class="breadcrumb" id="hSub"></div></div>
      </div>
      <div class="header-r">

    <div class="content">

      <section class="view" id="vSessoes"></section>
      <section class="view" id="vSelos"></section>
      <section class="view" id="vTestes"></section>
      <section class="view" id="vTeste"></section>
      <section class="view" id="vAvals"></section>
      <section class="view" id="vApl"></section>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
const SUPA_URL='https://qgfzbyhfyqvmmmdiqycu.supabase.co';
const SUPA_KEY='sb_publishable_atlEEoeN4-CWY8mD7KQNsw_m1cXjdIE';
const CHAVE='crm-repo-root', TEMA='crm-repo-tema';
const LINK_TURMA='https://crm.cr0x.org/repo/';
const MARCADORES=['{nome}','{titulo}','{turma}','{modulo}'];

const I={
  pasta:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  louro:'M12 21c-3-1.6-4.5-4.4-4.5-7.5C7.5 9 9.5 5.5 12 3c2.5 2.5 4.5 6 4.5 10.5 0 3.1-1.5 5.9-4.5 7.5M12 12.5c-1.7-.6-3-1.9-3.6-3.6M12 12.5c1.7-.6 3-1.9 3.6-3.6M12 17c-1.7-.6-3-1.9-3.6-3.6M12 17c1.7-.6 3-1.9 3.6-3.6',
  mail:'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l9 6 9-6',
  gente:'M16 19v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6M21 19v-2a4 4 0 0 0-3-3.9',
  escola:'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 11h.01M15 11h.01M9 14h.01M15 14h.01',
  link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',
  mais:'M12 5v14M5 12h14',
  lapis:'M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16zM14 6l4 4',
  lixo:'M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13',
  olho:'M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',
  lista:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  copiar:'M9 9h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1',
  refrescar:'M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15',
  seta:'M19 12H5M12 19l-7-7 7-7',
  cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z',
  sol:'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
  lua:'M21 13a8 8 0 1 1-10-10 6 6 0 0 0 10 10',
  ok:'M20 6 9 17l-5-5',
  alerta:'M12 9v4m0 4h.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0',
  cima:'M12 19V5M5 12l7-7 7 7',
  baixo:'M12 5v14M19 12l-7 7-7-7',
  grafico:'M3 3v18h18M7 15l3-4 3 3 5-7',
  tranca:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  papel:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6'
};
// width/height por omissão: sem isto, um SVG sem regra de CSS renderiza
// gigante. Onde há regra (.btn svg, .nav-link svg…) o CSS ganha à mesma.
const ic=(n,c='')=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${c}"><path d="${I[n]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const dt=s=>s?new Date(s).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

let sessao=null, escolas=[], escolaAtual=null, geridas=[], sessoes=[], turmaAtual=null;

/* ---------- Tema ---------- */
function aplicarTema(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem(TEMA,t);
  $('#btnTema').innerHTML=ic(t==='dark'?'sol':'lua');
}
$('#btnTema').addEventListener('click',()=>
  aplicarTema(document.documentElement.dataset.theme==='dark'?'light':'dark'));

/* ---------- Supabase ---------- */
async function rpc(nome,args){
  const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${nome}`,{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  });
  const d=await r.json().catch(()=>null);
  if(!r.ok){
    const bruto=(d&&(d.message||d.hint))||'ERRO';
    const m=bruto.match(/SEM_PERMISSAO|NAO_ENCONTRADO|DADOS_EM_FALTA|CREDENCIAIS_INVALIDAS|TURMA_NAO_EXISTE|JA_ENVIADA/);
    throw new Error(m?m[0]:bruto);
  }
  return d;
}
async function edge(nome,body){
  const r=await fetch(`${SUPA_URL}/functions/v1/${nome}`,{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.json().catch(()=>({ok:false,erro:'RESPOSTA_INVALIDA'}));
}
const ERROS={
  SEM_PERMISSAO:'A sessão expirou ou a palavra-passe mudou. Entra outra vez.',
  CREDENCIAIS_INVALIDAS:'Palavra-passe errada.',
  TURMA_NAO_EXISTE:'Essa turma não existe no CRM.',
  DADOS_EM_FALTA:'Falta preencher campos obrigatórios.',
  NAO_ENCONTRADO:'Já não existe.',
  JA_ENVIADA:'Esta sessão já foi enviada - já não se edita.',
  SEM_RESEND:'O envio de email não está configurado no servidor.',
  CHAVE_POR_CONFIRMAR:'Confirma as respostas certas do teste antes de o aplicares a uma turma.',
  TESTE_VAZIO:'Este teste ainda não tem perguntas.',
  SEM_TITULO:'Falta o título do teste.',
  SEM_SESSAO:'Esta aplicação perdeu a sessão de envio. Aplica o teste outra vez.'
};
function toast(msg,tipo){
  const t=document.createElement('div');
  t.className='toast'+(tipo?' '+tipo:'');
  t.innerHTML=`${ic(tipo==='err'||tipo==='warn'?'alerta':'ok')}<div><strong>${esc(ERROS[msg]||msg)}</strong></div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(),4600);
}
function tratar(e){
  const m=e&&e.message||String(e);
  toast(m,'err');
  if(m==='SEM_PERMISSAO') sair();
}

/* ---------- Entrada ---------- */
$('#loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=$('#btnLogin'); b.disabled=true; b.textContent='A entrar...'; $('#loginErr').textContent='';
  try{
    const d=await rpc('login_root',{p_password:$('#fPass').value});
    sessao={token:d.token};
    localStorage.setItem(CHAVE,JSON.stringify(sessao));
    await arrancar();
  }catch(e){
    const m=e&&e.message||String(e);
    $('#loginErr').textContent=ERROS[m]||m;
  }
  b.disabled=false; b.textContent='Entrar';
});
function sair(){
  if(sessao) rpc('logout_root',{p_token:sessao.token}).catch(()=>{});
  sessao=null; turmaAtual=null; localStorage.removeItem(CHAVE);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#fPass').value='';
}
$('#btnSair').addEventListener('click',sair);

/* ---------- Navegação ---------- */
$('#btnRecolher').addEventListener('click',()=>$('#app').classList.toggle('nav-collapsed'));
$('#pesquisa').addEventListener('input',filtrar);
function filtrar(){
  const q=($('#pesquisa').value||'').trim().toLowerCase();
  const vista=document.querySelector('.view.active');
  if(!vista) return;
  vista.querySelectorAll('.tc, tbody tr').forEach(el=>{
    el.style.display=(!q||el.textContent.toLowerCase().includes(q))?'':'none';
  });
}
let accaoPrimaria=null;
$('#btnPrimario').addEventListener('click',()=>{
  if(accaoPrimaria) return accaoPrimaria();
  if(turmaAtual) modalSessao(turmaAtual,null);
});

// Item de navegação "Escolas" (é o único): ícone, texto e função de voltar
// ao início. As escolas criam-se no #admin da landing; aqui só se escolhem.
(function(){
  const b=$('.nav-link[data-view="escolas"]');
  b.innerHTML=ic('escola')+'<span class="lbl">Escolas</span>';
  b.addEventListener('click',mostrarEscolas);
  const bt=$('.nav-link[data-view="testes"]');
  bt.innerHTML=ic('papel')+'<span class="lbl">Testes</span>';
  bt.addEventListener('click',mostrarTestes);
})();

/* A hierarquia é Escolas -> Turmas -> Sessões. Só uma vista está ativa. */
function mostrarVista(id){
  accaoPrimaria=null;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));
}
function rotuloVoltar(){
  if(!escolaAtual) return 'Turmas';
  return escolaAtual.slug?('Turmas de '+esc(escolaAtual.nome||escolaAtual.slug)):'Turmas sem escola';
}
function voltarATurmas(){ escolaAtual?abrirEscola(escolaAtual):mostrarEscolas(); }

function mostrarEscolas(){
  escolaAtual=null; turmaAtual=null;
  mostrarVista('vEscolas');
  $('#hTitulo').textContent='Escolas'; $('#hSub').textContent='As escolas da plataforma - escolhe uma para ver as turmas';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  marcarNavEscola();
  carregarEscolas().then(filtrar);
}
function abrirEscola(e){
  escolaAtual=e; turmaAtual=null;
  mostrarVista('vTurmas');
  $('#hTitulo').textContent=e.slug?(e.nome||e.slug):'Sem escola';
  $('#hSub').textContent=e.slug
    ? 'Escola '+e.slug+' · '+e.n_turmas+' turma'+(e.n_turmas==1?'':'s')
    : 'Turmas antigas, ainda sem escola atribuída';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  marcarNavEscola();
  carregarTurmas(e).then(filtrar);
}
function abrirTurma(t){
  turmaAtual=t;
  mostrarVista('vSessoes');
  $('#hTitulo').textContent=t.nome||('Turma '+t.codigo);
  $('#hSub').textContent=(escolaAtual&&escolaAtual.slug?(escolaAtual.nome||escolaAtual.slug)+' · ':'')
    +'Turma '+t.codigo+' · '+t.n_formandos+' formandos';
  $('#btnPrimario').classList.remove('hidden');
  $('#btnPrimario').innerHTML=ic('mais')+'Nova sessão';
  $('#pesquisa').value='';
  pintarNavEscolas();
  carregarSessoes(t).then(filtrar);
}

async function arrancar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  mostrarEscolas();
}

/* ---------- Escolas ---------- */
async function carregarEscolas(){
  try{ escolas=await rpc('repo_escolas',{p_token:sessao.token}); }
  catch(e){ return tratar(e); }
  const ativas=escolas.filter(e=>!e.arquivado), arq=escolas.filter(e=>e.arquivado);
  const cartao=e=>`
        <article class="card tc ${e.arquivado?'tc-arq':''}">
          <div class="tc-meta">
            <span class="tag">${e.slug?esc(e.slug):'sem escola'}</span>
            ${e.arquivado?'<span class="pill grey">Arquivada</span>':''}
          </div>
          <div class="esc-cab">
            ${e.logo_url?`<img class="esc-logo" src="${esc(e.logo_url)}" alt="">`:`<span class="esc-logo esc-logo-vazio">${ic('escola')}</span>`}
            <h3>${esc(e.nome)||esc(e.slug)}</h3>
          </div>
          <div class="muted" style="font-size:.8rem">${e.n_turmas} turma${e.n_turmas==1?'':'s'} · ${e.n_geridas} no Repo</div>
          <div class="tc-foot">
            ${e.slug?`<button class="tc-lixo" data-apagar="${esc(e.slug)}" title="Apagar a escola e tudo o que está dentro">${ic('lixo')}</button>
            <a class="btn-sec btn-sm" href="../${esc(e.slug)}" target="_blank" rel="noopener">${ic('link')}Abrir o CRM</a>`:''}
            <button class="btn btn-sm" data-abrir-escola="${esc(e.slug)}">${ic('gente')}Turmas</button>
          </div>
        </article>`;
  $('#vEscolas').innerHTML = !escolas.length
    ? `<div class="empty">${ic('escola')}<strong>Ainda não há escolas</strong>
        <span>As escolas criam-se no painel de administração da plataforma (crm.cr0x.org/#admin).</span></div>`

/* ---------- Apagar a sério ----------
   Apaga mesmo: a escola leva as turmas, e a turma leva os formandos, as
   entregas, os badges, as sessões e os acessos. Não se desfaz, por isso a
   confirmação diz primeiro o que vai levar e pede um código de 4 dígitos
   escrito à mão - a ideia é obrigar a ler, não a carregar. */
const plural=(n,um,muitos)=>n+' '+(n==1?um:muitos);
function faltaSql(err,ficheiro){
  if(!/PGRST202|Could not find the function/.test((err&&err.message)||'')) return false;
  toast('Falta correr o SQL '+ficheiro+' no Supabase.','err');
  return true;
}
function uiConfirmCodigo({titulo,texto,ok='Apagar'}){
  const cod=String(Math.floor(1000+Math.random()*9000));
  return new Promise(res=>{
    const f=abrirModal(`<div class="modal" style="width:min(500px,100%)">
      <div class="modal-head"><div><h3>${esc(titulo)}</h3></div></div>
      <div class="modal-body">
        <div style="font-size:.92rem">${texto}</div>
        <div class="cod-caixa">
          <div><span class="hint">Escreve este código para confirmar</span><strong class="cod">${cod}</strong></div>
          <input class="cod-in" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="----" aria-label="Código de confirmação">
        </div>
      </div>
      <div class="modal-foot"><span></span>
        <div style="display:flex;gap:10px">
          <button class="btn-sec" data-nao>Cancelar</button>
          <button class="btn-danger" data-sim disabled>${esc(ok)}</button>
        </div></div></div>`);
    const inp=f.querySelector('.cod-in'), b=f.querySelector('[data-sim]');
    const fecha=v=>{ f.remove(); res(v); };
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/\D/g,'').slice(0,4);
      b.disabled=inp.value!==cod;
    });
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!b.disabled){ ev.preventDefault(); fecha(true); } });
    b.addEventListener('click',()=>fecha(true));
    f.querySelector('[data-nao]').addEventListener('click',()=>fecha(false));
    const obs=new MutationObserver(()=>{ if(!document.body.contains(f)){ obs.disconnect(); res(false); } });
    obs.observe(document.body,{childList:true});
    setTimeout(()=>inp.focus(),60);
  });
}

async function apagarEscola(e){
  if(!e||!e.slug) return;
  let lista=[];
  try{ lista=await rpc('repo_turmas_da_escola',{p_token:sessao.token,p_slug:e.slug}); }
  catch(err){ return tratar(err); }
  const nf=lista.reduce((s,t)=>s+(+t.n_formandos||0),0);
  const ns=lista.reduce((s,t)=>s+(+t.n_sessoes||0),0);
  const ok=await uiConfirmCodigo({titulo:`Apagar a escola ${e.nome||e.slug}?`,ok:'Apagar a escola',
    texto:`<strong>Apaga tudo o que está dentro e não se desfaz.</strong>
      <ul class="perda">
        <li>${plural(lista.length,'turma','turmas')}${lista.length?': '+lista.map(t=>esc(t.codigo)).join(', '):''}</li>
        <li>${plural(nf,'formando','formandos')}, com as entregas, os badges e os registos de acesso</li>
        <li>${plural(ns,'sessão','sessões')} do Repo e o histórico de envios</li>
        <li>a identidade da escola e o endereço <code>crm.cr0x.org/${esc(e.slug)}</code></li>
      </ul>`});
  if(!ok) return;
  let r;
  try{ r=await rpc('espaco_apagar',{p_token:sessao.token,p_id:e.id}); }
  catch(err){ if(faltaSql(err,'05-apagar-a-serio.sql')) return; return tratar(err); }
  toast(`Escola apagada. Levou ${plural(r.turmas,'turma','turmas')} e ${plural(r.formandos,'formando','formandos')}.`);
  mostrarEscolas();
}

async function apagarTurma(t){
  if(!t) return;
  const ok=await uiConfirmCodigo({titulo:`Apagar a turma ${t.codigo}?`,ok:'Apagar a turma',
    texto:`<strong>Apaga a turma do CRM inteiro, não só do Repo. Não se desfaz.</strong>
      <ul class="perda">
        <li>${plural(+t.n_formandos||0,'formando','formandos')}, com as entregas, os badges e os registos de acesso</li>
        <li>${plural(+t.n_sessoes||0,'sessão','sessões')} do Repo e o histórico de envios</li>
        <li>as propostas que os formandos publicaram online</li>
      </ul>
      <span class="hint">Se só a queres fora do Repo, usa "Tirar do Repo" nas Definições da turma.</span>`});
  if(!ok) return;
  let r;
  try{ r=await rpc('turma_apagar',{p_token:sessao.token,p_codigo:t.codigo}); }
  catch(err){ if(faltaSql(err,'05-apagar-a-serio.sql')) return; return tratar(err); }
  toast(`Turma ${r.codigo} apagada.`);
  if(turmaAtual&&turmaAtual.codigo===t.codigo) turmaAtual=null;
  const slug=escolaAtual&&escolaAtual.slug;
  await carregarEscolas();
  const ainda=escolas.find(x=>x.slug===slug);
  if(ainda) abrirEscola(ainda); else mostrarEscolas();
}

/* ---------- As escolas na barra lateral ----------
   Um item por escola (as arquivadas não), com lápis ao passar o rato: o nome
   vira campo, Enter guarda pela espaco_guardar, Esc desiste. O grupo "Sem
   escola" não é uma escola: dar-lhe um nome CRIA a escola e move as turmas
   do grupo para lá (também se podem mover uma a uma, no cartão). */
function pintarNavEscolas(){
  const n=$('#navEscolas'); if(!n) return;
  const vivas=escolas.filter(e=>!e.arquivado);
  n.innerHTML=vivas.map(e=>`
    <div class="nav-link nav-escola" data-escola="${esc(e.slug)}" title="${esc(e.nome||e.slug||'Turmas sem escola')}">
      ${e.logo_url?`<img class="nav-esc-logo" src="${esc(e.logo_url)}" alt="">`
                  :`<span class="nav-esc-ini">${e.slug?esc((e.nome||e.slug).trim().charAt(0).toUpperCase()):'?'}</span>`}
      <span class="lbl">${e.slug?esc(e.nome||e.slug):'Sem escola'}</span>
      <button class="lapis" data-renomear="${esc(e.slug)}" title="${e.slug?'Mudar o nome':'Dar um nome: cria a escola e move estas turmas para lá'}">${ic('lapis')}</button>
    </div>${escolaAtual&&escolaAtual.slug===e.slug?subTurmas():''}`).join('')||'<div class="nav-vazio">Ainda sem escolas</div>';
  n.querySelectorAll('.nav-escola').forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.closest('.lapis, input')) return;
    abrirEscola(escolas.find(e=>e.slug===el.dataset.escola));
  }));
  n.querySelectorAll('[data-nav-turma]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const t=geridas.find(x=>x.codigo===b.dataset.navTurma); if(!t) return;
    if(t.gerida) abrirTurma(t); else modalAdicionarTurma(t);
  }));
  n.querySelectorAll('[data-renomear]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    editarNomeEscola(escolas.find(e=>e.slug===b.dataset.renomear), b.closest('.nav-escola'));
  }));
  marcarNavEscola();
}
/* As turmas da escola aberta, por baixo dela. Saem do `geridas`, que é o
   que a vista das turmas acabou de carregar - não se pede nada outra vez. */
function subTurmas(){
  if(!geridas.length) return '<div class="nav-sub"><div class="nav-vazio">sem turmas</div></div>';
  return `<div class="nav-sub">${geridas.map(t=>`
    <button class="nav-turma${turmaAtual&&turmaAtual.codigo===t.codigo?' active':''}${t.gerida?'':' fora'}"
      data-nav-turma="${esc(t.codigo)}" title="${t.gerida?esc('Turma '+t.codigo):'Ainda não está no Repo - carrega para adicionar'}">
      <span class="lbl">${esc(t.nome||('Turma '+t.codigo))}</span>
      ${t.gerida?'':'<span class="nav-turma-fora">'+ic('mais')+'</span>'}
    </button>`).join('')}</div>`;
}
function marcarNavEscola(){
  document.querySelectorAll('.nav-escola').forEach(el=>
    el.classList.toggle('active', !!escolaAtual && el.dataset.escola===escolaAtual.slug));
  const emTestes=!!document.querySelector('#vTestes.active, #vTeste.active');
  $('.nav-link[data-view="escolas"]').classList.toggle('active', !escolaAtual && !emTestes);
  const bt=$('.nav-link[data-view="testes"]'); if(bt) bt.classList.toggle('active', emTestes);
}
function editarNomeEscola(e,el){
  const lbl=el.querySelector('.lbl'); const antes=e.nome||e.slug;
  const inp=document.createElement('input');
  inp.className='nav-esc-input'; inp.value=antes; inp.maxLength=60; inp.setAttribute('aria-label','Nome da escola');
  lbl.replaceWith(inp); el.classList.add('a-editar'); inp.focus(); inp.select();
  let feito=false;
  const termina=async guardar=>{
    if(feito) return; feito=true;
    const nome=inp.value.trim();
    if(!guardar||!nome||nome===antes){ pintarNavEscolas(); return; }
    try{
      if(!e.slug){ await criarEscolaDasSemEscola(nome); return; }
      await rpc('espaco_guardar',{p_token:sessao.token,p_id:e.id,p_dados:{slug:e.slug,nome}});
      e.nome=nome; toast('Nome guardado.');
      if(escolaAtual&&escolaAtual.slug===e.slug) $('#hTitulo').textContent=nome;
      if($('#vEscolas').classList.contains('active')) carregarEscolas(); else pintarNavEscolas();
    }catch(err){ tratar(err); pintarNavEscolas(); }
  };
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); termina(true); }
    if(ev.key==='Escape'){ ev.preventDefault(); termina(false); }
  });
  inp.addEventListener('blur',()=>termina(true));
  inp.addEventListener('click',ev=>ev.stopPropagation());
}
/* Slug a partir do nome (o espaco_guardar exige ^[a-z0-9][a-z0-9-]{1,30}$), sem
   colidir com os que já existem. */
function slugDe(nome){
  let s=nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,31);
  if(!/^[a-z0-9]/.test(s)) s='e'+s;
  if(s.length<2) s+='1';
  const usados=new Set(escolas.map(x=>x.slug)); const base=s; let i=2;
  while(usados.has(s)) s=base.slice(0,28)+'-'+(i++);
  return s;
}
async function criarEscolaDasSemEscola(nome){
  const slug=slugDe(nome);
  await rpc('espaco_guardar',{p_token:sessao.token,p_id:null,p_dados:{slug,nome}});
  const turmas=await rpc('repo_turmas_da_escola',{p_token:sessao.token,p_slug:''});
  for(const t of turmas) await rpc('turma_mover',{p_token:sessao.token,p_codigo:t.codigo,p_slug:slug});
  const n=turmas.length;
  toast(`Escola "${nome}" criada · ${n} turma${n==1?'':'s'} movida${n==1?'':'s'}.`);
  await carregarEscolas();
  const nova=escolas.find(x=>x.slug===slug);
  if(nova) abrirEscola(nova); else mostrarEscolas();
}
function moverSel(t){
  const ops=escolas.filter(s=>s.slug&&!s.arquivado&&(!escolaAtual||s.slug!==escolaAtual.slug));
  if(!ops.length) return '';
  return `<label class="mover"><span>Mover para</span><select data-mover="${esc(t.codigo)}" aria-label="Mover a turma para uma escola">
    <option value="">escolher a escola…</option>${ops.map(s=>`<option value="${esc(s.slug)}">${esc(s.nome||s.slug)}</option>`).join('')}</select></label>`;
}
async function moverTurma(codigo,slug){
  try{ await rpc('turma_mover',{p_token:sessao.token,p_codigo:codigo,p_slug:slug}); }
  catch(e){ return tratar(e); }
  const destino=escolas.find(e=>e.slug===slug);
  toast(`Turma ${codigo} movida para ${destino?(destino.nome||destino.slug):slug}.`);
  const antes=escolaAtual&&escolaAtual.slug;
  await carregarEscolas();
  const ainda=escolas.find(e=>e.slug===antes);
  if(ainda) abrirEscola(ainda); else mostrarEscolas();
}

/* ---------- Turmas de uma escola ----------
   Todas as do CRM: as que já estão no Repo abrem-se; as outras têm "Adicionar". */

          <div class="tc-drive ${t.drive_url?'':'falta'}">${ic('pasta')}${t.drive_url?esc(t.drive_url.replace(/^https?:\/\//,'').slice(0,42)):'Falta a pasta do Drive'}</div>
          <div class="muted" style="font-size:.8rem">${t.n_formandos} formandos · último envio: ${t.ultimo_envio?dt(t.ultimo_envio):'nunca'}</div>
          ${moverSel(t)}
          <div class="tc-foot">
            <button class="tc-lixo" data-apagar-turma="${esc(t.codigo)}" title="Apagar a turma do CRM">${ic('lixo')}</button>

          <h3>${esc(t.nome)||'<span class="muted">Sem nome</span>'}<button class="lapis lapis-t" data-nome-turma="${esc(t.codigo)}" title="Mudar o nome da turma">${ic('lapis')}</button></h3>
          <div class="muted" style="font-size:.8rem">${t.n_formandos} formandos</div>
          ${moverSel(t)}
          <div class="tc-foot">
            <button class="tc-lixo" data-apagar-turma="${esc(t.codigo)}" title="Apagar a turma do CRM">${ic('lixo')}</button>
            <button class="btn btn-sm" data-adicionar="${esc(t.codigo)}">${ic('mais')}Adicionar ao Repo</button>
          </div>
        </article>`).join('')}</div>`);

  $('#voltarEscolas').addEventListener('click',mostrarEscolas);
  document.querySelectorAll('[data-abrir]').forEach(b=>b.addEventListener('click',
    ()=>abrirTurma(geridas.find(t=>t.id===b.dataset.abrir))));
  document.querySelectorAll('[data-cfg]').forEach(b=>b.addEventListener('click',
    ()=>modalTurma(geridas.find(t=>t.id===b.dataset.cfg))));
  document.querySelectorAll('[data-selos]').forEach(b=>b.addEventListener('click',
    ()=>abrirSelos(geridas.find(t=>t.id===b.dataset.selos))));
  document.querySelectorAll('[data-avals]').forEach(b=>b.addEventListener('click',

    ()=>{ if(s.value) moverTurma(s.dataset.mover,s.value); }));
  document.querySelectorAll('[data-apagar-turma]').forEach(b=>b.addEventListener('click',
    ()=>apagarTurma(geridas.find(t=>t.codigo===b.dataset.apagarTurma))));
  document.querySelectorAll('[data-nome-turma]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    editarNomeTurma(geridas.find(t=>t.codigo===b.dataset.nomeTurma), b);
  }));

}

/* Mudar o nome da turma no próprio cartão. O nome é da turma no CRM (não do
   Repo), por isso quem o guarda é a função de sempre, root_renomear_turma. */
function editarNomeTurma(t,el){
  const h=el.closest('h3'); if(!h) return;
  const antes=t.nome||'';
  const inp=document.createElement('input');
  inp.className='nome-in'; inp.value=antes; inp.maxLength=80;
  inp.setAttribute('aria-label','Nome da turma');
  h.replaceWith(inp); inp.focus(); inp.select();
  let feito=false;
  const termina=async guardar=>{
    if(feito) return; feito=true;
    const nome=inp.value.trim();
    if(guardar && nome!==antes){
      try{
        await rpc('root_renomear_turma',{p_token:sessao.token,p_codigo:t.codigo,p_nome:nome});
        toast('Nome guardado.');
      }catch(e){ tratar(e); }
    }
    carregarTurmas(escolaAtual);
  };
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); termina(true); }
    if(ev.key==='Escape'){ ev.preventDefault(); termina(false); }
  });
  inp.addEventListener('blur',()=>termina(true));
  inp.addEventListener('click',ev=>ev.stopPropagation());
}

function abrirModal(html){
  const f=document.createElement('div'); f.className='modal-back open'; f.innerHTML=html;
  f.addEventListener('click',e=>{ if(e.target===f) f.remove(); });
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){ f.remove(); document.removeEventListener('keydown',esc); }
  });
  document.body.appendChild(f);
  f.querySelectorAll('[data-fechar]').forEach(b=>b.addEventListener('click',()=>f.remove()));
  return f;
}
function uiConfirm({titulo='Confirmar',texto='',ok='Confirmar',perigo=false}){

    const f=abrirModal(`<div class="modal" style="width:min(460px,100%)">

          <button class="${perigo?'btn-danger':'btn'}" data-sim>${esc(ok)}</button>
        </div></div></div>`);
    const fecha=v=>{ f.remove(); res(v); };
    f.querySelector('[data-sim]').addEventListener('click',()=>fecha(true));
    f.querySelector('[data-nao]').addEventListener('click',()=>fecha(false));
    const obs=new MutationObserver(()=>{ if(!document.body.contains(f)){ obs.disconnect(); res(false); } });
    obs.observe(document.body,{childList:true});
  });
}

/* ---------- Sessões ---------- */
async function carregarSessoes(t){
  try{ sessoes=await rpc('repo_sessoes_listar',{p_token:sessao.token,p_repo_turma_id:t.id}); }
  catch(e){ return tratar(e); }
  /* Os badges e as avaliações também são sessões por dentro, mas têm ecrã
     próprio: aqui só se listam os avisos de material. (O tipo só chega
     depois do 09-testes.sql; até lá vêm todas, como vinham.) */
  sessoes=sessoes.filter(s=>!s.tipo||s.tipo==='sessao');

  const estado=s=>{
    if(!s.enviado_em) return '<span class="pill amber">Rascunho</span>';
    if((s.enviados||0)<(s.destinatarios||0)) return `<span class="pill amber">Parcial · ${s.enviados}/${s.destinatarios}</span>`;
    return `<span class="pill grey">Enviada · ${dt(s.enviado_em)}</span>`;
  };
  const topo=`<button class="voltar" id="voltarTurmas">${ic('seta')}${rotuloVoltar()}</button>
    <div class="section-head" style="margin-bottom:16px">
      <div><h3>${esc(t.nome||('Turma '+t.codigo))}</h3>
        <div class="sub">${t.drive_url?'Pasta: '+esc(t.drive_url.replace(/^https?:\/\//,'').slice(0,50)):'<span style="color:var(--warn)">Falta a pasta do Drive - define em Definições</span>'}</div></div>
      <button class="chip" id="copiarLink">${ic('link')} Copiar link da turma</button>
    </div>`;

  $('#vSessoes').innerHTML = topo + (!sessoes.length
    ? `<div class="empty">${ic('mail')}<strong>Ainda não há sessões</strong>
        <span>Carrega em "Nova sessão" para avisar a turma de que a pasta tem material novo.</span></div>`
    : `<div class="table-wrap"><table><thead><tr>
        <th>Sessão</th><th>Estado</th><th>Abriram</th><th></th>
      </tr></thead><tbody>${sessoes.map(s=>{
        const pct=s.destinatarios?Math.round(s.abriram/s.destinatarios*100):0;
        const cor=!s.abriram?'grey':pct>=70?'green':'amber';
        return `<tr class="clickable" data-ver="${s.id}">
          <td><div class="cell-main">${s.modulo?`<span class="tag" style="margin-right:7px">${esc(s.modulo)}</span>`:''}${esc(s.titulo)}</div><div class="cell-sub">${s.criado_em?dt(s.criado_em):''}</div></td>
          <td>${estado(s)}</td>
          <td>${s.enviado_em?`<span class="pill ${cor}">${s.abriram}/${s.destinatarios} · ${pct}%</span>`:'<span class="muted">-</span>'}</td>
          <td class="t-right muted">${s.enviado_em?ic('olho'):ic('lapis')}</td>
        </tr>`;}).join('')}</tbody></table></div>`);

  $('#voltarTurmas').addEventListener('click',voltarATurmas);
  $('#copiarLink').addEventListener('click',()=>{
    navigator.clipboard?.writeText(LINK_TURMA);
    toast('Link copiado. Os formandos recebem-no por email, personalizado.');
  });
  document.querySelectorAll('[data-ver]').forEach(r=>r.addEventListener('click',()=>{
    const s=sessoes.find(x=>x.id===r.dataset.ver);
    if(!s.enviado_em) modalSessao(t,s); else modalEstado(s);
  }));
}

/* ================== SELOS ==================
   O mesmo mecanismo das sessões, com uma diferença: cada pessoa vai para um
   destino diferente - o seu selo. Vive numa "sessão" chamada "Selo de
   conclusão", criada sozinha na primeira vez que se abre este ecrã.

   O botão envia a UMA pessoa de cada vez, de propósito: são poucos, e assim
   vê-se o que aconteceu a cada um antes de avançar para o seguinte. ====== */
let selosSess=null, selosEmail=null, selosCumLaude=null;

async function abrirSelos(t){
  turmaAtual=t; selosSess=null;
  mostrarVista('vSelos');
  $('#hTitulo').textContent='Badges · '+(t.nome||('Turma '+t.codigo));
  $('#hSub').textContent='Turma '+t.codigo+' · '+t.n_formandos+' formandos';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  pintarNavEscolas();
  $('#vSelos').innerHTML='<div class="empty"><strong>A preparar…</strong></div>';
  try{
    const p=await rpc('repo_selos_preparar',{p_token:sessao.token,p_repo_turma_id:t.id});
    selosSess=p&&p.sessao_id; selosEmail=p||null;
  }catch(e){ return tratar(e); }

  /* Emitir os que faltam AO ABRIR: assim chega-se a este ecra com toda a gente
     ja com o seu badge, e o unico botao a carregar e o "Enviar". Quem ja tem
     fica como esta - o servidor so cria para quem nao tem. */
  try{ await rpc('badges_emitir',{p_token:sessao.token,p_repo_turma_id:t.id}); }
  catch(e){
    if(/PGRST202|Could not find the function/.test((e&&e.message)||'')) toast('Falta correr o SQL 07-badges.sql no Supabase.','err');
    else tratar(e);
  }

  carregarSelos(t);
}

async function carregarSelos(t){
  let lista;
  /* quem tem o cum laude: pergunta-se à parte, para não mexer no repo_selos,
     que vive no SQL do projeto antigo e é lido pelas duas apps */
  try{ selosCumLaude=await rpc('badge_cum_laude_de',{p_token:sessao.token,p_repo_turma_id:t.id}); }
  catch(e){ selosCumLaude=null; }
  try{ lista=await rpc('repo_selos',{p_token:sessao.token,p_repo_turma_id:t.id}); }
  catch(e){ return tratar(e); }

  const semDestino=lista.filter(x=>!x.destino).length;
  const topo=`<button class="voltar" id="voltarTurmas2">${ic('seta')}${rotuloVoltar()}</button>
    <div class="section-head" style="margin-bottom:16px">
      <div><h3>Badges de conclusão</h3>
        <div class="sub">Cada formando recebe o link do seu badge em crm.cr0x.org.${
          semDestino?` <span style="color:var(--warn)">${semDestino} ainda sem badge gerado.</span>`:''}</div></div>
      <button class="chip" id="verEmailBadge">${ic('mail')} Texto do email</button>
    </div>`;

  $('#vSelos').innerHTML = topo + (!lista.length
    ? `<div class="empty">${ic('gente')}<strong>Sem formandos com email</strong>
        <span>Os badges enviam-se para o email pessoal de cada formando.</span></div>`
    : `<div class="table-wrap"><table><thead><tr>
        <th>Formando</th><th>Badge</th><th title="Um por turma, dado por si">Cum laude</th><th>Estado</th><th>Abriu</th><th></th>
      </tr></thead><tbody>${lista.map(x=>{
        /* o que se mostra e o CODIGO, venha ele da pasta antiga (/b/CODIGO/)
           ou da pagina nova (/b/?c=CODIGO) - o endereco fica no link */
        const curto=x.destino?esc(String(x.destino).replace(/^https?:\/\/crm\.cr0x\.org\/b\//,'').replace(/^\?c=/,'').replace(/\/$/,'')):'';
        return `<tr>
          <td><div class="cell-main">${esc(x.nome)}</div><div class="cell-sub">${esc(x.email||'sem email')}</div></td>
          <td>${x.destino
              ? `<a href="${esc(x.destino)}" target="_blank" rel="noopener" class="chip">${curto}</a>`
                + `<button class="trocar" data-trocar="${esc(x.username)}" title="Trocar o badge desta pessoa">${ic('lapis')}</button>`
              : campoBadge(x.username)}</td>
          <td class="t-center">${x.destino
              ? '<button class="cl-b'+(x.user_id===selosCumLaude?' on':'')+'" data-cumlaude="'+x.user_id+'"'
                + ' title="'+(x.user_id===selosCumLaude?'Tirar o cum laude':'Dar o cum laude a esta pessoa')+'"'
                + ' aria-pressed="'+(x.user_id===selosCumLaude)+'">'+ic('louro')
                + (x.user_id===selosCumLaude?'Cum laude':'Dar')+'</button>'
              : '<span class="muted">-</span>'}</td>
          <td>${x.bloqueado
              ? '<span class="pill red">Não aprovado</span>'
              : x.erro
              ? `<span class="pill red" title="${esc(x.erro)}">Erro</span>`
              : x.enviado_em ? `<span class="pill green">Enviado · ${dt(x.enviado_em)}</span>`
                             : '<span class="pill amber">Por enviar</span>'}</td>
          <td>${x.cliques ? `<span class="pill grey">${x.cliques}×</span>` : '<span class="muted">-</span>'}</td>
          <td class="t-right" style="white-space:nowrap">${x.bloqueado
              ? `<button class="btn-sec btn-sm" data-destrancar="${x.acesso_id}">Destrancar</button>`
              : `${x.destino
                  ? (x.enviado_em && !x.erro
                      ? `<button class="btn-sec btn-sm" data-reenviar="${x.acesso_id}">Reenviar</button>`
                      : `<button class="btn btn-sm" data-enviar="${x.acesso_id}">Enviar</button>`)
                  : ''}
                 ${x.enviado_em ? '' : `<button class="btn-danger btn-sm" data-trancar="${x.acesso_id}" title="Não aprovado - tranca o envio">Não aprovado</button>`}`}</td>
        </tr>`;}).join('')}</tbody></table></div>`);

  $('#voltarTurmas2').addEventListener('click',voltarATurmas);
  document.querySelectorAll('[data-enviar]').forEach(b=>b.addEventListener('click',
    ()=>enviarSelo(t,b.dataset.enviar,b)));
  document.querySelectorAll('[data-reenviar]').forEach(b=>b.addEventListener('click',
    ()=>reenviarSelo(t,b.dataset.reenviar,b)));
  document.querySelectorAll('[data-trancar]').forEach(b=>b.addEventListener('click',
    ()=>trancarSelo(t,b.dataset.trancar,true)));
  document.querySelectorAll('[data-destrancar]').forEach(b=>b.addEventListener('click',
    ()=>trancarSelo(t,b.dataset.destrancar,false)));
  document.querySelectorAll('[data-cod]').forEach(b=>b.addEventListener('click',()=>{
    const i=document.querySelector(`[data-cod-in="${b.dataset.cod}"]`);
    guardarBadge(t, b.dataset.cod, i&&i.value);
  }));
  document.querySelectorAll('[data-cod-in]').forEach(i=>i.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); guardarBadge(t, i.dataset.codIn, i.value); }
  }));
  document.querySelectorAll('[data-trocar]').forEach(b=>b.addEventListener('click',()=>{
    const td=b.closest('td'); td.innerHTML=campoBadge(b.dataset.trocar);
    const i=td.querySelector('input'); i.focus();
    td.querySelector('[data-cod]').addEventListener('click',()=>guardarBadge(t,b.dataset.trocar,i.value));
    i.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); guardarBadge(t,b.dataset.trocar,i.value); } });
  }));
  document.querySelectorAll('[data-cumlaude]').forEach(b=>b.addEventListener('click',()=>darCumLaude(t, b.dataset.cumlaude)));
  const vb=$('#verEmailBadge');
  if(vb) vb.addEventListener('click',()=>modalEmailBadge(t));
}

/* ---------- Atribuir o badge de cada formando ----------
   O gerador (ferramentas/gerar-badges.mjs) cria as paginas e imprime os
   codigos; aqui diz-se qual e o de quem. Aceita o codigo solto ou o endereco
   inteiro colado do browser - a pessoa acabou de o ter aberto. */
function campoBadge(username){
  return `<span class="cod-b"><input data-cod-in="${esc(username)}" placeholder="código" maxlength="120" aria-label="Código do badge">
    <button class="btn-sec btn-xs" data-cod="${esc(username)}">Guardar</button></span>`;
}
async function guardarBadge(t, username, valor){
  const v=String(valor||"").trim();
  if(!v) return toast("Escreve o código do badge.","err");
  const url=/^https?:\/\//i.test(v) ? v.replace(/\/?$/,"/") : "https://crm.cr0x.org/b/"+v.replace(/^\/+|\/+$/g,"")+"/";
  try{ await rpc("repo_selos_definir",{p_token:sessao.token,p_repo_turma_id:t.id,p_pares:{[username]:url}}); }
  catch(e){ return tratar(e); }
  toast("Badge atribuído.");
  carregarSelos(t);
}
/* Um por turma: marcar um tira ao anterior, e marcar o que já o tem
   tira-o a toda a gente. É uma decisão de quem deu a formação, não um
   número que se calcule - por isso é aqui, à mão, e não no snapshot. */
async function darCumLaude(t, userId){
  const tirar = userId===selosCumLaude;
  try{ await rpc('badge_cum_laude',{p_token:sessao.token,p_repo_turma_id:t.id,p_user_id:tirar?null:userId}); }
  catch(e){ return tratar(e); }
  toast(tirar?'Cum laude retirado.':'Cum laude atribuído.');
  carregarSelos(t);
}
async function enviarSelo(t,acessoId,btn){
  btn.disabled=true; btn.textContent='A enviar…';
  const r=await edge('repo-enviar',{token:sessao.token,sessao_id:selosSess,acesso_id:acessoId});
  if(r&&r.ok){ toast('Badge enviado.'); }
  else { toast('Não foi possível enviar: '+((r&&(r.erro||r.detalhe))||'erro'),'err'); }
  carregarSelos(t);
}

      </div>
      <span class="hint">Podes usar <strong>{nome}</strong> - é substituído pelo nome de cada formando.</span>
      <div class="field" style="margin-top:14px"><label>Pré-visualização</label>
        <div class="preview">
          <div class="preview-head" id="bvHead"></div>

            <div class="pv-text" id="bvTexto" style="white-space:pre-wrap"></div>

          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><span></span>

      </div>

  </div>`);

  const q=x=>f.querySelector(x);

/* Trancar vive no servidor, nao no ecra: um nao aprovado nunca entra num
   envio, mesmo que alguem carregue no botao errado noutra altura. */
async function trancarSelo(t,acessoId,bloquear){
  if(bloquear && !(await uiConfirm({titulo:'Não aprovado?',
      texto:'Fica trancado e não recebe o badge. Podes destrancar depois.',
      ok:'Trancar',perigo:true}))) return;
  try{ await rpc('repo_selo_bloquear',{p_token:sessao.token,p_acesso_id:acessoId,p_bloqueado:bloquear}); }
  catch(e){ return tratar(e); }
  toast(bloquear?'Trancado - não recebe o badge.':'Destrancado.');
  carregarSelos(t);
}

async function reenviarSelo(t,acessoId,btn){
  if(!(await uiConfirm({titulo:'Enviar outra vez?',
        texto:'A pessoa vai receber o mesmo email com o mesmo link.',ok:'Enviar'}))) return;
  try{ await rpc('repo_selo_reabrir',{p_token:sessao.token,p_acesso_id:acessoId}); }
  catch(e){ return tratar(e); }
  enviarSelo(t,acessoId,btn);
}

  const q=s=>f.querySelector(s);
  const t2=q('#pTitulo'), x=q('#pTexto');
  if(sess) x.innerHTML=sess.texto||'';

  f.querySelectorAll('.rt-tb[data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>{
    e.preventDefault(); document.execCommand(b.dataset.cmd,false,null); x.focus(); sinc();
  }));
  q('#rtLink').addEventListener('mousedown',e=>{
    e.preventDefault(); const u=prompt('Endereço da ligação:','https://');
    if(u) document.execCommand('createLink',false,u); x.focus(); sinc();
  });
  x.addEventListener('paste',e=>{
    e.preventDefault();
    document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'));
  });
  f.querySelectorAll('[data-var]').forEach(b=>b.addEventListener('click',()=>{
    navigator.clipboard?.writeText(b.dataset.var); toast(`Marcador ${b.dataset.var} copiado.`);
  }));

  const subst=s=>esc(s||'')
    .replace(/\{nome\}/g,'<span class="muted">[nome do formando]</span>')
    .replace(/\{titulo\}/g,esc(t2.value.trim()||'(sem título)'))
    .replace(/\{turma\}/g,esc(t.codigo))
    .replace(/\{modulo\}/g,esc(q('#pModulo').value.trim()));
  function sinc(){
    q('#pvHead').innerHTML=subst(q('#pCabecalho').value);
    q('#pvSaudacao').innerHTML=subst(q('#pSaudacao').value);
    q('#pvTitulo').textContent=t2.value.trim()||'(sem título)';
    q('#pvTexto').innerHTML=x.innerHTML.trim()||'<span class="muted">(a tua mensagem aparece aqui)</span>';
    q('#pvBotao').textContent=q('#pBotao').value.trim()||'Aceder à pasta';
    q('#pvRodape').innerHTML=subst(q('#pRodape').value);
    q('#pvAssunto').innerHTML='Assunto: '+subst(q('#pAssunto').value);
  }
  ['#pTitulo','#pModulo','#pAssunto','#pCabecalho','#pSaudacao','#pBotao','#pRodape'].forEach(s=>q(s).addEventListener('input',sinc));
  x.addEventListener('input',sinc); sinc();

  q('#pGuardar').addEventListener('click',async e=>{
    const b=e.currentTarget;
    const titulo=t2.value.trim(), link=q('#pLink').value.trim();
    if(!titulo||!link) return toast('Falta o título ou o link.','err');
    b.disabled=true; b.textContent='A guardar...';
    const campos={p_token:sessao.token,p_titulo:titulo,p_texto:x.innerHTML.trim(),p_link:link,
      p_modulo:q('#pModulo').value.trim(),
      p_assunto:q('#pAssunto').value.trim(),p_cabecalho:q('#pCabecalho').value.trim(),
      p_saudacao:q('#pSaudacao').value.trim(),p_botao:q('#pBotao').value.trim(),p_rodape:q('#pRodape').value.trim()};
    try{
      if(sess){
        await rpc('repo_sessao_editar',{...campos,p_id:sess.id});
        f.remove(); carregarSessoes(t);
        confirmarEnvio(sess.id, sess.destinatarios, 0);
      }else{
        const p=await rpc('repo_sessao_publicar',{...campos,p_repo_turma_id:t.id});
        f.remove(); carregarSessoes(t);
        if(!p.destinatarios) return toast('Guardado, mas nenhum formando desta turma tem email.','warn');
        confirmarEnvio(p.id, p.destinatarios, p.sem_email);
      }
    }catch(err){ tratar(err); b.disabled=false; b.innerHTML=ic('ok')+(sess?'Guardar alterações':'Guardar rascunho'); }
  });
}

async function confirmarEnvio(sessId, dest, sem){
  const ok=await uiConfirm({titulo:'Enviar o aviso agora?',ok:'Enviar agora',
    texto:`O email vai para <strong>${dest} formando(s)</strong>.`
      +(sem?`<br>${sem} sem email ficam de fora.`:'')
      +`<br><br><span class="hint">Se preferires, fica em rascunho - editas e envias depois.</span>`});
  if(!ok){ toast('Ficou em rascunho. Envias quando quiseres.','warn'); return; }
  const r=await edge('repo-enviar',{token:sessao.token,sessao_id:sessId});
  if(turmaAtual) carregarSessoes(turmaAtual);
  if(!r.ok) return toast(r.erro||'O envio falhou. A sessão ficou guardada.','err');
  if(r.falhados) return toast(`Enviado a ${r.enviados}, falhou em ${r.falhados}.`,'warn');
  if(!r.enviados) return toast('Nada por enviar - já estavam todos avisados.','warn');
  toast(`Enviado a ${r.enviados} formando(s).`);
}

/* Dashboard de uma sessão enviada */
async function modalEstado(s){
  let linhas=[];
  try{ linhas=await rpc('repo_sessao_estado',{p_token:sessao.token,p_sessao_id:s.id}); }
  catch(e){ return tratar(e); }

  const pendentes=linhas.filter(l=>!l.enviado_em&&l.email).length;
  const naoAbriram=linhas.filter(l=>l.enviado_em&&!l.primeiro_clique).length;
  /* O cabecalho vinha do objeto da lista, carregado antes das aberturas:
     dizia "0 de 2 ja abriram" com a tabela em baixo a mostrar os dois, e
     escondia o "Repor contador", que so aparece quando ha aberturas. Conta
     das MESMAS linhas que a tabela mostra, e escreve de volta em `s` para a
     lista atras nao ficar a mentir. */
  const total=linhas.length;
  const enviados=linhas.filter(l=>l.enviado_em).length;
  const abriram=linhas.filter(l=>l.primeiro_clique).length;
  s.enviados=enviados; s.abriram=abriram; s.destinatarios=total;
  const emailLinha=l=>{
    if(!l.email) return '<span class="muted">sem email</span>';
    const e2=l.email2&&l.email2!==l.email?` · ${esc(l.email2)} <span class="muted">(institucional)</span>`:'';
    return `${esc(l.email)}${e2}`;
  };

  const f=abrirModal(`<div class="modal wide">
    <div class="modal-head">
      <div><h3>${s.modulo?`<span class="tag" style="vertical-align:middle;margin-right:8px">UFCD ${esc(s.modulo)}</span>`:''}${esc(s.titulo)}</h3>
        <div class="sub">${enviados} enviado(s) · ${abriram} de ${total} já abriram</div></div>
      <button class="icon-btn" id="eRefrescar" title="Atualizar - ver se há aberturas novas">${ic('refrescar')}</button>
    </div>
    <div class="modal-body">
      ${pendentes>0?`<div class="nota-rgpd" style="background:var(--info-bg);color:var(--info)">${ic('mail')}<span>${pendentes} por enviar. Usa "Enviar pendentes".</span></div>`:''}
      <div class="table-wrap"><table>
        <thead><tr><th>Formando</th><th>Estado</th><th>Abriu</th><th class="t-right">Vezes</th></tr></thead>
        <tbody>${linhas.map(l=>`<tr>
          <td><div class="cell-main">${esc(l.nome)}${l.envio_token?`<button class="lnk-copy" data-link="${SUPA_URL}/functions/v1/r?t=${l.envio_token}" title="Copiar o link pessoal deste formando">${ic('copiar')}</button>`:''}</div><div class="cell-sub">${emailLinha(l)}</div></td>
          <td>${l.erro?`<span class="pill red" title="${esc(l.erro)}">falhou</span>`
               :l.enviado_em?'<span class="pill grey">enviado</span>'
               :l.email?'<span class="pill amber">por enviar</span>':'<span class="pill grey">sem email</span>'}</td>
          <td>${l.primeiro_clique?`<span class="pill green">${dt(l.primeiro_clique)}</span>`:'<span class="muted">ainda não</span>'}</td>
          <td class="t-right">${l.cliques||''}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="modal-foot">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-danger btn-sm" id="ePagar">${ic('lixo')}Apagar</button>
        ${abriram>0?`<button class="btn-sec btn-sm" id="eRepor">${ic('seta')}Repor contador</button>`:''}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-sec" id="eVer">${ic('olho')}Ver email</button>
        <a class="btn-sec" href="${esc(s.link)}" target="_blank" rel="noopener">${ic('link')}Abrir o link</a>
        ${pendentes>0?`<button class="btn" id="eEnviar">${ic('mail')}Enviar ${pendentes} pendente(s)</button>`
          :naoAbriram>0?`<button class="btn" id="eReenviar">${ic('mail')}Reenviar a quem não abriu (${naoAbriram})</button>`
          :'<button class="btn-sec" data-fechar>Fechar</button>'}
      </div></div></div>`);

  // Atualizar: rebusca a sessão (contadores) e reabre o dashboard com dados frescos.
  f.querySelector('#eRefrescar').addEventListener('click',async e=>{
    const b=e.currentTarget; b.disabled=true;
    try{
      if(turmaAtual){
        const lista=await rpc('repo_sessoes_listar',{p_token:sessao.token,p_repo_turma_id:turmaAtual.id});
        sessoes=lista;
        const nova=lista.find(x=>x.id===s.id);
        f.remove();
        carregarSessoes(turmaAtual);
        if(nova) modalEstado(nova);
      }
    }catch(err){ tratar(err); b.disabled=false; }
  });
  f.querySelectorAll('.lnk-copy').forEach(b=>b.addEventListener('click',()=>{
    navigator.clipboard?.writeText(b.dataset.link);
    toast('Link do formando copiado. Cuidado: se o abrires tu, conta como se fosse ele.');
  }));
  f.querySelector('#eVer').addEventListener('click',()=>modalEmail(s));
  f.querySelector('#eEnviar')?.addEventListener('click',async e=>{
    const b=e.currentTarget;
    if(!await uiConfirm({titulo:'Enviar agora?',ok:'Enviar',texto:`Vai para os <strong>${pendentes}</strong> por avisar.`})) return;
    b.disabled=true; b.textContent='A enviar...';
    const r=await edge('repo-enviar',{token:sessao.token,sessao_id:s.id});
    f.remove(); if(turmaAtual) carregarSessoes(turmaAtual);
    if(!r.ok) return toast(r.erro||'Falhou.','err');
    toast(`Enviado a ${r.enviados} formando(s).`);
  });
  f.querySelector('#eReenviar')?.addEventListener('click',async e=>{
    const b=e.currentTarget;
    if(!await uiConfirm({titulo:'Reenviar?',ok:'Reenviar',texto:`Volta a sair para os <strong>${naoAbriram}</strong> que não abriram. Quem já abriu não recebe nada.`})) return;
    b.disabled=true; b.textContent='A reenviar...';
    try{
      await rpc('repo_reabrir_nao_abriram',{p_token:sessao.token,p_sessao_id:s.id});
      const r=await edge('repo-enviar',{token:sessao.token,sessao_id:s.id});
      f.remove(); if(turmaAtual) carregarSessoes(turmaAtual);
      if(!r.ok) return toast(r.erro||'Falhou.','err');
      toast(`Reenviado a ${r.enviados} formando(s).`);
    }catch(err){ tratar(err); }
  });
  f.querySelector('#eRepor')?.addEventListener('click',async()=>{
    if(!await uiConfirm({titulo:'Repor o contador de aberturas?',ok:'Repor',
      texto:'Limpa as aberturas registadas até agora (útil se foram scanners de email a inflá-las). A sessão e os links mantêm-se; a partir daqui só contam as aberturas reais.'})) return;
    try{ await rpc('repo_sessao_repor',{p_token:sessao.token,p_sessao_id:s.id});
      f.remove(); toast('Contador reposto. Só contam as aberturas reais a partir de agora.'); if(turmaAtual) carregarSessoes(turmaAtual); }catch(e){ tratar(e); }
  });
  f.querySelector('#ePagar').addEventListener('click',async()=>{
    if(!await uiConfirm({titulo:'Apagar esta sessão?',perigo:true,ok:'Apagar',texto:'Os registos de quem abriu vão com ela.'})) return;
    try{ await rpc('repo_sessao_remover',{p_token:sessao.token,p_id:s.id});
      f.remove(); toast('Sessão apagada.'); if(turmaAtual) carregarSessoes(turmaAtual); }catch(e){ tratar(e); }
  });
}

/* ================== TESTES E AVALIAÇÕES ==================
   Um teste é um MODELO e vive na biblioteca (item "Testes" na barra). Aplicá-lo
   a uma turma COPIA as perguntas para a aplicação: mexer no modelo depois já não
   mexe no que a turma respondeu.

   Aplicar, enviar, corrigir e devolver fazem-se dentro da turma (botão
   "Avaliações" no cartão). Por dentro, uma aplicação é uma sessão do Repo como
   as outras - é por isso que o envio, o registo de aberturas e o reenvio já
   funcionam sem código novo.
   ========================================================= */
let testes=[], testeEdit=null, aplicacoes=[], aplAtual=null, aplItens=[], pauta=[];
const nm=n=>String(Math.round((+n||0)*100)/100).replace('.',',');
const LETRA=i=>String.fromCharCode(97+i);

/* ---------- A biblioteca ---------- */
function mostrarTestes(){
  escolaAtual=null; turmaAtual=null;
  mostrarVista('vTestes');
  accaoPrimaria=()=>editarTeste(null);
  $('#hTitulo').textContent='Testes';
  $('#hSub').textContent='A biblioteca. Um teste escreve-se aqui e aplica-se dentro de cada turma.';
  $('#btnPrimario').classList.remove('hidden');
  $('#btnPrimario').innerHTML=ic('mais')+'Novo teste';
  $('#pesquisa').value='';
  marcarNavEscola();
  carregarTestes().then(filtrar);
}

async function carregarTestes(){
  try{ testes=await rpc('testes_listar',{p_token:sessao.token}); }
  catch(e){ if(faltaSql(e,'09-testes.sql')) return; return tratar(e); }

  $('#vTestes').innerHTML = !testes.length
    ? `<div class="empty">${ic('papel')}<strong>Ainda não há testes</strong>
        <span>Um teste escreve-se uma vez e aplica-se a quantas turmas quiseres.</span></div>`
    : `<div class="grid">${testes.map(t=>`
      <article class="card tc">
        <div class="tc-meta">
          ${t.modulo?`<span class="tag">UFCD ${esc(t.modulo)}</span>`:''}
          ${t.escola?`<span class="pill grey">${esc(t.escola)}</span>`:'<span class="pill grey">Todas as escolas</span>'}
          ${t.por_marcar>0
            ? `<span class="pill amber">${t.por_marcar} sem resposta certa</span>`
            : (t.chave_ok?'<span class="pill green">Pronto a aplicar</span>':'<span class="pill amber">Chave por confirmar</span>')}
        </div>
        <h3>${esc(t.titulo)}</h3>
        ${t.descricao?`<div class="muted" style="font-size:.82rem">${esc(t.descricao)}</div>`:''}
        <div class="muted" style="font-size:.8rem">${plural(+t.n_perguntas||0,'pergunta','perguntas')} · ${nm(t.pontos)} pontos · ${plural(+t.n_aplicacoes||0,'aplicação','aplicações')}</div>
        <div class="tc-foot">
          <button class="tc-lixo" data-apagar-teste="${t.id}" title="Apagar o teste">${ic('lixo')}</button>
          <button class="btn btn-sm" data-editar-teste="${t.id}">${ic('lapis')}Abrir</button>
        </div>
      </article>`).join('')}</div>`;

  document.querySelectorAll('[data-editar-teste]').forEach(b=>b.addEventListener('click',
    ()=>editarTeste(b.dataset.editarTeste)));
  document.querySelectorAll('[data-apagar-teste]').forEach(b=>b.addEventListener('click',
    ()=>apagarTeste(testes.find(t=>t.id===b.dataset.apagarTeste))));
}

async function apagarTeste(t){
  if(!t) return;
  const ok=await uiConfirmCodigo({titulo:`Apagar "${t.titulo}"?`,ok:'Apagar o teste',
    texto:`<strong>Apaga o teste e não se desfaz.</strong>
      <ul class="perda">
        <li>${plural(+t.n_perguntas||0,'pergunta','perguntas')} e as respostas certas</li>
        <li>${plural(+t.n_aplicacoes||0,'aplicação','aplicações')} a turmas, com as respostas e as notas</li>
      </ul>`});
  if(!ok) return;
  try{ await rpc('teste_apagar',{p_token:sessao.token,p_id:t.id}); }
  catch(e){ return tratar(e); }
  toast('Teste apagado.');
  carregarTestes();
}

/* ---------- O construtor ---------- */
async function editarTeste(id){
  if(id){
    try{ testeEdit=await rpc('teste_ler',{p_token:sessao.token,p_id:id}); }
    catch(e){ return tratar(e); }
  }else{
    testeEdit={id:null,titulo:'',descricao:'',modulo:'',espaco_id:null,chave_ok:false,itens:[]};
  }
  testeEdit.itens=(testeEdit.itens||[]).map(it=>({...it,
    opcoes:Array.isArray(it.opcoes)?it.opcoes:[],
    certa:(it.certa===undefined?null:it.certa)}));
  mostrarVista('vTeste');
  $('#hTitulo').textContent=testeEdit.id?'Editar teste':'Novo teste';
  $('#hSub').textContent='As perguntas, as respostas certas e as cotações';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  marcarNavEscola();
  pintarTeste();
}
