  const T=testeEdit;
  const opsEscola=escolas.filter(e=>e.slug&&!e.arquivado);
  $('#vTeste').innerHTML=`<button class="voltar" id="voltarTestes">${ic('seta')}Testes</button>

          <input id="tTitulo" value="${esc(T.titulo)}" placeholder="Avaliação final - 10868"></div>

        <div class="field"><label>Escola</label>

            <option value="">Todas as escolas</option>
            ${opsEscola.map(e=>`<option value="${esc(e.id)}"${T.espaco_id===e.id?' selected':''}>${esc(e.nome||e.slug)}</option>`).join('')}
          </select>
          <span class="hint">Serve para arrumar a biblioteca. Aplicar continua a ser turma a turma.</span></div>
        <div class="field full"><label>Descrição</label>
          <input id="tDesc" value="${esc(T.descricao)}" placeholder="O que é, e como conta"></div>
      </div>
    </div>
    <div id="tItens"></div>
    <div class="add-lin">
      <button class="btn-sec btn-sm" data-add="escolha">${ic('mais')}Escolha múltipla</button>
      <button class="btn-sec btn-sm" data-add="vf">${ic('mais')}Verdadeiro / falso</button>
      <button class="btn-sec btn-sm" data-add="aberta">${ic('mais')}Resposta aberta</button>
      <button class="btn-sec btn-sm" data-add="seccao">${ic('mais')}Secção</button>
    </div>
    <div class="guardar-lin">
      <label class="chk"><input type="checkbox" id="tChave"${T.chave_ok?' checked':''}>
        <span>Confirmo as respostas certas</span></label>
      <span class="hint" id="tAviso"></span>
      <button class="btn" id="tGuardar">${ic('ok')}Guardar</button>
    </div>`;

  $('#voltarTestes').addEventListener('click',mostrarTestes);
  $('#tChave').addEventListener('change',()=>{ testeEdit.chave_ok=$('#tChave').checked; });
  $('#tGuardar').addEventListener('click',guardarTeste);
  document.querySelectorAll('#vTeste [data-add]').forEach(b=>b.addEventListener('click',()=>{
    lerCampos();
    const tipo=b.dataset.add;
    testeEdit.itens.push({id:null,tipo,enunciado:'',ajuda:'',
      opcoes:tipo==='escolha'?['','','','']:[],
      certa:null,pontos:tipo==='seccao'?0:(tipo==='vf'?0.5:1)});
    pintarItens();
    const cx=document.querySelectorAll('#tItens .item');
    const ult=cx[cx.length-1]; if(ult){ const a=ult.querySelector('textarea'); if(a){ a.focus(); a.scrollIntoView({block:'center'}); } }
  }));
  pintarItens();
}

const TIPOS={escolha:'Escolha múltipla',vf:'Verdadeiro / falso',aberta:'Resposta aberta',seccao:'Secção'};

function pintarItens(){
  const T=testeEdit; let n=0;
  $('#tItens').innerHTML=T.itens.map((it,i)=>{
    const sec=it.tipo==='seccao';
    if(!sec) n++;
    let corpo='';
    if(it.tipo==='escolha'){
      corpo=`<div class="ops-ed">
        ${(it.opcoes||[]).map((o,j)=>`<div class="op-lin">
          <input type="radio" name="c${i}" data-certa="${i}|${j}"${it.certa===j?' checked':''} title="Marcar como resposta certa" aria-label="Resposta certa">
          <input class="op-in" data-op="${i}|${j}" value="${esc(o)}" placeholder="Opção ${j+1}">
          <button class="tc-lixo mini" data-op-fora="${i}|${j}" title="Tirar esta opção">${ic('lixo')}</button>
        </div>`).join('')}
        <div><button class="btn-ghost btn-xs" data-op-mais="${i}">${ic('mais')}Opção</button>
          <span class="hint" style="margin-left:6px">O botão redondo marca a resposta certa.</span></div>
      </div>`;
    }else if(it.tipo==='vf'){
      corpo=`<div class="vf-ed">
        <label class="op-vf"><input type="radio" name="c${i}" data-certa="${i}|true"${it.certa===true?' checked':''}><span>Verdadeiro</span></label>
        <label class="op-vf"><input type="radio" name="c${i}" data-certa="${i}|false"${it.certa===false?' checked':''}><span>Falso</span></label>
        <span class="hint">A afirmação acima é verdadeira ou falsa?</span>
      </div>`;
    }else if(it.tipo==='aberta'){
      corpo=`<span class="hint">Resposta escrita. Corriges à mão, com os pontos que deres a cada um.</span>`;
    }else{
      corpo=`<input class="op-in" data-ajuda="${i}" value="${esc(it.ajuda)}" placeholder="Subtítulo da secção (opcional)" style="margin-top:10px">`;
    }
    return `<div class="item${sec?' seccao':''}" data-i="${i}">
      <div class="item-cab">
        <span class="num">${sec?ic('lista'):n}</span>
        <select data-tipo="${i}">${Object.keys(TIPOS).map(k=>`<option value="${k}"${it.tipo===k?' selected':''}>${TIPOS[k]}</option>`).join('')}</select>
        ${sec?'':`<span class="pts-in">Pontos <input type="number" step="0.5" min="0" data-pontos="${i}" value="${it.pontos}"></span>`}
        <div class="item-acc">
          <button data-mover-i="${i}|-1" title="Subir"${i===0?' disabled':''}>${ic('cima')}</button>
          <button data-mover-i="${i}|1" title="Descer"${i===T.itens.length-1?' disabled':''}>${ic('baixo')}</button>
          <button class="fora" data-fora-i="${i}" title="Apagar">${ic('lixo')}</button>
        </div>
      </div>
      <textarea data-enun="${i}" placeholder="${sec?'Título da secção (ex: 3ª Parte - Verdadeiro / Falso)':'Escreve aqui a pergunta'}">${esc(it.enunciado)}</textarea>
      ${corpo}
    </div>`;
  }).join('')||`<div class="empty">${ic('papel')}<strong>Sem perguntas</strong>
      <span>Acrescenta a primeira em baixo.</span></div>`;

  const cx=$('#tItens');
  cx.querySelectorAll('[data-tipo]').forEach(s=>s.addEventListener('change',()=>{
    lerCampos();
    const i=+s.dataset.tipo, it=T.itens[i];
    it.tipo=s.value; it.certa=null;
    if(it.tipo==='escolha'&&!(it.opcoes||[]).length) it.opcoes=['','','',''];
    if(it.tipo==='seccao') it.pontos=0;
    pintarItens();
  }));
  cx.querySelectorAll('[data-certa]').forEach(r=>r.addEventListener('change',()=>{
    const p=r.dataset.certa.split('|'), i=+p[0];
    T.itens[i].certa=(p[1]==='true')?true:(p[1]==='false')?false:+p[1];
    avisoChave();
  }));
  cx.querySelectorAll('[data-op-mais]').forEach(b=>b.addEventListener('click',()=>{
    lerCampos(); T.itens[+b.dataset.opMais].opcoes.push(''); pintarItens();
  }));
  cx.querySelectorAll('[data-op-fora]').forEach(b=>b.addEventListener('click',()=>{
    lerCampos();
    const p=b.dataset.opFora.split('|'), i=+p[0], j=+p[1], it=T.itens[i];
    it.opcoes.splice(j,1);
    if(it.certa===j) it.certa=null; else if(typeof it.certa==='number'&&it.certa>j) it.certa--;
    pintarItens();
  }));
  cx.querySelectorAll('[data-mover-i]').forEach(b=>b.addEventListener('click',()=>{
    lerCampos();
    const p=b.dataset.moverI.split('|'), i=+p[0], d=+p[1], j=i+d;
    if(j<0||j>=T.itens.length) return;
    const x=T.itens[i]; T.itens[i]=T.itens[j]; T.itens[j]=x;
    pintarItens();
  }));
  cx.querySelectorAll('[data-fora-i]').forEach(b=>b.addEventListener('click',async()=>{
    const i=+b.dataset.foraI;
    const ok=await uiConfirm({titulo:'Apagar esta pergunta?',ok:'Apagar',perigo:true,
      texto:'Sai do teste. As aplicações já feitas ficam como estão.'});
    if(!ok) return;
    lerCampos(); T.itens.splice(i,1); pintarItens();
  }));
  avisoChave();
}

/* Lê o que está nos campos para dentro do objeto, antes de voltar a desenhar:
   sem isto, acrescentar uma opção apagava o que já lá estava escrito. */
function lerCampos(){
  const T=testeEdit;
  if($('#tTitulo')){
    T.titulo=$('#tTitulo').value;
    T.modulo=$('#tModulo').value.trim();
    T.descricao=$('#tDesc').value;
    T.espaco_id=$('#tEspaco').value||null;
    T.chave_ok=$('#tChave').checked;
  }
  document.querySelectorAll('#tItens [data-enun]').forEach(el=>{ T.itens[+el.dataset.enun].enunciado=el.value; });
  document.querySelectorAll('#tItens [data-ajuda]').forEach(el=>{ T.itens[+el.dataset.ajuda].ajuda=el.value; });
  document.querySelectorAll('#tItens [data-pontos]').forEach(el=>{ T.itens[+el.dataset.pontos].pontos=+el.value||0; });
  document.querySelectorAll('#tItens [data-op]').forEach(el=>{
    const p=el.dataset.op.split('|'); T.itens[+p[0]].opcoes[+p[1]]=el.value;
  });
}

/* Uma pergunta fechada sem resposta certa não se corrige sozinha - e um teste
   com buracos na chave não pode ser aplicado. */
function avisoChave(){
  const falta=testeEdit.itens.filter(it=>
    (it.tipo==='escolha'||it.tipo==='vf')&&(it.certa===null||it.certa===undefined)).length;
  const a=$('#tAviso'), c=$('#tChave');
  if(!a||!c) return;
  a.textContent=falta?plural(falta,'pergunta ainda sem resposta certa','perguntas ainda sem resposta certa')+'.':'';
  a.style.color=falta?'var(--warn)':'';
  c.disabled=falta>0;
  if(falta){ c.checked=false; testeEdit.chave_ok=false; }
}

async function guardarTeste(ev){
  lerCampos();
  const T=testeEdit;
  if(!String(T.titulo||'').trim()) return toast('Falta o título do teste.','err');
  if(!T.itens.length) return toast('Um teste sem perguntas não se guarda.','err');
  const b=ev&&ev.currentTarget;
  if(b){ b.disabled=true; b.textContent='A guardar…'; }
  const itens=T.itens.map(it=>{
    let opcoes=[], certa=(it.certa===undefined?null:it.certa);
    if(it.tipo==='escolha'){
      /* tirar as opções vazias mexe nos índices - a resposta certa anda com elas */
      let nova=null;
      (it.opcoes||[]).forEach((o,j)=>{
        if(String(o).trim()===''){ return; }
        if(j===certa) nova=opcoes.length;
        opcoes.push(o);
      });
      certa=nova;
    }
    if(it.tipo==='aberta'||it.tipo==='seccao') certa=null;
    return {id:it.id||null,tipo:it.tipo,enunciado:it.enunciado||'',ajuda:it.ajuda||'',
      opcoes,certa,pontos:it.tipo==='seccao'?0:(+it.pontos||0)};
  });
  try{
    const r=await rpc('teste_gravar',{p_token:sessao.token,p_id:T.id,
      p_dados:{titulo:String(T.titulo).trim(),descricao:T.descricao||'',modulo:T.modulo||'',
        espaco_id:T.espaco_id||null,chave_ok:!!T.chave_ok,itens}});
    T.id=r.id;
    toast('Teste guardado.');
    mostrarTestes();
  }catch(e){
    tratar(e);
    if(b){ b.disabled=false; b.innerHTML=ic('ok')+'Guardar'; }
  }
}

/* ---------- As avaliações de uma turma ---------- */
async function abrirAvaliacoes(t){
  turmaAtual=t;
  mostrarVista('vAvals');
  $('#hTitulo').textContent='Avaliações · '+(t.nome||('Turma '+t.codigo));
  $('#hSub').textContent='Turma '+t.codigo+' · '+t.n_formandos+' formandos';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  pintarNavEscolas();
  carregarAvaliacoes(t);
}

async function carregarAvaliacoes(t){
  try{ aplicacoes=await rpc('teste_aplicacoes_da_turma',{p_token:sessao.token,p_repo_turma_id:t.id}); }
  catch(e){ if(faltaSql(e,'09-testes.sql')) return; return tratar(e); }

  const estado=a=>{
    if(a.devolvidos>0&&a.devolvidos>=a.entregues) return '<span class="pill green">Devolvida</span>';
    if(a.entregues>0&&a.corrigidos>=a.entregues) return '<span class="pill blue">Por devolver</span>';
    if(a.entregues>0) return `<span class="pill amber">Por corrigir · ${a.entregues-a.corrigidos}</span>`;
    if(a.enviados>0) return '<span class="pill grey">À espera de respostas</span>';
    return '<span class="pill amber">Por enviar</span>';
  };
  const topo=`<button class="voltar" id="voltarTurmas3">${ic('seta')}${rotuloVoltar()}</button>
    <div class="section-head" style="margin-bottom:16px">
      <div><h3>Avaliações</h3>
        <div class="sub">Cada formando recebe um link só dele. As notas voltam pelo mesmo caminho.</div></div>
      <button class="btn" id="aplicarTeste">${ic('mais')}Aplicar um teste</button>
    </div>`;

  $('#vAvals').innerHTML = topo + (!aplicacoes.length
    ? `<div class="empty">${ic('papel')}<strong>Esta turma ainda não tem avaliações</strong>
        <span>Aplica um teste da biblioteca - as perguntas ficam guardadas nesta aplicação.</span></div>`
    : `<div class="table-wrap"><table><thead><tr>
        <th>Avaliação</th><th>Estado</th><th>Entregues</th><th>Média</th><th></th>
      </tr></thead><tbody>${aplicacoes.map(a=>`
        <tr class="clickable" data-apl="${a.id}">
          <td><div class="cell-main">${a.modulo?`<span class="tag" style="margin-right:7px">${esc(a.modulo)}</span>`:''}${esc(a.titulo)}</div>
              <div class="cell-sub">${dt(a.criado_em)} · ${nm(a.pontos_total)} pontos${a.fechado?' · fechada':''}</div></td>
          <td>${estado(a)}</td>
          <td>${a.entregues}/${a.destinatarios}</td>
          <td>${a.media!=null?nm(a.media)+' / '+nm(a.pontos_total):'<span class="muted">-</span>'}</td>
          <td class="t-right muted">${ic('olho')}</td>
        </tr>`).join('')}</tbody></table></div>`);

  $('#voltarTurmas3').addEventListener('click',voltarATurmas);
  $('#aplicarTeste').addEventListener('click',()=>modalAplicar(t));
  document.querySelectorAll('[data-apl]').forEach(r=>r.addEventListener('click',
    ()=>abrirAplicacao(aplicacoes.find(a=>a.id===r.dataset.apl))));
}

async function modalAplicar(t){
  try{ testes=await rpc('testes_listar',{p_token:sessao.token}); }
  catch(e){ if(faltaSql(e,'09-testes.sql')) return; return tratar(e); }
  const prontos=testes.filter(x=>x.chave_ok&&+x.n_perguntas>0);
  const f=abrirModal(`<div class="modal" style="width:min(620px,100%)">
    <div class="modal-head"><div><h3>Aplicar um teste</h3>
      <div class="sub">Turma ${esc(t.codigo)} · as perguntas ficam congeladas nesta aplicação</div></div></div>
    <div class="modal-body">
      ${!prontos.length
        ? `<div class="empty">${ic('papel')}<strong>Nenhum teste pronto</strong>
            <span>Um teste só se aplica depois de confirmares as respostas certas, em Testes.</span></div>`
        : `<div class="root-list">${prontos.map(x=>`
            <button class="root-trow" data-usar="${x.id}">
              <div class="root-tinfo"><strong>${esc(x.titulo)}</strong>
                <span>${x.modulo?'UFCD '+esc(x.modulo)+' · ':''}${plural(+x.n_perguntas||0,'pergunta','perguntas')} · ${nm(x.pontos)} pontos</span></div>
              ${ic('seta')}
            </button>`).join('')}</div>`}
    </div>
    <div class="modal-foot"><span></span><button class="btn-sec" data-fechar>Fechar</button></div></div>`);

  f.querySelectorAll('[data-usar]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    let r;
    try{ r=await rpc('teste_aplicar',{p_token:sessao.token,p_teste_id:b.dataset.usar,p_repo_turma_id:t.id}); }
    catch(e){ b.disabled=false; return tratar(e); }
    f.remove();
    await carregarAvaliacoes(t);
    if(!r.destinatarios) return toast('Aplicado, mas nenhum formando desta turma tem email.','warn');
    const ok=await uiConfirm({titulo:'Enviar já a avaliação?',ok:'Enviar agora',
      texto:`O link pessoal vai para <strong>${plural(r.destinatarios,'formando','formandos')}</strong>.
        <br><br><span class="hint">Se preferires, envias depois - o botão fica no ecrã da avaliação.</span>`});
    if(!ok) return toast('Aplicada. Envias quando quiseres.','warn');
    enviarAplicacao(r.sessao_id);
  }));
}

async function enviarAplicacao(sessaoId,botao){
  if(botao){ botao.disabled=true; botao.textContent='A enviar…'; }
  const r=await edge('repo-enviar',{token:sessao.token,sessao_id:sessaoId});
  if(turmaAtual) await carregarAvaliacoes(turmaAtual);
  if(aplAtual) await abrirAplicacao(aplAtual);
  if(!r.ok) return toast(r.erro||'O envio falhou.','err');
  if(r.falhados) return toast(`Enviado a ${r.enviados}, falhou em ${r.falhados}.`,'warn');
  if(!r.enviados) return toast('Nada por enviar - já estavam todos avisados.','warn');
  toast(`Enviado a ${plural(r.enviados,'formando','formandos')}.`);
}

/* ---------- Uma aplicação: pauta, correção e gráficos ---------- */
async function abrirAplicacao(a){
  if(!a) return;
  aplAtual=a;
  mostrarVista('vApl');
  $('#hTitulo').textContent=a.titulo;
  $('#hSub').textContent=(turmaAtual?'Turma '+turmaAtual.codigo+' · ':'')+nm(a.pontos_total)+' pontos';
  $('#btnPrimario').classList.add('hidden');
  $('#pesquisa').value='';
  $('#vApl').innerHTML='<div class="empty"><strong>A carregar…</strong></div>';
  try{
    const d=await rpc('teste_aplicacao_ler',{p_token:sessao.token,p_aplicacao_id:a.id});
    aplItens=d.itens||[];
    aplAtual={...a,...d};
    pauta=await rpc('teste_pauta',{p_token:sessao.token,p_aplicacao_id:a.id});
  }catch(e){ return tratar(e); }
  pintarAplicacao();
}

function pintarAplicacao(){
  const a=aplAtual;
  const total=pauta.length;
  const enviados=pauta.filter(l=>l.enviado_em).length;
  const entregues=pauta.filter(l=>l.submetido_em).length;
  const corrigidos=pauta.filter(l=>l.corrigido_em).length;
  const devolvidos=pauta.filter(l=>l.devolvido_em).length;
  const notas=pauta.filter(l=>l.nota!=null).map(l=>+l.nota);
  const media=notas.length?notas.reduce((x,y)=>x+y,0)/notas.length:null;
  const porCorrigir=entregues-corrigidos;
  const porDevolver=corrigidos-devolvidos;

  const estadoLinha=l=>{
    if(l.devolvido_em) return `<span class="pill green">Devolvida</span>`;
    if(l.corrigido_em) return `<span class="pill blue">Corrigida</span>`;
    if(l.submetido_em) return `<span class="pill amber">Entregue</span>`;
    if(l.primeiro_clique) return `<span class="pill grey">Abriu</span>`;
    if(l.enviado_em) return `<span class="pill grey">Enviado</span>`;
    if(l.erro) return `<span class="pill red">Falhou</span>`;
    return `<span class="muted">-</span>`;
  };

  $('#vApl').innerHTML=`<button class="voltar" id="voltarAvals">${ic('seta')}Avaliações</button>
    <div class="section-head" style="margin-bottom:16px">
      <div><h3>${esc(a.titulo)}</h3>
        <div class="sub">${a.fechado?'Fechada a respostas':'A aceitar respostas'} · ${nm(a.pontos_total)} pontos</div></div>
      <div class="toolbar" style="gap:8px">
        ${enviados<total?`<button class="btn btn-sm" id="aEnviar">${ic('mail')}Enviar${enviados?' a quem falta':''}</button>`:''}
        ${porDevolver>0?`<button class="btn btn-sm" id="aDevolver">${ic('ok')}Devolver ${porDevolver} nota${porDevolver==1?'':'s'}</button>`:''}
        <button class="btn-sec btn-sm" id="aFechar">${ic('tranca')}${a.fechado?'Reabrir':'Fechar'}</button>
        <button class="btn-sec btn-sm" id="aCsv">${ic('copiar')}CSV</button>
      </div>
    </div>

    <div class="cartoes">
      <div class="kpi"><strong>${enviados}/${total}</strong><span>enviados</span></div>
      <div class="kpi"><strong>${entregues}</strong><span>entregues</span></div>
      <div class="kpi"><strong>${porCorrigir}</strong><span>por corrigir</span></div>
      <div class="kpi"><strong>${media!=null?nm(media):'-'}</strong><span>média</span></div>
    </div>

    <div class="table-wrap" style="margin-bottom:22px"><table><thead><tr>
      <th>Formando</th><th>Estado</th><th>Entregue</th><th>Nota</th><th></th>
    </tr></thead><tbody>${pauta.map(l=>`
      <tr>
        <td><div class="cell-main">${esc(l.nome)}</div><div class="cell-sub">${esc(l.email||'sem email')}</div></td>
        <td>${estadoLinha(l)}</td>
        <td>${l.submetido_em?dt(l.submetido_em):'<span class="muted">-</span>'}</td>
        <td>${l.nota!=null?`<strong>${nm(l.nota)}</strong> <span class="muted">/ ${nm(a.pontos_total)}</span>`:'<span class="muted">-</span>'}</td>
        <td class="t-right">${l.resposta_id&&l.submetido_em
          ? `<button class="btn-sec btn-xs" data-corrigir="${l.resposta_id}">${l.corrigido_em?'Rever':'Corrigir'}</button>`
          : (l.acesso_id&&l.enviado_em?`<button class="btn-ghost btn-xs" data-reenviar="${l.acesso_id}">Reenviar</button>`:'')}</td>
      </tr>`).join('')}</tbody></table></div>

    <div class="section-head" style="margin-bottom:12px"><div><h3>Respostas, pergunta a pergunta</h3>
      <div class="sub">Só as de escolha e verdadeiro/falso. Conta quem já entregou.</div></div></div>
    <div class="g-bolhas" id="aGraficos"></div>`;

  $('#voltarAvals').addEventListener('click',()=>turmaAtual?abrirAvaliacoes(turmaAtual):mostrarEscolas());
  const be=$('#aEnviar');
  if(be) be.addEventListener('click',()=>enviarAplicacao(a.sessao_id,be));
  const bd=$('#aDevolver');
  if(bd) bd.addEventListener('click',()=>devolverNotas(a,porDevolver,bd));
  $('#aFechar').addEventListener('click',async()=>{
    try{ await rpc('teste_fechar',{p_token:sessao.token,p_aplicacao_id:a.id,p_fechado:!a.fechado}); }
    catch(e){ return tratar(e); }
    toast(a.fechado?'Reaberta - já podem responder.':'Fechada - deixou de aceitar respostas.');
    abrirAplicacao(a);
  });
  $('#aCsv').addEventListener('click',()=>csvPauta(a));
  document.querySelectorAll('[data-corrigir]').forEach(b=>b.addEventListener('click',
    ()=>modalCorrigir(pauta.find(l=>l.resposta_id===b.dataset.corrigir))));
  document.querySelectorAll('[data-reenviar]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true; b.textContent='A enviar…';
    const r=await edge('repo-enviar',{token:sessao.token,sessao_id:a.sessao_id,acesso_id:b.dataset.reenviar});
    if(!r.ok) return toast(r.erro||'O envio falhou.','err');
    toast('Reenviado.');
    abrirAplicacao(a);
  }));
  pintarGraficos();
}

/* Uma bolha por pergunta, e cada uma sabe desenhar-se como imagem para ir
   parar a um slide. A imagem não é uma fotografia do ecrã: é desenhada de
   raiz numa tela, sempre clara e a 2x, para não sair esborratada no
   projetor nem levar o tema escuro para dentro do PowerPoint. */
let graficosDados=[];

function pintarGraficos(){
  const entregues=pauta.filter(l=>l.submetido_em);
  const fechadas=aplItens.filter(it=>it.tipo==='escolha'||it.tipo==='vf');
  graficosDados=[];
  if(!entregues.length||!fechadas.length){
    $('#aGraficos').innerHTML=`<div class="card card-pad"><span class="hint">${!fechadas.length
      ?'Esta avaliação só tem perguntas de resposta escrita.'
      :'Ainda não há entregas para contar.'}</span></div>`;
    return;
  }
  let n=0;
  graficosDados=fechadas.map(it=>{
    n++;
    const ops=it.tipo==='vf'?['Verdadeiro','Falso']:(it.opcoes||[]);
    const valores=it.tipo==='vf'?[true,false]:ops.map((_,i)=>i);
    const linhas=ops.map((o,i)=>{
      const c=entregues.filter(l=>(l.respostas||{})[it.id]===valores[i]).length;
      return {txt:o,n:c,pc:Math.round(c/entregues.length*100),certa:valores[i]===it.certa};
    });
    const sem=entregues.length-linhas.reduce((a,b)=>a+b.n,0);
    if(sem) linhas.push({txt:'sem resposta',n:sem,pc:Math.round(sem/entregues.length*100),certa:false,vazia:true});
    const certos=entregues.filter(l=>(l.respostas||{})[it.id]===it.certa).length;
    return {num:n,enunciado:it.enunciado,linhas,certos,total:entregues.length,
      pc:Math.round(certos/entregues.length*100)};
  });

  $('#aGraficos').innerHTML=graficosDados.map((g,i)=>`
    <div class="card card-pad g-bolha">
      <div class="g-cab">
        <h4>${g.num}. ${esc(g.enunciado)}</h4>
        <span class="pill ${g.pc>=70?'green':g.pc>=40?'amber':'red'}">${g.pc}% certas</span>
        <button class="btn-ghost btn-xs g-copiar" data-copiar="${i}"
          title="Copiar como imagem, para colar num slide">${ic('copiar')}Copiar imagem</button>
      </div>
      ${g.linhas.map(l=>`<div class="g-lin">
        <span class="g-lbl${l.vazia?' muted':''}">${l.certa?ic('ok')+' ':''}${esc(l.txt)}</span>
        <span class="g-bar${l.certa?' ok':''}${l.vazia?' vazia':''}"><i style="width:${l.pc}%"></i></span>
        <span class="g-n">${l.n} · ${l.pc}%</span></div>`).join('')}
      <div class="g-pe">${g.certos} de ${g.total} acertaram</div>
    </div>`).join('');

  document.querySelectorAll('[data-copiar]').forEach(b=>b.addEventListener('click',
    ()=>copiarGrafico(+b.dataset.copiar,b)));
}

/* Copiar: o browser exige que a escrita na área de transferência nasça do
   clique, por isso entrega-se a PROMESSA da imagem em vez de esperar por ela.
   Onde isso não é permitido (ou falha), descarrega-se o ficheiro. */
async function copiarGrafico(i,btn){
  const g=graficosDados[i];
  if(!g) return;
  const antes=btn.innerHTML;
  btn.disabled=true; btn.textContent='A desenhar…';
  const imagem=desenharGrafico(g);
  try{
    if(!window.ClipboardItem) throw new Error('sem ClipboardItem');
    await navigator.clipboard.write([new ClipboardItem({'image/png':imagem})]);
    toast('Imagem copiada. Cola no slide com Ctrl+V.');
  }catch(e){
    try{
      const bl=await imagem;
      const a=document.createElement('a');
      a.href=URL.createObjectURL(bl);
      a.download='pergunta-'+g.num+'.png';
      a.click(); URL.revokeObjectURL(a.href);
      toast('O browser não deixou copiar - descarreguei a imagem.','warn');
    }catch(err){ toast('Não foi possível gerar a imagem.','err'); }
  }
  btn.disabled=false; btn.innerHTML=antes;
}

/* A imagem que vai para o slide usa a identidade do crm.cr0x.org - papel,
   tinta, azul, e as letras da casa: Archivo no texto e no título, Space Mono no
   texto, Space Mono nas etiquetas. O ecrã do Repo é ferramenta e fica como
   está; isto é material, e material é tudo igual.
   Desenhada de raiz e a 2x: nunca leva o tema escuro nem sai esborratada. */
function desenharGrafico(g){
  const pronto=(document.fonts&&document.fonts.ready)||Promise.resolve();
  return pronto.then(()=>new Promise((res,rej)=>{
    const E=2, L=900, M=44, COLN=110;          // escala, largura, margem, coluna dos números
    const LARG=L-M*2, BARRA=LARG-COLN;
    const PAPEL='#efe9dd', TINTA='#171412', TINTA2='#4a423c', FRACO='#6f655c',
          AZUL='#0078bf', AZUL_E='#005e95', RISCO='#d6cdbd',
          TRILHO='#e3dbcc', NEUTRA='#c9bfae', APAGADO='#ddd5c6';
    const TIT=t=>`800 ${t}px Archivo,system-ui,sans-serif`;
    const TXT=(p,t)=>`${p} ${t}px Archivo,system-ui,sans-serif`;
    const MONO=(p,t)=>`${p} ${t}px "Space Mono",ui-monospace,monospace`;
    const medir=document.createElement('canvas').getContext('2d');

    const quebrar=(txt,fonte,max)=>{
      medir.font=fonte;
      const palavras=String(txt).split(/\s+/); const linhas=[]; let l='';
      palavras.forEach(p=>{
        const t=l?l+' '+p:p;
        if(medir.measureText(t).width>max&&l){ linhas.push(l); l=p; } else l=t;
      });
      if(l) linhas.push(l);
      return linhas;
    };

    const tituloL=quebrar(g.num+'. '+g.enunciado,TIT(22),LARG);
    const ops=g.linhas.map(l=>({...l,linhas:quebrar(l.txt,TXT(l.certa?'500':'400',16),BARRA-(l.certa?26:0))}));

    /* O texto assenta na linha de base, por isso sobe ~16px acima do y: sem
       folga a seguir à barra, a etiqueta seguinte parecia colada à barra de
       cima em vez da sua. Estes números são o mesmo ritmo do desenho. */
    let H=M+tituloL.length*30+6+30;                        // título + estado
    ops.forEach(o=>{ H+=o.linhas.length*22+8+14+30; });    // texto + barra + folga
    H+=30+M;                                               // filete + rodapé

    const c=document.createElement('canvas');
    c.width=L*E; c.height=Math.round(H)*E;
    const x=c.getContext('2d');
    x.scale(E,E);
    x.textBaseline='alphabetic';
    const espacar=v=>{ try{ x.letterSpacing=v; }catch(e){} };

    x.fillStyle=PAPEL; x.fillRect(0,0,L,H);

    let y=M+22;
    x.fillStyle=TINTA; x.font=TIT(22);
    tituloL.forEach(l=>{ x.fillText(l,M,y); y+=30; });

    y+=4;
    espacar('2px');
    x.font=MONO('700',11.5); x.fillStyle=AZUL_E;
    x.fillText((g.pc+'% certas · '+g.certos+' de '+g.total).toUpperCase(),M,y);
    espacar('0px');
    y+=30;

    const arred=(px,py,pw,ph,r)=>{
      x.beginPath();
      x.moveTo(px+r,py); x.lineTo(px+pw-r,py); x.quadraticCurveTo(px+pw,py,px+pw,py+r);
      x.lineTo(px+pw,py+ph-r); x.quadraticCurveTo(px+pw,py+ph,px+pw-r,py+ph);
      x.lineTo(px+r,py+ph); x.quadraticCurveTo(px,py+ph,px,py+ph-r);
      x.lineTo(px,py+r); x.quadraticCurveTo(px,py,px+r,py); x.closePath(); x.fill();
    };

    ops.forEach(o=>{
      x.font=TXT(o.certa?'500':'400',16);
      x.fillStyle=o.vazia?FRACO:(o.certa?TINTA:TINTA2);
      let esq=M;
      if(o.certa){
        /* o visto desenha-se a traço, para ficar nítido a qualquer tamanho */
        x.save(); x.strokeStyle=AZUL; x.lineWidth=2; x.lineCap='round'; x.lineJoin='round';
        x.beginPath(); x.moveTo(M+1,y-6); x.lineTo(M+6,y-1); x.lineTo(M+15,y-13); x.stroke(); x.restore();
        esq=M+26;
      }
      o.linhas.forEach((l,k)=>{ x.fillText(l,esq,y+k*22); });
      y+=o.linhas.length*22+8;

      x.fillStyle=TRILHO; arred(M,y,BARRA,14,4);
      if(o.pc>0){ x.fillStyle=o.vazia?APAGADO:(o.certa?AZUL:NEUTRA); arred(M,y,Math.max(6,BARRA*o.pc/100),14,4); }
      x.fillStyle=o.vazia?FRACO:TINTA; x.font=MONO('700',12.5);
      x.fillText(o.n+' · '+o.pc+'%',M+BARRA+16,y+12);
      y+=14+30;
    });

    x.fillStyle=RISCO; x.fillRect(M,y-8,LARG,1);
    espacar('1.5px');
    x.fillStyle=FRACO; x.font=MONO('400',10.5);
    x.fillText(((aplAtual?aplAtual.titulo:'')+(turmaAtual?'  ·  Turma '+turmaAtual.codigo:'')+
      '  ·  '+g.total+' respostas  ·  crm.cr0x.org').toUpperCase(),M,y+10);
    espacar('0px');

    c.toBlob(b=>b?res(b):rej(new Error('sem imagem')),'image/png');
  }));
}
async function devolverNotas(a,quantos,btn){
  const ok=await uiConfirm({titulo:'Devolver as notas?',ok:'Devolver e enviar',
    texto:`Cada um recebe o link do seu resultado: a nota, o que respondeu e os teus comentários.
      <br><br>Vão <strong>${plural(quantos,'nota','notas')}</strong>.`});
  if(!ok) return;
  btn.disabled=true; btn.textContent='A devolver…';
  let r;
  try{ r=await rpc('teste_devolver',{p_token:sessao.token,p_aplicacao_id:a.id}); }
  catch(e){ btn.disabled=false; return tratar(e); }
  await enviarAplicacao(r.sessao_id);
}

function modalCorrigir(l){
  if(!l) return;
  const a=aplAtual;
  const pontosMao={}, coment={};
  (l.pontos||{}) && Object.keys(l.pontos||{}).forEach(k=>{ pontosMao[k]=+l.pontos[k]; });
  let n=0;
  const corpo=aplItens.map(it=>{
    if(it.tipo==='seccao') return `<div class="corrigir-q"><div class="enun" style="color:var(--muted)">${esc(it.enunciado)}</div></div>`;
    n++;
    const dada=(l.respostas||{})[it.id];
    /* Nas fechadas, a conta faz-se aqui pela mesma regra do servidor, em vez de
       se ler o que está guardado: assim uma entrega antiga (ou um teste onde a
       resposta certa entrou depois) mostra o que o servidor vai mesmo somar. */
    const ganhos=(it.tipo==='escolha'||it.tipo==='vf')
      ? ((dada!==undefined&&dada!==null&&dada===it.certa)?(+it.pontos||0):0)
      : (l.pontos||{})[it.id];
    let resp='', extra='';
    if(it.tipo==='escolha'){
      const ops=it.opcoes||[];
      const certa=it.certa;
      resp=`<div class="dada">${dada===undefined||dada===null
        ? '(sem resposta)'
        : esc(LETRA(dada)+') '+(ops[dada]!==undefined?ops[dada]:'?'))}</div>`;
      extra=`<div class="linha"><span class="pill ${ganhos>0?'green':'red'}">${ganhos>0?'certa':'errada'}</span>
        <span class="hint">certa: ${certa==null?'-':esc(LETRA(certa)+') '+(ops[certa]||''))}</span>
        <strong style="margin-left:auto">${nm(ganhos||0)} / ${nm(it.pontos)}</strong></div>`;
    }else if(it.tipo==='vf'){
      resp=`<div class="dada">${dada===true?'Verdadeiro':dada===false?'Falso':'(sem resposta)'}</div>`;
      extra=`<div class="linha"><span class="pill ${ganhos>0?'green':'red'}">${ganhos>0?'certa':'errada'}</span>
        <span class="hint">certa: ${it.certa===true?'Verdadeiro':it.certa===false?'Falso':'-'}</span>
        <strong style="margin-left:auto">${nm(ganhos||0)} / ${nm(it.pontos)}</strong></div>`;
    }else{
      resp=`<div class="dada">${dada?esc(dada):'<span class="muted">(sem resposta)</span>'}</div>`;
      extra=`<div class="linha">
        <label class="hint">Pontos</label>
        <input type="number" step="0.5" min="0" max="${it.pontos}" data-p="${it.id}"
          value="${ganhos!==undefined?ganhos:''}" placeholder="0">
        <span class="hint">de ${nm(it.pontos)}</span>
        <input type="text" data-c="${it.id}" value="${esc((l.comentarios||{})[it.id]||'')}" placeholder="Comentário (opcional)">
      </div>`;
    }
    return `<div class="corrigir-q">
      <div class="enun">${n}. ${esc(it.enunciado)}</div>${resp}${extra}</div>`;
  }).join('');

  const f=abrirModal(`<div class="modal wide">
    <div class="modal-head"><div><h3>${esc(l.nome)}</h3>
      <div class="sub">Entregue a ${dt(l.submetido_em)} · ${esc(a.titulo)}</div></div></div>
    <div class="modal-body">${corpo}
      <div class="field" style="margin-top:18px"><label>Comentário geral</label>
        <textarea id="cGeral" style="min-height:80px" placeholder="O que correu bem, o que falta trabalhar">${esc(l.comentario||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      <div class="nota-fim">Nota: <span class="v" id="cNota">-</span> <span class="muted">/ ${nm(a.pontos_total)}</span></div>
      <div style="display:flex;gap:10px">
        <button class="btn-sec" data-fechar>Cancelar</button>
        <button class="btn" id="cGuardar">${ic('ok')}Guardar correção</button>
      </div></div></div>`);

  const soma=()=>{
    let s=0;
    aplItens.forEach(it=>{
      if(it.tipo==='seccao') return;
      if(it.tipo==='aberta'){
        const el=f.querySelector(`[data-p="${it.id}"]`);
        s+=Math.min(+((el&&el.value)||0),+it.pontos);
      }else{
        const d=(l.respostas||{})[it.id];
        s+=(d!==undefined&&d!==null&&d===it.certa)?(+it.pontos||0):0;
      }
    });
    f.querySelector('#cNota').textContent=nm(s);
  };
  f.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('input',soma));
  soma();

  f.querySelector('#cGuardar').addEventListener('click',async e=>{
    const b=e.currentTarget; b.disabled=true; b.textContent='A guardar…';
    const p={}, c={};
    f.querySelectorAll('[data-p]').forEach(i=>{ p[i.dataset.p]=+i.value||0; });
    f.querySelectorAll('[data-c]').forEach(i=>{ if(i.value.trim()) c[i.dataset.c]=i.value.trim(); });
    try{
      await rpc('teste_corrigir',{p_token:sessao.token,p_resposta_id:l.resposta_id,
        p_pontos:p,p_comentarios:c,p_comentario:f.querySelector('#cGeral').value.trim()});
    }catch(err){ b.disabled=false; b.innerHTML=ic('ok')+'Guardar correção'; return tratar(err); }
    f.remove();
    toast('Correção guardada.');
    abrirAplicacao(aplAtual);
  });
}

/* A pauta em CSV: uma linha por formando, uma coluna por pergunta. */
function csvPauta(a){
  const perg=aplItens.filter(it=>it.tipo!=='seccao');
  const cab=['Formando','Utilizador','Email','Enviado','Abriu','Entregue','Nota','Total','Percentagem']
    .concat(perg.map((it,i)=>'P'+(i+1)));
  const val=(it,v)=>{
    if(v===undefined||v===null||v==='') return '';
    if(it.tipo==='escolha') return LETRA(v)+') '+((it.opcoes||[])[v]||'');
    if(it.tipo==='vf') return v?'Verdadeiro':'Falso';
    return String(v);
  };
  const linhas=pauta.map(l=>[
    l.nome,l.username||'',l.email||'',
    l.enviado_em?dt(l.enviado_em):'', l.primeiro_clique?dt(l.primeiro_clique):'',
    l.submetido_em?dt(l.submetido_em):'',
    l.nota!=null?nm(l.nota):'', nm(a.pontos_total),
    l.nota!=null&&+a.pontos_total?Math.round(l.nota/a.pontos_total*100)+'%':''
  ].concat(perg.map(it=>val(it,(l.respostas||{})[it.id]))));
  const cel=x=>{ const s=String(x==null?'':x); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv='﻿'+[cab].concat(linhas).map(r=>r.map(cel).join(';')).join('\r\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const el=document.createElement('a');
  el.href=u; el.download='pauta-'+slugDe(a.titulo)+'.csv'; el.click();
  URL.revokeObjectURL(u);
  toast('Pauta descarregada.');
}
