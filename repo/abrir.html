<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A abrir o material</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo/tokens.css">
<style>
/* Página de passagem: regista a abertura (só com JavaScript, para os
   scanners de email não contarem) e segue para a pasta do Drive.
   Vive aqui, no GitHub Pages, porque as Edge Functions do Supabase
   forçam text/plain e não servem HTML. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);
  display:grid;place-items:center;min-height:100vh;padding:24px}
.cx{text-align:center;max-width:420px}
.logo{width:54px;height:54px;border-radius:13px;background:#fff;padding:6px;display:grid;place-items:center;
  margin:0 auto 20px;box-shadow:var(--shadow)}
.logo img{width:100%;height:100%;object-fit:contain}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--g600);border-radius:50%;
  animation:g .8s linear infinite;margin:0 auto 16px}
@keyframes g{to{transform:rotate(360deg)}}
h1{font-size:1.05rem;font-weight:800;margin-bottom:6px}
p{font-size:.9rem;color:var(--muted)}
.btn{display:inline-block;margin-top:18px;background:linear-gradient(180deg,var(--g600),var(--g800));color:#fff;
  text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:.92rem;
  box-shadow:var(--shadow-primary)}
.esconde{display:none}
</style>
</head>
<body>
<div class="cx">
  <div class="logo"><img src="../IEFPnormal.png" alt="IEFP"></div>

  <div id="aguarda">
    <div class="spin"></div>
    <h1>A abrir o material…</h1>
    <p>Só um instante.</p>
  </div>

  <div id="erro" class="esconde">
    <h1>Não foi possível abrir</h1>
    <p>Este link pode ter expirado ou o material já não estar disponível. Fala com o teu formador.</p>
  </div>

  <noscript>
    <h1>Ative o JavaScript</h1>
    <p>Este link precisa de JavaScript para abrir o material. Ative-o no navegador e recarregue a página.</p>
  </noscript>
</div>

<script>
(function(){
  var API='https://qgfzbyhfyqvmmmdiqycu.supabase.co/functions/v1/r';
  var REPO='https://iefpcrm.cr0x.org/repo/';
  var t=new URLSearchParams(location.search).get('t');
  var uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function falhou(){
    document.getElementById('aguarda').className='esconde';
    document.getElementById('erro').className='';
  }
  if(!t||!uuid.test(t)){ location.replace(REPO); return; }

  // O registo acontece AQUI, em JavaScript. Os scanners de email buscam esta
  // página mas não executam scripts, por isso não contam como abertura.
  fetch(API+'?t='+encodeURIComponent(t)+'&hit=1')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d&&d.ok&&d.link) location.replace(d.link);
      else falhou();
    })
    .catch(falhou);
})();
</script>
</body>
</html>
