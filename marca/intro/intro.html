<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Intro CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&display=block">
<!-- ============ A INTRO DOS VIDEOS ============
     Quatro segundos. A marca monta-se coluna a coluna, a terceira fecha,
     e o nome entra por baixo.

     O logotipo e o do cabecalho do site: tudo em --neutra #2a2622,
     terceira coluna cheia, SEM azul. O azul e do badge, nao da marca -
     aqui aparece so no traco por baixo do nome, que e o mesmo papel que
     tem no site, onde pinta o "crm.cr0x.org".

     E por isso que o fundo e papel e nao tinta: uma marca escura sobre
     fundo escuro nao existe.

     So CSS com atrasos, sem bibliotecas: grava-se igual em qualquer
     maquina, e o nome, o subtitulo e a cor vem do endereco, para a mesma
     intro servir qualquer escola sem se editar o ficheiro.
     ============================================ -->
<style>
  :root{
    --tinta:#171412; --neutra:#2a2622; --papel:#efe9dd; --azul:#0078bf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--papel);overflow:hidden}
  body{display:grid;place-items:center;font-family:"Archivo",system-ui,sans-serif}

  .palco{display:grid;place-items:center;gap:22px;transform:translateY(-6px)}
  svg{width:360px;height:360px;overflow:visible}

  .col{opacity:0;transform-box:fill-box;transform-origin:50% 100%;
       animation:sobe .52s cubic-bezier(.22,1,.36,1) forwards}
  .c1{animation-delay:.10s} .c2{animation-delay:.22s}
  /* a terceira sobe E fecha: uma so declaracao, senao a segunda apaga a primeira */
  .c3{animation:sobe .52s cubic-bezier(.22,1,.36,1) .34s forwards,
               fecha .45s ease .68s forwards}
  .barra{opacity:0;animation:aparece .3s ease forwards}
  .f34{animation-name:aparece34} .f50{animation-name:aparece50}
  .b1{animation-delay:.44s} .b2{animation-delay:.50s} .b3{animation-delay:.92s}

  .nome{
    font-size:54px;font-weight:800;letter-spacing:-.025em;color:var(--tinta);
    opacity:0;transform:translateY(10px);line-height:1;text-align:center;
    animation:entra .5s cubic-bezier(.22,1,.36,1) .80s forwards;
  }
  .sub{
    font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--neutra);opacity:0;margin-top:11px;text-align:center;
    animation:subEntra .5s ease .96s forwards;
  }
  .risco{height:3px;width:0;background:var(--azul);border-radius:2px;margin:16px auto 0;
         animation:risca .6s cubic-bezier(.22,1,.36,1) 1.06s forwards}

  .palco{animation:sai .42s ease 3.45s forwards}

  @keyframes sobe{from{opacity:0;transform:translateY(22px) scaleY(.84)}to{opacity:1;transform:none}}
  @keyframes aparece{to{opacity:1}}
  /* cada barra acaba na opacidade que tem no logotipo, senao o keyframe
     leva-as todas a 1 e as cinzentas saem escuras */
  @keyframes aparece34{to{opacity:.34}}
  @keyframes aparece50{to{opacity:.5}}
  /* a terceira coluna comeca clara e fecha na tinta do quadro */
  @keyframes fecha{from{fill:#bdb4a6}to{fill:var(--neutra)}}
  @keyframes entra{to{opacity:1;transform:none}}
  @keyframes subEntra{to{opacity:.66}}
  @keyframes risca{to{width:72px}}
  @keyframes sai{to{opacity:0;transform:translateY(-12px)}}
</style>
</head>
<body>
  <div class="palco">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <!-- a geometria e a cor do logotipo do cabecalho de crm.cr0x.org:
           colunas 28x47, canto 4, traco 3.4, tres barras por coluna e a
           do meio sem a de baixo. Tudo em --neutra. -->
      <g transform="translate(100,100) scale(1.42) translate(-100,-100)">
        <g transform="rotate(-5 100 100)">
          <rect class="col c1" x="55" y="77" width="28" height="47" rx="4" fill="none" stroke="#2a2622" stroke-width="3.4"/>
          <rect class="col c2" x="86" y="77" width="28" height="47" rx="4" fill="none" stroke="#2a2622" stroke-width="3.4"/>
          <rect class="col c3" x="117" y="77" width="28" height="47" rx="4" fill="#bdb4a6"/>
          <rect class="barra b1" x="60" y="83" width="18" height="3.4" rx="1.7" fill="#2a2622"/>
          <rect class="barra b2" x="91" y="83" width="18" height="3.4" rx="1.7" fill="#2a2622"/>
          <rect class="barra b3" x="122" y="83" width="18" height="3.4" rx="1.7" fill="#efe9dd"/>
          <rect class="barra b1 f34" x="60" y="93" width="18" height="7" rx="2" fill="#2a2622" opacity=".34"/>
          <rect class="barra b1 f34" x="60" y="104" width="18" height="7" rx="2" fill="#2a2622" opacity=".34"/>
          <rect class="barra b2 f34" x="91" y="93" width="18" height="7" rx="2" fill="#2a2622" opacity=".34"/>
          <rect class="barra b3" x="122" y="93" width="18" height="7" rx="2" fill="#efe9dd"/>
          <rect class="barra b3 f50" x="122" y="104" width="18" height="7" rx="2" fill="#efe9dd" opacity=".5"/>
        </g>
      </g>
    </svg>
    <div>
      <div class="nome" id="nome">CRM</div>
      <div class="sub" id="sub">Plataforma de Formação</div>
      <div class="risco"></div>
    </div>
  </div>
  <script>
    /* intro.html?nome=XPTO&sub=Centro%20de%20Formacao&cor=%23b31e2e */
    var q = new URLSearchParams(location.search);
    /* ?hold=1 segura o último fotograma: quem o usa numa gravação é
       que decide quando sai, e sem isto ficava um vazio no meio */
    if (q.has('hold')) { const pa = document.querySelector('.palco');
      if (pa) pa.style.animation = 'none'; }
    if (q.get('nome')) document.getElementById('nome').textContent = q.get('nome');
    if (q.get('sub'))  document.getElementById('sub').textContent  = q.get('sub');
    if (q.get('cor'))  document.documentElement.style.setProperty('--azul', q.get('cor'));
  </script>
</body>
</html>
