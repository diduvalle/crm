<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual de marca · crm.cr0x.org</title>
<meta name="description" content="Manual de normas gráficas do crm.cr0x.org: a marca, as cores, as letras e onde cada uma se usa.">
<meta name="theme-color" content="#efe9dd">
<meta property="og:type" content="website">
<meta property="og:title" content="Manual de marca · crm.cr0x.org">
<meta property="og:description" content="A marca, as cores, as letras e onde cada uma se usa.">
<meta property="og:url" content="https://crm.cr0x.org/marca/">
<meta property="og:image" content="https://crm.cr0x.org/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Mono:wght@400;700&display=swap">
<style>
/* A porta do manual de marca: crm.cr0x.org/marca
   Existe para haver um endereço que se diga em voz alta - o PDF tem um nome
   comprido de propósito, para ficar certo depois de descarregado. */
:root{
  --papel:#efe9dd; --tinta:#171412; --tinta-2:#4a423c; --fraco:#6f655c;
  --azul:#0078bf; --azul-escuro:#005e95; --risco:#d6cdbd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:Newsreader,Georgia,serif;
  font-size:18px;line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:40px 20px;
  position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--tinta) .5px,transparent .6px);background-size:4px 4px;opacity:.07}
.folha{max-width:560px;width:100%;position:relative;z-index:1}
.marca{width:96px;margin-bottom:26px}
.eyebrow{font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--azul-escuro);margin-bottom:14px}
h1{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:2.4rem;line-height:1.05;
  letter-spacing:-.025em;margin-bottom:16px}
p{color:var(--tinta-2);margin-bottom:14px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 0}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:Archivo,system-ui,sans-serif;
  font-weight:700;font-size:.95rem;text-decoration:none;padding:13px 22px;border-radius:10px;
  background:var(--tinta);color:var(--papel);border:1.5px solid var(--tinta);transition:background .14s}
.btn:hover{background:var(--azul);border-color:var(--azul)}
.btn.sec{background:none;color:var(--tinta)}
.btn.sec:hover{background:var(--tinta);color:var(--papel)}
.btn svg{width:17px;height:17px;flex:none}
hr{border:0;border-top:1.5px solid var(--tinta);margin:34px 0 18px}
.pe{font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fraco);display:flex;flex-wrap:wrap;gap:6px 18px}
.pe a{color:var(--azul-escuro);text-decoration:none;border-bottom:1.5px solid var(--azul-escuro)}
@media(max-width:520px){ h1{font-size:1.9rem} body{font-size:17px} }
</style>
</head>
<body>
<main class="folha">
  <img class="marca" src="logo/crm-marca.svg" alt="">
  <p class="eyebrow">crm.cr0x.org</p>
  <h1>Manual de normas gráficas</h1>
  <p>A marca, as cores, as letras e o sítio de cada uma. Dezanove páginas com as regras de quem desenha, escreve ou imprime seja o que for com esta marca.</p>

  <div class="btns">
    <a class="btn" href="CRM-manual-de-normas-graficas.pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>
      Abrir o manual (PDF)
    </a>
  </div>

  <hr>
  <div class="pe">
    <span>V1.0 · Setembro 2026</span>
    <a href="mailto:crm@cr0x.org">crm@cr0x.org</a>
    <a href="/manual/">Manual da plataforma</a>
  </div>
</main>
</body>
</html>
