<!-- =====================================================================
     TEMPLATE DO EMAILJS  (template_8rfnjxa, serviço service_l6a25qr)
     =====================================================================
     Este ficheiro NÃO é carregado por nada: o template vive no painel do
     EmailJS. Está aqui para o desenho não existir só lá. Ao mudar no
     painel, mudar aqui também.

     O TEMPLATE É UM CANO, NÃO UMA MOLDURA
     Repara nas TRÊS chavetas: {{{message}}} insere o HTML como está, sem
     escapar. É isso que faz o desenho viajar - o modelo de email que o
     formando desenha nos "Modelos" (cor, logótipo, botão) chega mesmo ao
     cliente, em vez de ser achatado a texto.

     PORQUE ASSIM
     Antes, a moldura vivia aqui e o corpo vivia na app: a pré-visualização
     dizia "Como o cliente vai ver" e mostrava outra coisa, porque o que
     saía era só texto embrulhado nesta moldura. Agora a app manda o email
     inteiro - `emailHTML()` para os modelos desenhados, `emailTextoHTML()`
     para o convite, o teste e os avisos - e a pré-visualização mostra
     exatamente a mesma função. Não podem divergir.

     Também por isto o template não tem marca nenhuma: o mesmo envio serve
     o convite da escola E os emails do exercício, onde quem assina é a
     empresa fictícia do formando.

     CAMPOS DO TOPO (no painel, à direita - não estão neste ficheiro):
       To Email {{to_email}} · From Name {{from_name}} · Reply To {{reply_to}}
       Subject {{subject}} · Cc {{cc}} · Bcc {{bcc}}
     ===================================================================== -->
<div style="margin:0;padding:24px 12px;background:#f2f4f6">{{{message}}}</div>
