<style>
/* ---------- NOTIFICAÇÕES ---------- */
.notif-wrap{position:relative;display:flex}
.notif-badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:800;min-width:16px;height:16px;border-radius:20px;display:grid;place-items:center;padding:0 4px;pointer-events:none;border:2px solid var(--surface)}
.notif-panel{position:absolute;top:48px;right:0;width:340px;max-width:86vw;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.16s;z-index:90;overflow:hidden}
.notif-panel.open{opacity:1;transform:none;pointer-events:auto}
.notif-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.notif-list{max-height:60vh;overflow-y:auto}
.notif-item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--surface2)}
.notif-item .ni-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.notif-item .grow{min-width:0}
.notif-item strong{display:block;font-size:.85rem}
.notif-item span{font-size:.78rem;color:var(--muted)}
.notif-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.86rem}

.icon-btn{width:40px;height:40px;justify-content:center;background:var(--surface);border-color:var(--border);color:var(--muted)}
.lang-btn{font-weight:800;font-size:.78rem;letter-spacing:.04em;color:var(--g700)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.pager-info{font-size:.8rem;color:var(--muted);font-weight:600}
.pager-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pg-num{min-width:32px;height:32px;padding:0 9px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:.82rem;font-weight:700;color:var(--text);cursor:pointer;display:inline-grid;place-items:center}
.pg-num:hover{border-color:var(--g500);color:var(--g700)}
.pg-num.active{background:var(--g600);color:#fff;border-color:var(--g600);cursor:default}
.pg-dots{color:var(--muted);padding:0 2px}
.pager-btns .btn-xs[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.mail-split{display:grid;grid-template-columns:1.18fr 1fr;gap:18px;align-items:start;margin-bottom:18px}
@media(max-width:1000px){.mail-split{grid-template-columns:1fr}}
.read-steps{display:flex;gap:6px;flex-wrap:wrap}
.read-steps .rs{display:inline-flex;align-items:center;gap:4px;font-size:.71rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface3);color:var(--muted)}
.read-steps .rs.done{background:var(--g100);color:var(--g700)}
.mail-search-wrap{position:relative}
.mail-results{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:264px;overflow-y:auto;margin-top:4px;display:none}
.mail-result{display:flex;align-items:center;gap:10px;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border)}
.mail-result:last-child{border-bottom:0}
.mail-result:hover{background:var(--surface2)}
.mail-result.is-empty{cursor:default;justify-content:center;color:var(--muted);font-size:.84rem}
.picked{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--g300);background:var(--g50);border-radius:10px}
.scroll-list{max-height:360px;overflow-y:auto;padding-right:4px}
.sig-toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 8px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface2)}
.field .sig-toolbar select{height:34px;width:auto;min-width:104px;max-width:150px;flex:0 0 auto;padding:0 10px;font-size:.82rem;line-height:1.15;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)}
.sig-tb{height:30px;min-width:30px;padding:0 7px;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;font-weight:700}
.sig-tb:hover{border-color:var(--g500);background:var(--g50)}
.sig-editor{min-height:120px;max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:0 0 10px 10px;padding:12px 14px;background:var(--surface);color:var(--text);outline:none}
.sig-editor:focus{border-color:var(--g500)}
.sig-editor img{vertical-align:middle}
.sig-editor:empty:before{content:'Escreva aqui a sua assinatura…';color:var(--muted2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal-dow{text-align:center;font-size:.7rem;font-weight:800;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.03em}
.cal-cell{min-height:90px;border:1px solid var(--border);border-radius:9px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.12s;background:var(--surface);overflow:hidden}
.cal-cell:hover{border-color:var(--g400);background:var(--surface2)}
.cal-cell.empty{border:0;background:transparent;cursor:default}
.cal-cell.today{border-color:var(--g500);box-shadow:inset 0 0 0 1.5px var(--g500)}
.cal-num{font-size:.78rem;font-weight:700;color:var(--text)}
.cal-cell.today .cal-num{color:var(--g700)}
.cal-task{font-size:.67rem;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.4}
.cal-task.blue{background:var(--info-bg);color:var(--info)}
.cal-task.green{background:var(--g100);color:var(--g700)}
.cal-task.amber{background:var(--warn-bg);color:var(--warn)}
.cal-task.purple{background:#efe7fb;color:#7c3aed}
.cal-task.grey{background:var(--surface3);color:var(--muted)}
.cal-more{font-size:.64rem;color:var(--muted);font-weight:700}
.task-check{width:20px;height:20px;flex:0 0 auto;border:2px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;margin-right:9px}
.task-check.on{background:var(--g600);border-color:var(--g600)}
@media(max-width:760px){.cal-cell{min-height:56px}.cal-task{display:none}}
.seg-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg-toggle button{padding:6px 12px;font-size:.79rem;font-weight:700;background:var(--surface);color:var(--muted);border:0;cursor:pointer;transition:.12s}
.seg-toggle button.active{background:var(--g600);color:#fff}
.week-wrap{margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.week-row{display:grid;grid-template-columns:54px repeat(7,1fr)}
.week-head>div{padding:6px 2px;text-align:center;font-size:.66rem;font-weight:700;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border)}
.wk-dayhead strong{font-size:.98rem;color:var(--text)}
.wk-dayhead.today{color:var(--g700);background:var(--g100)}.wk-dayhead.today strong{color:var(--g700)}
.week-allday{border-bottom:2px solid var(--border)}
.week-allday>.wk-axis-lbl{font-size:.6rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 2px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.wk-allcol{border-left:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:34px;justify-content:center}
.week-body{display:grid;grid-template-columns:54px repeat(7,1fr);position:relative}
.wk-axis{display:flex;flex-direction:column}
.wk-hour{font-size:.64rem;color:var(--muted);text-align:right;padding:2px 6px 0;border-right:1px solid var(--border);box-sizing:border-box}
.wk-col{position:relative;border-left:1px solid var(--border);cursor:pointer;background:repeating-linear-gradient(to bottom,var(--border),var(--border) 1px,transparent 1px,transparent 48px)}
.wk-col.today{background:repeating-linear-gradient(to bottom,var(--g300),var(--g300) 1px,var(--g50) 1px,var(--g50) 48px)}
.wk-task{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 5px;font-size:.64rem;font-weight:600;overflow:hidden;cursor:pointer;color:#fff;line-height:1.22;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.wk-task.blue{background:var(--info)}.wk-task.green{background:var(--g600)}.wk-task.amber{background:#d9912f}.wk-task.purple{background:#7c3aed}.wk-task.grey{background:var(--muted)}
.wk-task.done{opacity:.5;text-decoration:line-through}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.barchart{width:100%}
.barchart-plot{display:flex;align-items:flex-end;gap:8px;padding:0 2px}
.barchart-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;cursor:default}
.barchart-val{font-size:.64rem;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.barchart-fill{width:100%;max-width:48px;border-radius:5px 5px 0 0;background:linear-gradient(var(--g600),var(--g400));transition:height .35s}
.barchart-labels{display:flex;gap:8px;padding:8px 2px 0;border-top:1px solid var(--border);margin-top:2px}
.barchart-labels>div{flex:1;text-align:center;font-size:.72rem;font-weight:600;color:var(--muted)}

/* ---------- Mini-painel de analítica (Definições) ---------- */
.an-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width:680px){.an-kpis{grid-template-columns:repeat(2,1fr)}}
.an-kpi{background:var(--surface2,var(--surface));border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.an-kpi-n{font-size:1.5rem;font-weight:800;color:var(--g700);line-height:1}
[data-theme="dark"] .an-kpi-n{color:var(--g400)}
.an-kpi-l{font-size:.74rem;font-weight:600;color:var(--muted)}
.an-block{margin-top:14px}
.an-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
@media (max-width:680px){.an-cols{grid-template-columns:1fr}}
.an-h{font-size:.82rem;font-weight:800;color:var(--g900);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
[data-theme="dark"] .an-h{color:var(--text)}
.an-row{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;margin-bottom:5px;border-radius:8px;overflow:hidden;background:var(--surface2,var(--surface));border:1px solid var(--border)}
.an-bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(0,166,81,.18),rgba(0,166,81,.06));z-index:0}
.an-lbl{position:relative;z-index:1;flex:1;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-n{position:relative;z-index:1;font-size:.8rem;font-weight:800;color:var(--g700)}
[data-theme="dark"] .an-n{color:var(--g400)}
.an-days{display:flex;align-items:flex-end;gap:6px;height:120px;padding:4px 2px 0}
.an-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
.an-day-bars{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.an-day-fill{width:46%;max-width:14px;min-height:2px;border-radius:3px 3px 0 0}
.an-day-fill.s-man{background:var(--g600)}
.an-day-fill.s-app{background:var(--g300,#7fd3a6)}
.an-day-lbl{font-size:.6rem;font-weight:600;color:var(--muted);white-space:nowrap}
.an-legend{font-size:.68rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.an-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:6px;flex:none}
.an-legend i.s-man{background:var(--g600)}
.an-legend i.s-app{background:var(--g300,#7fd3a6)}
.an-chips{display:flex;flex-wrap:wrap;gap:8px}
.an-chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface2,var(--surface));border:1px solid var(--border);font-size:.8rem;font-weight:600}
.an-chip strong{color:var(--g700)}
[data-theme="dark"] .an-chip strong{color:var(--g400)}
.an-pills{display:inline-flex;gap:4px;background:var(--surface2,var(--surface));border:1px solid var(--border);border-radius:999px;padding:3px}
.an-pill{border:0;background:none;cursor:pointer;font:inherit;font-size:.72rem;font-weight:700;color:var(--muted);padding:3px 10px;border-radius:999px;line-height:1.4}
.an-pill.on{background:var(--g600);color:#fff}
.an-map{width:100%;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2,var(--surface));overflow:hidden}
.an-map-svg{display:block;width:100%;height:auto}
.an-land{fill:var(--g100,#e6f4ec);stroke:var(--border);stroke-width:.5}
[data-theme="dark"] .an-land{fill:#1f2a24;stroke:#2c3a32}
.an-bubble{fill:var(--g500,#22a05a);fill-opacity:.55;stroke:var(--g700,#00803d);stroke-width:.8}

/* ---------- Painel de suporte (root) ---------- */
.root-cards{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.root-card{border:1px solid var(--border);border-radius:var(--r);background:var(--surface2,var(--surface));overflow:hidden}
.root-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px}
.root-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.root-main strong{font-size:.92rem}
.root-meta{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.root-act{display:flex;gap:6px;flex:none}
.root-edit{padding:0 13px 13px;border-top:1px dashed var(--border)}
.root-edit .form-grid{margin-top:12px}
.root-danger{margin-top:12px;padding:10px 12px;border:1px solid var(--danger,#dc2626);border-radius:10px;background:rgba(220,38,38,.05)}
[data-theme="dark"] .root-danger{background:rgba(220,38,38,.1)}

/* Consola de Suporte (ecrã inteiro) */
.root-console{width:100%;min-height:100vh;max-height:100vh;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:20px clamp(16px,5vw,48px);box-sizing:border-box;position:relative;z-index:1;overflow:hidden}
.rc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex:none}
.rc-brand{display:flex;align-items:center;gap:12px;min-width:0}
.rc-brand h1{font-size:1.25rem;font-weight:800;line-height:1.1}
.rc-brand p{font-size:.76rem;color:var(--muted)}
.rc-brand .brand-logo{width:42px;height:42px;flex:none}
.rc-actions{display:flex;align-items:center;gap:8px;flex:none}
.rc-body{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.rc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.74rem;flex-wrap:wrap;flex:none}
.root-console .root-cards{max-height:none}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1.7fr minmax(280px,.85fr);gap:20px;padding:26px;border-radius:var(--rl);background:linear-gradient(125deg,var(--g800),var(--g600) 55%,var(--g400));color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(0,107,60,.24)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);pointer-events:none}
.hero h3{font-size:1.5rem;font-weight:800;margin-bottom:6px;position:relative}
.hero p{color:rgba(255,255,255,.88);max-width:46ch;position:relative}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative}
.hero .btn{background:#fff;color:var(--g800)}
.hero .btn:hover{background:#f0f0f0}
.hero .btn-out{padding:9px 15px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);font-weight:700}
.hero .btn-out:hover{background:rgba(255,255,255,.28)}
.hero-side{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px;position:relative;display:flex;flex-direction:column;gap:10px}
.hero-side .ring-wrap{display:flex;align-items:center;gap:14px}

/* ---------- KPI ---------- */
.kpi{padding:17px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .kpi-ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--g100);color:var(--g700)}
.kpi small{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.kpi strong{font-size:1.72rem;font-weight:800;line-height:1;color:var(--text)}
.kpi .delta{font-size:.76rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}.delta.flat{color:var(--muted)}

/* ---------- LISTS ---------- */
.mini-list{display:flex;flex-direction:column}
.mini-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border)}
.mini-item:last-child{border-bottom:0}
.mini-item .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--g100);color:var(--g700);flex:0 0 auto}
.mini-item .grow{flex:1;min-width:0}
.mini-item .grow strong{display:block;font-size:.88rem}
.mini-item .grow span{font-size:.78rem;color:var(--muted)}

/* ---------- KANBAN ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:13px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:9px;min-width:210px;height:calc(100vh - 300px);min-height:360px;max-height:680px}
.kcol-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:.84rem;padding:2px 4px}
.kcol-head .cnt{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 8px;font-size:.72rem;color:var(--muted)}
.kcol-head .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.klist{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;min-height:40px;border-radius:10px;transition:background .15s;padding:2px;overflow-y:auto;overflow-x:hidden}
.klist::-webkit-scrollbar{width:6px}.klist::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}
.klist.drop{background:var(--g100);outline:2px dashed var(--g400)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.5}
.kcard .knum{font-size:.72rem;color:var(--muted);font-weight:700}
.kcard .ktitle{font-weight:700;font-size:.88rem}
.kcard .kfoot{display:flex;align-items:center;justify-content:space-between;font-size:.8rem}
.kcard .kval{font-weight:800;color:var(--g700)}
.ktotal{flex:0 0 auto;font-weight:800;color:var(--g700);font-size:.82rem;text-align:right;padding:7px 4px 0;border-top:1px solid var(--border);margin-top:2px}

/* ---------- DRAWER ---------- */
.drawer-back{position:fixed;inset:0;background:rgba(8,20,15,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(540px,94vw);background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s cubic-bezier(.22,.61,.36,1);z-index:61;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-body{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* accao destrutiva discreta: so ganha cor quando o rato la esta */
/* KPI que filtra: so ganha aspeto de botao quando e clicavel */
/* detalhe ao passar o rato numa barra: instantaneo, ao contrario do title do browser */
.barchart-col{position:relative}
.bar-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;
  background:var(--g900,#0b3a24);color:#fff;padding:9px 11px;border-radius:9px;font-size:.74rem;
  line-height:1.5;white-space:nowrap;text-align:left;opacity:0;pointer-events:none;
  transition:opacity .12s;z-index:6;box-shadow:0 8px 24px -6px rgba(0,0,0,.35)}
.bar-tip strong{display:block;margin-bottom:4px;font-size:.78rem}
.bar-tip .mais{opacity:.7;margin-top:2px}
.barchart-col:hover .bar-tip{opacity:1}
/* o .gtip reutiliza o visual do .bar-tip mas e posicionado por JS:
   e preciso anular o posicionamento absoluto que vem da outra classe */
.gtip{position:fixed;left:0;top:0;right:auto;bottom:auto;transform:none;margin:0;
  opacity:0;transition:opacity .1s;white-space:nowrap;max-width:min(420px,92vw)}
.gtip strong{margin-bottom:4px}
.barchart-plot{overflow:visible}
.kpi[data-act]{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi[data-act]:hover{border-color:var(--g300);box-shadow:var(--shadow)}
.kpi.kpi-on{border-color:var(--g600);box-shadow:inset 0 0 0 1px var(--g600)}
.kpi.kpi-on small{color:var(--g700);font-weight:800}
.drawer-foot .btn-del{width:38px;height:38px;padding:0;justify-content:center;background:transparent;border-color:var(--border);color:var(--muted)}
.drawer-foot .btn-del:hover{background:var(--danger-bg);border-color:transparent;color:var(--danger)}

/* ---------- LINE EDITOR ---------- */
.lines{display:flex;flex-direction:column;gap:8px}
.line-row{display:grid;grid-template-columns:2.2fr .6fr .9fr .7fr .9fr .7fr auto;gap:8px;align-items:end}
.line-head{display:grid;grid-template-columns:2.2fr .6fr .9fr .7fr .9fr .7fr auto;gap:8px;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:0 2px}
.totbox{margin-top:14px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.totbox .row{display:flex;justify-content:space-between;font-size:.9rem}
.totbox .row.grand{font-weight:800;font-size:1.08rem;color:var(--g700);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--border);margin:2px 0}
.stat-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.stat-line:last-child{border-bottom:0}
.progress{height:8px;background:var(--surface3);border-radius:20px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--g600),var(--g400));border-radius:20px;transition:width .5s}
.callout{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:.86rem;border:1px solid}
.callout.info{background:var(--info-bg);border-color:transparent;color:var(--info)}
.callout.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.callout.green{background:var(--g100);border-color:transparent;color:var(--g700)}
.callout strong{display:block;margin-bottom:2px}
.callout .ctxt{color:var(--text)}
.callout .ctxt strong{display:inline;margin:0}
.gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gloss{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:15px}
.gloss h4{font-size:.92rem;font-weight:800;color:var(--g700);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gloss p{font-size:.82rem;color:var(--muted);line-height:1.5}
.seg-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
.seg-bar>div{display:grid;place-items:center;color:#fff;font-size:.74rem;font-weight:700;min-width:0;overflow:hidden}
.funnel{display:flex;flex-direction:column;gap:7px}
.funnel-row{display:flex;align-items:center;gap:12px}
.funnel-bar{height:38px;border-radius:9px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:.86rem;min-width:60px;transition:width .6s}
.funnel-meta{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:4px;width:fit-content;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px;font-size:.84rem;font-weight:700;color:var(--muted);cursor:pointer;border:0;background:transparent}
.tab.active{background:var(--surface);color:var(--g700);box-shadow:var(--shadow)}
.checklist{display:flex;flex-direction:column;gap:2px}
.check-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;cursor:pointer;transition:background .12s}
.check-item:hover{background:var(--surface2)}
.check-box{width:21px;height:21px;border-radius:6px;border:2px solid var(--border);flex:0 0 auto;display:grid;place-items:center;transition:.14s}
.check-item.done .check-box{background:var(--g600);border-color:var(--g600);color:#fff}
.check-item.done .ctxt2{color:var(--muted);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.persona-card{display:flex;gap:14px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px}
.persona-card .pav{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--g100);flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.86rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{text-align:right;font-weight:700}

/* ---------- RESPONSIVE ---------- */
.menu-btn{display:none}
@media(max-width:1100px){.split,.cols-2,.hero,.form-grid{grid-template-columns:1fr}.cols-3,.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi strong{font-size:1.5rem}}
@media(max-width:640px){.cols-3,.cols-4{grid-template-columns:1fr}}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:90;width:min(86vw,300px);transform:translateX(-105%);transition:transform .26s}
  .app.nav-open .sidebar{transform:none}
  .app.nav-collapsed{grid-template-columns:1fr}
  .app.nav-collapsed .brand-txt,.app.nav-collapsed .nav-link .lbl,.app.nav-collapsed .nav-group{display:block}
  .menu-btn{display:inline-flex}
  .header [data-act="toggle-nav"]{display:none}      /* recolher só faz sentido no desktop */
  .header-l{gap:10px}
  .header-l>div{min-width:0;overflow:hidden}          /* deixa o título truncar em vez de partir linha */
  .header-l h2,.header-l .breadcrumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .header-r{gap:6px}
  .header-r [data-act="help"],.header-r [data-act="present"]{display:none}   /* desktop-only em mobile */
  .header-r [data-act="new"] .btn-label{display:none}                        /* "+ Novo" fica só-ícone */
  .header-r [data-act="new"]{padding:9px 12px}
  .content{padding:16px}
  .header{padding:0 14px;gap:10px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:85;display:none}
  .app.nav-open .scrim{display:block}
  .line-row,.line-head{grid-template-columns:1fr 1fr;gap:7px}
}
@media print{
  .sidebar,.header,.toast-wrap,.no-print{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  body{background:#fff}
}

.portal-card{width:min(640px,100%);padding:26px;animation:fade .3s ease}
.portal-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.portal-head h1{line-height:1.2}
.consent-opt{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:.14s;margin-bottom:9px;background:var(--surface2)}
.consent-opt:hover{border-color:var(--g400)}
.consent-opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--g600);flex:0 0 auto}
.consent-opt .co-txt strong{display:block;font-size:.9rem}
.consent-opt .co-txt span{font-size:.8rem;color:var(--muted)}

/* ---------- SELETOR DE PERSONA (wizard) ---------- */
.persona-pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:2px solid var(--border);border-radius:13px;cursor:pointer;text-align:center;transition:.14s}
.persona-pick:hover{border-color:var(--g300)}
.persona-pick.on{border-color:var(--g600);background:var(--g100)}
.persona-pick .pav{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:1.3rem;background:var(--surface2)}
.persona-pick strong{font-size:.84rem}

/* ---------- CONSTRUTOR DE MODELOS ---------- */
.tpl-editor{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.tpl-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px}
.block-list{display:flex;flex-direction:column;gap:7px}
.block-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);cursor:pointer;transition:.12s}
.block-row:hover{border-color:var(--g300)}
.block-row.sel{border-color:var(--g600);background:var(--g100);box-shadow:0 0 0 2px rgba(0,166,81,.12)}
.block-row.dragging{opacity:.4}
.block-row.dragover{border-color:var(--g600);border-style:dashed}
.block-row .bhandle{color:var(--muted2);flex:0 0 auto;cursor:grab;display:flex}
.block-row .blabel{flex:1;font-weight:700;font-size:.84rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-row .bact{display:flex;gap:3px;flex:0 0 auto}
.block-row .bact button{width:24px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:.7rem;padding:0}
.block-row .bact button:hover{color:var(--text);border-color:var(--g300)}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.palette button{justify-content:flex-start}
.tpl-preview-wrap{background:var(--surface3);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;justify-content:center;min-height:420px;overflow:auto}
.paper{background:#fff;width:100%;max-width:720px;min-height:540px;padding:38px;border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.16);color:#15302a}
.tpl-thumb{height:150px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.tpl-thumb-inner{position:absolute;top:0;left:0;width:265%;transform:scale(.377);transform-origin:top left;padding:20px;color:#15302a;pointer-events:none}
.tpl-card:hover{border-color:var(--g400);box-shadow:var(--shadow-lg)}
@media(max-width:980px){.tpl-editor{grid-template-columns:1fr}.tpl-side{position:static}}

/* ---------- BALÕES INFORMATIVOS (slides) ---------- */
.infotip{position:relative;display:inline-flex;align-items:center;cursor:help;vertical-align:middle;margin-left:5px;outline:none}
.infotip-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--warn-bg);color:var(--warn);transition:transform .14s,background .14s;box-shadow:0 0 0 2px transparent}
.infotip:hover .infotip-ic,.infotip:focus .infotip-ic{background:var(--warn);color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px var(--warn-bg)}
.infotip-pop{position:fixed;left:0;top:0;width:288px;max-width:82vw;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;opacity:0;pointer-events:none;transition:opacity .16s;z-index:3000;display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:400;white-space:normal;text-transform:none;letter-spacing:normal}
.infotip:hover .infotip-pop,.infotip:focus .infotip-pop,.infotip:focus-within .infotip-pop{opacity:1;pointer-events:auto}
.infotip-pop strong{font-size:.85rem;color:var(--text);line-height:1.35}
.infotip-pop .ix{font-size:.79rem;color:var(--muted);line-height:1.5}
.infotip-pop .ref{font-size:.72rem;color:var(--g700);font-weight:700;display:flex;align-items:center;gap:5px;border-top:1px solid var(--border);padding-top:7px;margin-top:1px}
.delta-cmp{font-size:.74rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}

/* ---------- PESQUISA GLOBAL ---------- */
.search-results{margin:2px 6px 8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:11px;overflow:hidden;max-height:280px;overflow-y:auto}
.search-results .sr-item{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.search-results .sr-item:last-child{border-bottom:0}
.search-results .sr-item:hover{background:rgba(255,255,255,.12)}
.search-results .sr-item svg{flex:0 0 auto;opacity:.85}
.search-results .sr-item .grow{min-width:0}
.search-results .sr-item strong{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-results .sr-item span{font-size:.74rem;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.app.nav-collapsed .search-results{display:none!important}

/* ---------- MODO DE APRESENTAÇÃO ---------- */
#presentExit{display:none}
body.present .sidebar{display:none}
body.present .app{grid-template-columns:1fr}
body.present .header .menu-btn,body.present .header [data-act="toggle-nav"]{display:none}
body.present .content{max-width:1320px}
body.present #presentExit{display:inline-flex;align-items:center;gap:6px;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:210;background:var(--g700);color:#fff;border:0;border-radius:30px;padding:10px 20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-lg)}
/* diálogos personalizados - substituem confirm/prompt/alert nativos */
.dlg-back{position:fixed;inset:0;z-index:6000;display:grid;place-items:center;padding:22px;background:rgba(8,20,15,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity .15s}
.dlg-back.open{opacity:1}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:min(430px,94vw);padding:22px 22px 18px;transform:translateY(10px) scale(.985);transition:transform .18s cubic-bezier(.22,.61,.36,1)}
.dlg-back.open .dlg{transform:none}
.dlg-title{font-size:1.06rem;font-weight:800;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.dlg-msg{font-size:.9rem;color:var(--muted);line-height:1.55}
.dlg-input{width:100%;margin-top:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:.92rem;font-family:inherit}
.dlg-input:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="worldmap.js"></script>
</head>
<body>
<div class="toast-wrap" id="toasts"></div>
<div id="verComoBar" class="vercomo-bar" style="display:none"></div>
<button id="presentExit" data-act="present">✕ Sair da apresentação</button>

<div class="app" id="app">
  <div class="scrim" data-act="close-nav"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="favicon.svg" alt=""></div>
      <div class="brand-txt"><h1>CRM</h1><p>Plataforma de Formação</p></div>
    </div>
    <div class="nav-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" type="search" placeholder="Pesquisar…" autocomplete="off" aria-label="Pesquisar">
    </div>
    <div id="searchResults" class="search-results" style="display:none"></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">
      <div class="profile">
        <div class="avatar">DV</div>
        <div class="profile-txt"><strong>Formador</strong><span>Sessão de demonstração</span></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="header">
      <div class="header-l">
        <button class="icon-btn menu-btn" data-act="open-nav" title="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <button class="icon-btn" data-act="toggle-nav" title="Recolher menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v18M3 3h18v18H3z"/></svg></button>
        <div><h2 id="pageTitle">Dashboard</h2><div class="breadcrumb" id="breadcrumb">Visão geral</div></div>
      </div>
      <div class="header-r">
        <div class="notif-wrap">
          <button class="icon-btn" data-act="notif" title="Notificações"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
          <span class="notif-badge" id="notifBadge" style="display:none">0</span>
          <div class="notif-panel" id="notifPanel"></div>
        </div>
        <button class="icon-btn" data-act="help" title="Manual online - abrir a página deste ecrã"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
        <button class="icon-btn" data-act="present" title="Modo de apresentação (ecrã limpo)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="icon-btn lang-btn" data-act="lang" title="Idioma / Language" id="langBtn">PT</button>
        <button class="icon-btn" data-act="theme" title="Tema claro/escuro" id="themeBtn"></button>
        <button class="btn" data-act="new" data-type="cliente"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> <span class="btn-label">Novo</span></button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- PORTAL DO TITULAR (público) -->
<div id="portal" class="portal" style="display:none"></div>
<div id="pubprop" class="portal" style="display:none"></div>

<!-- LOGIN -->

/* ---------- Multi-turma (ambientes isolados por ?t=nome) ---------- */
/* O mesmo padrão que o servidor aceita. Tê-lo escrito nos dois sítios é
   feio, mas tê-los diferentes seria pior: um a deixar entrar o que o outro
   recusa é o tipo de desencontro que só aparece em produção. */
const TURMA_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{1,23}$/;
function currentTurma(){
  try{
    const sp=new URLSearchParams(location.search);
    let raw=(sp.get('t')||'').trim();
    /* o atalho ?12023483 - uma chave sem valor - continua a servir */
    if(!raw){ for(const [k,v] of sp){ if(!v && TURMA_RE.test(k)){ raw=k; break; } } }
    return TURMA_RE.test(raw) ? raw : '';
  }catch(e){ return ''; }
}
/* O espaço é a escola. Se o endereço não o trouxer, fica vazio e a app usa a
   marca neutra da plataforma - nunca se assume nenhuma escola por omissão. */
/* Primeiro o caminho (/xpto), que é a forma boa. O ?e=xpto continua a
   funcionar para quem já tenha um link antigo, e para poder testar sem
   depender de como o alojamento trata os caminhos que não existem.

   Os nomes reservados ficam de fora aqui também, e não só no servidor: sem
   isto, abrir /manual antes de o alojamento o servir carregaria a app à
   procura de uma escola chamada "manual". */
const ESPACO_RESERVADO = ['manual','repo','b','estilo','bases','assets','sobre','admin','api','app','static'];
function currentEspaco(){
  try{
    const val = x => { x=(x||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
      return (/^[a-z0-9][a-z0-9-]{1,30}$/.test(x) && !ESPACO_RESERVADO.includes(x)) ? x : ''; };
    const seg = location.pathname.split('/').filter(Boolean)[0] || '';
    if(!/\./.test(seg)){ const p = val(seg); if(p) return p; }   /* ignora ficheiros */
    return val(new URLSearchParams(location.search).get('e'));
  }catch(e){ return ''; }
}
const ESPACO_SLUG = currentEspaco();
let ESPACO = null;          /* preenchido pelo servidor; null = marca neutra */

const TURMA = currentTurma();
const TURMA_SFX = TURMA ? ('::'+TURMA) : '';
/* ================== A SANDBOX E DE CADA UM ==================
   A chave era 'crm-v1::<turma>' - com a TURMA mas SEM o utilizador. Num
   navegador partilhado, todos os que entrassem na mesma turma escreviam e liam
   o MESMO sitio: bastava um formador entrar com a conta de um formando para
   ajudar, e ao voltar a si proprio continuava a ver o trabalho dele. Terminar
   sessao nao resolvia, porque a chave nao mudava.

   Passa a 'crm-v1::<turma>::<utilizador>'. Como o utilizador so se sabe
   depois do login, isto tem de ser uma FUNCAO e nao uma constante - e o estado
   em memoria tem de ser recarregado sempre que a sessao muda. ================== */
const STORE_BASE = 'crm-v1'+TURMA_SFX;
const MIGRA_FALHOU='crm-v1-migracao'+TURMA_SFX;
/* quem esta autenticado, ANTES de o resto do arranque correr: numa turma a
   identidade vive no token do Supabase, so fora de turma e que esta na SESSION_KEY */
function sessaoGuardadaId(){
  try{
    if(TURMA){ const s=supaSession(); return (s&&s.user&&s.user.id)||''; }
    return localStorage.getItem(SESSION_KEY)||'';
  }catch(e){ return ''; }
}
function storeKey(){
  /* fora de turma (demo publica, um so posto) mantem-se a chave antiga */
  if(!TURMA) return STORE_BASE;
  const id = sessionUserId || sessaoGuardadaId();
  return id ? (STORE_BASE+'::'+id) : STORE_BASE;
}
/* Migracao unica: o que estava na chave partilhada passa para quem esta a
   entrar AGORA, e a chave antiga e APAGADA - senao a proxima pessoa a usar
   este computador herdava o trabalho da anterior, que e exatamente o defeito. */
function migrarSandbox(){
  if(!TURMA) return;
  const nova=storeKey(); if(nova===STORE_BASE) return;   /* ainda sem sessao */
  try{
    if(localStorage.getItem(nova)!=null){ localStorage.removeItem(STORE_BASE); return; }
    const antiga=localStorage.getItem(STORE_BASE);
    if(antiga==null) return;
    /* copiar e CONFIRMAR antes de apagar - se o localStorage estiver cheio, o
       setItem falha, e apagar primeiro seria perder o trabalho de alguem */
    localStorage.setItem(nova,antiga);
    if(localStorage.getItem(nova)===antiga){ localStorage.removeItem(STORE_BASE); localStorage.removeItem(MIGRA_FALHOU); }
    else throw new Error('copia incompleta');
  }catch(e){
    /* falhou: fica tudo como estava e marca-se de quem e a chave antiga, para
       o load() a poder ler - so a essa pessoa, nao a quem vier a seguir */
    try{ localStorage.removeItem(nova); }catch(_){}
    try{ localStorage.setItem(MIGRA_FALHOU, sessionUserId||sessaoGuardadaId()); }catch(_){}
  }
}

/* Isto misturava LOCAL com UTC e perdia um dia em todo o fuso a leste de
   Greenwich - Portugal no verao (WEST, UTC+1) incluido. new Date("2026-08-24T00:00:00")
   e meia-noite LOCAL; toISOString() converte para UTC e da 23:00 do dia
   ANTERIOR, pelo que slice(0,10) devolvia 2026-08-23. Resultado: addDays(x,1)
   devolvia o proprio dia, as semanas do calendario andavam 6 dias, e o prazo de
   um mes de um pedido RGPD ficava com 29.
   Agora a conta e feita so com os componentes da data - o relogio nao entra. */
const addDays = (iso,d)=>{ const [y,m,dd]=String(iso).slice(0,10).split('-').map(Number);

/* Posiciona o balão pedagógico em coordenadas fixas (escapa a caixas com overflow:hidden) */
function placeInfotip(tip){
  const pop=tip.querySelector('.infotip-pop'); if(!pop) return;
  const r=tip.getBoundingClientRect();
  const pw=pop.offsetWidth||288, ph=pop.offsetHeight||130;
  let left=r.left+r.width/2-pw/2;
  left=Math.max(8,Math.min(left,window.innerWidth-pw-8));
  let top=r.top-ph-10; if(top<8) top=r.bottom+10;
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
document.addEventListener('mouseover',e=>{ const t=e.target.closest&&e.target.closest('.infotip'); if(t) placeInfotip(t); },true);
document.addEventListener('focusin',e=>{ const t=e.target.closest&&e.target.closest('.infotip'); if(t) placeInfotip(t); });
function initialsOf(u){ return (((u&&u.nome||'?')[0]||'')+((u&&u.apelido||'')[0]||'')).toUpperCase(); }
function avatarHTML(u, size){ size=size||36; const ini=initialsOf(u); if(u&&u.avatar) return `<div class="avatar" style="width:${size}px;height:${size}px;padding:0;overflow:hidden;font-size:${Math.round(size*0.34)}px"><img src="${esc(u.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove();this.parentNode.textContent='${esc(ini)}'"></div>`; return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.34)}px">${esc(ini)}</div>`; }

/* ---------- validação de NIF português ---------- */
function validNIF(nif){
  nif=String(nif||'').trim(); if(!/^\d{9}$/.test(nif)) return false;
  if(!'1235689'.includes(nif[0])) return false;
  let s=0; for(let i=0;i<8;i++) s+=Number(nif[i])*(9-i);
  let c=11-(s%11); if(c>=10) c=0;
  return c===Number(nif[8]);
}
// Tipo de entidade a partir do 1.º/2.º dígito do NIF/NIPC (regra da AT) - 100% offline
function nifTipo(n){ n=String(n||'').replace(/\D/g,''); if(!n) return ''; const d=n[0], d2=n.slice(0,2);
  if('123'.includes(d)) return 'Pessoa singular';
  if(d2==='45') return 'Pessoa singular (não residente)';
  if(d==='5') return 'Pessoa coletiva (empresa)';
  if(d==='6') return 'Administração Pública';
  if(['70','71','72','74','75','77','78','79'].includes(d2)) return 'Outras entidades';
  if(d==='8') return 'Empresário em nome individual';
  if(d==='9') return 'Pessoa coletiva (outros regimes)';
  return 'Tipo desconhecido';
}
// texto de feedback ao vivo do campo NIF/NIPC (validade + tipo)
function nifLiveHTML(v){ const n=String(v||'').replace(/\D/g,''); if(!n) return '9 dígitos - validado pelo dígito de controlo';
  if(n.length<9) return `${n.length}/9 dígitos${n[0]?' · '+nifTipo(n):''}`;
  return validNIF(n) ? `✓ NIF válido · ${nifTipo(n)}` : '✗ dígito de controlo inválido'; }

/* ---------- desconto de loyalty + totais da proposta ---------- */
/* Cadência de cada linha: 'Mensal'/'Anual' = recorrente (SaaS); resto = pontual (serviço).
   O valor da venda (TCV) = pontual + recorrente × meses de fidelização. */
function lineGross(l){ return (+l.qtd||0)*(+l.preco||0); }                               // qtd × preço
function lineNet(l){ return lineGross(l)*(1-Math.min(100,Math.max(0,+l.desconto||0))/100); } // após desconto da linha
function lineMonthly(l){ const m=l.modelo||'Único'; return m==='Mensal'?lineNet(l) : m==='Anual'?lineNet(l)/12 : 0; }
function lineOneOff(l){ const m=l.modelo||'Único'; return (m==='Mensal'||m==='Anual')?0:lineNet(l); }
function proposalCalc(p){ const linhas=p.linhas||[]; const meses=Math.max(1,+p.meses||12);
  const pontual=linhas.reduce((s,l)=>s+lineOneOff(l),0);
  const mrr=linhas.reduce((s,l)=>s+lineMonthly(l),0);
  return {pontual, mrr, meses, recorrente:mrr*meses, sub:pontual+mrr*meses}; }
/* Nível de fidelização da venda: da EMPRESA (as pessoas mudam de empresa); particular usa o contacto. */
function dealTier(p){ if(p.empresaId){ const e=(state.empresas||[]).find(x=>x.id===p.empresaId); return e?e.loyalty:null; } const c=getC(p.clienteId); return c?c.loyalty:null; }
function dealDiscount(p){ const lv=(state.loyalty||[]).find(l=>l.nome===dealTier(p)); return lv?Number(lv.desconto||0):0; }
function clientDiscount(clienteId){ const c=getC(clienteId); if(!c) return 0; const lv=(state.loyalty||[]).find(l=>l.nome===c.loyalty); return lv?Number(lv.desconto||0):0; }
/* Totais do DOCUMENTO do cliente (PDF/email): preços tal como se mostram - o SaaS
   fica em €/mês (NÃO anualiza). O valor anualizado (TCV) é só estatística interna,
   nunca vai para a proposta (100€/mês assusta menos que 1200€/ano). */
function documentTotals(p){
  const sub=(p.linhas||[]).reduce((s,l)=>s+lineNet(l),0);
  const pct=dealDiscount(p); const desconto=sub*pct/100;
  const iva=(p.linhas||[]).reduce((s,l)=>s+lineNet(l)*(1-pct/100)*(+l.iva||0)/100,0);
  return {sub, descontoPct:pct, desconto, base:sub-desconto, iva, total:sub-desconto+iva};
}
/* PDF/documento: separa SETUP (pontual) de SUBSCRIÇÃO MENSAL (SaaS) - nunca o total dos 12 meses.
   Mostra o recorrente em €/mês e o setup uma vez. Anual entra no bucket mensal (÷12). */
function docSplit(p){
  const pct=dealDiscount(p); const B={pontual:{gross:0,iva:0}, mensal:{gross:0,iva:0}};
  (p.linhas||[]).forEach(l=>{ const rec=(l.modelo==='Mensal'||l.modelo==='Anual'); const val=rec?lineMonthly(l):lineOneOff(l); const b=rec?B.mensal:B.pontual; b.gross+=val; b.iva+=val*(1-pct/100)*(+l.iva||0)/100; });
  [B.pontual,B.mensal].forEach(b=>{ b.desc=b.gross*pct/100; b.net=b.gross-b.desc; b.total=b.net+b.iva; });
  B.pct=pct; return B;
}
function proposalTotals(p){ const c=proposalCalc(p); const pct=dealDiscount(p); const meses=c.meses;
  const desconto=c.sub*pct/100;
  const iva=(p.linhas||[]).reduce((s,l)=>{ const tcvLine=lineOneOff(l)+lineMonthly(l)*meses; return s+tcvLine*(1-pct/100)*(+l.iva||0)/100; },0);
  return {pontual:c.pontual, mrr:c.mrr, meses, recorrente:c.recorrente, sub:c.sub, descontoPct:pct, desconto, base:c.sub-desconto, iva, total:c.sub-desconto+iva}; }

  _i18nAttrEls.forEach(el=>{ if(el.__ptA){ for(const a in el.__ptA){ if(el.__ptA[a]!=null) el.setAttribute(a,el.__ptA[a]); } el.__ptA=null; } }); _i18nAttrEls.clear();
}
function startI18n(){
  const lb=$('#langBtn'); if(lb) lb.textContent=(getLang()==='en')?'EN':'PT';
  if(getLang()==='en') translateTree(document.body); else untranslateAll();
  if(!_i18nObs){
    _i18nObs=new MutationObserver(ms=>{ if(getLang()!=='en') return; for(const m of ms){ for(const nn of m.addedNodes){ translateTree(nn); } } });
    _i18nObs.observe(document.body,{childList:true,subtree:true});
  }
}

  }
  Object.values(state.roles||{}).forEach(r=>{ if(r&&Array.isArray(r.modules)&&!r.modules.includes('agenda')&&(r.gestor||r.modules.includes('clientes'))) r.modules.push('agenda'); });
  if(!Array.isArray(state.activityLog)) state.activityLog=[];

  if(state.settings.baseURL==null) state.settings.baseURL='base.json';

    // backfill de sub-permissões (feats): sessões antigas ficaram sem elas → repor o default do grupo (só se nunca foram definidas)
    if(r.feats===undefined && def.roles[name] && def.roles[name].feats) r.feats=def.roles[name].feats.slice();
    // 'funcoes' era gerido pela feat 'origens' → quem a tinha herda a nova feat (não perde a secção)
    if(Array.isArray(r.feats) && r.feats.includes('origens') && !r.feats.includes('funcoes')) r.feats.push('funcoes');
    /* a taça nasceu depois destas sessões: entra ligada, como nas novas */
    if(Array.isArray(r.feats) && name==='Formando' && !r.feats.includes('taca')) r.feats.push('taca'); });
  // garantir que cada modelo tem blocos (construtor por blocos)
  (state.propostaTemplates||[]).forEach(t=>{ if(!Array.isArray(t.blocks)||!t.blocks.length) t.blocks=blocksFromLegacy(t); });

  (state.empresas||[]).forEach(e=>{
    if(e.fase==null){ const props=(state.propostas||[]).filter(p=>p.empresaId===e.id); const ids=(state.clientes||[]).filter(c=>c.empresaId===e.id).map(c=>c.id); const env=(state.envios||[]).filter(x=>ids.includes(x.clienteId)); e.fase = props.some(p=>p.estado==='Ganha')?'Cliente' : props.length?'SQL' : (env.some(x=>x.aberto||x.clicado)?'MQL':'Lead'); }

  try{ const sid=localStorage.getItem(SESSION_KEY); if(sid&&state.utilizadores.some(u=>u.id===sid)) sessionUserId=sid; }catch(e){}

function save(){
  /* numa turma sem sessao aberta nao ha a quem pertencer: nao se grava nada,
     para o ecra de login nunca escrever por cima do trabalho de ninguem */
  if(TURMA && !sessionUserId) return;
  try{ localStorage.setItem(storeKey(), JSON.stringify(state)); }catch(e){ toast('Erro ao gravar','Sem espaço no localStorage','err'); }
  try{ rascunhoAgenda(); }catch(e){} }
function resetDemo(){ state = demoData(); save(); render(); toast('Dados repostos','Carregados os dados de demonstração.'); }

function stockControlled(pr){ return !!(pr && pr.controlaStock && pr.tipo!=='Serviço'); }
function stockLow(pr){ return stockControlled(pr) && Number(pr.stock||0)<=Number(pr.stockMin||0); }
// abate ao Ganha, repõe ao sair de Ganha (reabrir/apagar). p.stockAbatido evita duplo abate.
function applyStockForProp(p, oldS, newS){
  if(!p) return; const won=s=>s==='Ganha';
  if(won(newS)&&!won(oldS)&&!p.stockAbatido){ const neg=[];
    (p.linhas||[]).forEach(l=>{ if(!l.produtoId)return; const pr=state.produtos.find(x=>x.id===l.produtoId); if(pr&&stockControlled(pr)){ pr.stock=Number(pr.stock||0)-Number(l.qtd||0); if(pr.stock<0) neg.push(pr.nome); } });
    p.stockAbatido=true; if(neg.length) toast('Stock insuficiente','Ficou negativo: '+neg.join(', '),'warn');
  } else if(!won(newS)&&won(oldS)&&p.stockAbatido){
    (p.linhas||[]).forEach(l=>{ if(!l.produtoId)return; const pr=state.produtos.find(x=>x.id===l.produtoId); if(pr&&stockControlled(pr)) pr.stock=Number(pr.stock||0)+Number(l.qtd||0); });
    p.stockAbatido=false;
  }
}

const PERFIL_CAMPOS=['avatar','assinatura','assinaturaFont','assinaturaSize','telefone','cargo'];
let perfilSubido=false;
function perfilAplicar(lu,u){
  if(!lu||!u) return false;
  let subir=false;
  PERFIL_CAMPOS.forEach(k=>{ const v=u[k]; if(v!=null) lu[k]=v; else if(lu[k]) subir=true; });
  return subir;
}
/* guarda o perfil na sessao em cache: assim aparece logo no arranque seguinte,
   mesmo sem rede, e nao se pede o mesmo ao servidor a cada abertura */
function perfilCache(lu){
  const sess=supaSession(); if(!sess||!sess.user||!lu) return;
  PERFIL_CAMPOS.forEach(k=>{ sess.user[k]=lu[k]||''; });
  sess.user.nome=lu.nome; sess.user.apelido=lu.apelido||''; sess.user.email=lu.email||'';
  setSupaSession(sess);
}

  if(perfilSubido||!lu||!TURMA||!supaToken()) return;
  perfilSubido=true;
  supaAtualizarPerfil(lu).then(()=>perfilCache(lu)).catch(()=>{ perfilSubido=false; });
}
/* Substituir o estado (recuperar copia, importar JSON, recarregar a base) traz
   com ele o perfil que estava DENTRO desse ficheiro. Isto volta a por o da
   conta por cima - a foto e a assinatura nao sao daquele ficheiro, sao da pessoa. */
function perfilDoServidor(){
  if(!TURMA||!supaToken()) return Promise.resolve(null);
  return supaRpc('meu_perfil',{p_token:supaToken()}).then(u=>{
    if(!u||!u.id) return null;
    ingestSupaUser(u); perfilCache(state.utilizadores.find(x=>x.id===u.id));
    render(); return u;
  }).catch(()=>null);   /* migracao por correr, ou sem rede: fica o que ha */
}
function ingestSupaUser(u){
  if(!u||!u.id) return;
  const rec={id:u.id,username:u.username,nome:u.nome,apelido:u.apelido||'',email:u.email||'',email2:u.email2||'',papel:u.papel||'Formando',estado:'Ativo',password:'(supabase)'};
  const lu=state.utilizadores.find(x=>x.id===u.id);
  if(lu) Object.assign(lu,rec); else state.utilizadores.push(rec);
  const alvo=state.utilizadores.find(x=>x.id===u.id);
  if(perfilAplicar(alvo,u)) perfilSubir(alvo);
  save();
}
// Restaura a sessão Supabase guardada (turma mode) no arranque
function restoreSupaSession(){
  if(!TURMA) return;
  const s=supaSession();
  if(s&&s.user){ ingestSupaUser(s.user); sessionUserId=s.user.id; rememberTurma(TURMA); carregarEquipa(); }
}
// Login numa turma via Supabase
async function supaLogin(username,password){
  /* dentro de uma escola entra-se pela porta dela: o login_espaco recusa
     uma turma que não seja desta escola (TURMA_NOUTRA_ESCOLA). Sem slug
     no endereço - a app fora da plataforma - vale o login de sempre. */
  const data=ESPACO_SLUG
    ? await supaRpc('login_espaco',{p_codigo:TURMA,p_username:username,p_password:password,p_espaco:ESPACO_SLUG})
    : await supaRpc('login',{p_codigo:TURMA,p_username:username,p_password:password});
  setSupaSession({token:data.token,user:data.user});
  sessionUserId=data.user.id;
  /* a chave depende de quem entrou: migra o que houvesse e recarrega, senao
     ficava em memoria o trabalho de quem esteve aqui antes */
  migrarSandbox(); load();
  ingestSupaUser(data.user);
  rememberTurma(TURMA);
  carregarEquipa();
  return data.user;
}
// Criar turma - nesta app so o root cria, pela criar_turma_em (sem gate de email)
async function supaCriarTurma(p){
  const data=await supaRpc('criar_turma',{p_codigo:p.codigo,p_email:p.email,p_username:p.username,p_password:p.password,p_nome:p.nome,p_apelido:p.apelido||'',p_nome_turma:p.nomeTurma||null});
  return data;
}
function supaLogout(){ const t=supaToken(); if(t&&supa()) supaRpc('logout',{p_token:t}).catch(()=>{}); setSupaSession(null); }

/* ---------- Registo de turmas RECENTES neste dispositivo ----------
   Lista local que alimenta o seletor de Turma no login. Sem backend: só
   conhece as turmas que ESTE browser já visitou/criou.

   A chave leva o slug da ESCOLA. Era uma só para todo o crm.cr0x.org, e
   como /iefp e /tp são a mesma origem partilhavam a lista: ao abrir uma
   escola apareciam atalhos para turmas de outra. A chave antiga vai fora
   uma vez - não há como saber a que escola pertencia cada código lá
   dentro, e voltam a aparecer no próximo login. */
const RECENT_TURMAS_KEY='crm-turmas-recentes'+(ESPACO_SLUG?'::'+ESPACO_SLUG:'');
try{ if(ESPACO_SLUG) localStorage.removeItem('crm-turmas-recentes'); }catch(e){}
function recentTurmas(){ try{ const a=JSON.parse(localStorage.getItem(RECENT_TURMAS_KEY)||'[]'); return Array.isArray(a)?a.filter(t=>t&&TURMA_RE.test(t.codigo)):[]; }catch(e){ return []; } }
function rememberTurma(codigo,nome){
  /* aceitava só 8 dígitos, de quando os números de turma eram todos assim;
     desde o 02-codigo-turma.sql um código é 'crm-2026' e nunca era guardado */
  codigo=(codigo||'').trim(); if(!TURMA_RE.test(codigo)) return;
  try{
    let a=recentTurmas().filter(t=>t.codigo!==codigo);
    a.unshift({codigo,nome:(nome||'').trim()||'',ts:todayISO()});
    if(a.length>8) a.length=8;
    localStorage.setItem(RECENT_TURMAS_KEY,JSON.stringify(a));
  }catch(e){}
}

/* ---------- ROOT / SUPORTE (acesso global à identidade) ----------
   Entra-se pelo gesto escondido: no seletor de Turma → "Entrar por código…"
   → escrever "root". Token de root só em memória + localStorage temporário. */
let rootSession=null, rootTurmas=[];
try{ const _rt=sessionStorage.getItem('crm-root-tok'); if(_rt) rootSession=_rt; }catch(e){}
async function supaLoginRoot(pw){ return await supaRpc('login_root',{p_password:pw}); }
async function supaListarTurmas(tok){ return await supaRpc('listar_turmas',{p_token:tok}); }
async function supaRootAbrir(tok,codigo){ return await supaRpc('root_abrir_turma',{p_token:tok,p_codigo:codigo}); }
function submitRootLogin(){
  const f=$('#loginForm'); if(!f) return; const err=$('#loginErr'); if(err) err.textContent='';
  const pw=(f.querySelector('[name="rootpass"]')||{}).value||'';
  if(!pw){ if(err) err.textContent='Indique a palavra-passe de suporte.'; return; }
  const btn=f.querySelector('[data-act="rootlogin"]'); if(btn){ btn.disabled=true; btn.textContent='A entrar…'; }
  supaLoginRoot(pw).then(d=>{ rootSession=d.token; try{sessionStorage.setItem('crm-root-tok',d.token);}catch(_){} return supaListarTurmas(d.token); })
    .then(list=>{ rootTurmas=list||[]; renderLogin(); })
    .catch(e=>{ if(err) err.textContent=supaMsg(e); const b=$('#loginForm [data-act="rootlogin"]'); if(b){ b.disabled=false; b.textContent='Entrar como suporte'; } });
}
function rootOpenTurma(codigo){
  if(!rootSession) return; const err=$('#loginErr'); if(err) err.textContent='';
  supaRootAbrir(rootSession,codigo).then(d=>{
    try{ localStorage.setItem('crm-supa::'+codigo, JSON.stringify({token:d.token,user:d.user})); }catch(_){}
    rememberTurma(codigo);
    location.href=location.pathname+'?t='+codigo;
  }).catch(e=>{ if(err) err.textContent=supaMsg(e); });
}
function rootLogout(){ if(rootSession&&supa()) supaRpc('logout_root',{p_token:rootSession}).catch(()=>{}); try{sessionStorage.removeItem('crm-root-tok');}catch(_){} rootSession=null; rootTurmas=[]; loginMode='login'; renderLogin(); }

/* ---------- Painel de SUPORTE (root) - Definições e Consola ---------- */
let rootResumo=null, rootRows=[], rootBoxSel='#rootPanel';
function rootFmtDate(t){ if(!t) return '-'; try{ return new Date(t).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return '-'; } }
function rootFmtName(t){ return ((t.formador_nome||'')+' '+(t.formador_apelido||'')).trim(); }
function rootRowHTML(t){
  const nome=esc(t.nome||('Turma '+t.codigo));
  const fnome=esc(rootFmtName(t)||'-');
  const fmail=esc(t.formador_email||t.criado_por||'-');
  const uname=esc(t.formador_username||'');
  const c=esc(t.codigo);
  return `<div class="root-card" data-codigo="${c}">
    <div class="root-row">
      <div class="root-main"><strong>${nome}</strong><span class="root-meta">${c} · ${t.n_utilizadores} util. · criada ${rootFmtDate(t.criado_em)} · últ. atividade ${rootFmtDate(t.ultima_atividade)}</span><span class="root-meta">${ic('user',12)} ${fnome} · ${uname?('<strong>@'+uname+'</strong> · '):''}${fmail}</span></div>
      <div class="root-act"><button class="btn-ghost btn-sm" data-act="root-open" data-codigo="${c}">Abrir</button><button class="btn-sec btn-sm" data-act="root-toggle" data-codigo="${c}">Gerir</button></div>
    </div>
    <div class="root-edit" hidden>
      <div class="form-grid">
        <div class="field"><label>Nome da turma</label><input data-rf="nome" value="${nome}"></div>
        <div class="field"><label>Utilizador (login do formador) ${ic('lock',12)}</label><input value="${uname}" readonly title="O username de entrada do formador (não editável)" style="background:var(--surface3);color:var(--muted);cursor:not-allowed"></div>
        <div class="field"><label>Formador - nome</label><input data-rf="fnome" value="${esc(t.formador_nome||'')}"></div>
        <div class="field"><label>Formador - apelido</label><input data-rf="fapelido" value="${esc(t.formador_apelido||'')}"></div>
        <div class="field"><label>Formador - email</label><input data-rf="femail" type="email" value="${esc(t.formador_email||t.criado_por||'')}"></div>
      </div>
      <div class="toolbar" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" data-act="root-save" data-codigo="${c}">Guardar alterações</button>
        <button class="btn-sec btn-sm" data-act="root-recovery" data-codigo="${c}">${ic('lock',15)} Repor acesso do formador</button>
      </div>
      <div class="root-reveal" hidden></div>
      <div class="root-danger">
        <div class="ctxt" style="font-size:.78rem"><strong>Apagar turma</strong> - remove utilizadores, sessões e entregas. Irreversível. Escreve <strong>${c}</strong> para confirmar:</div>
        <div class="toolbar" style="margin-top:6px;gap:8px"><input data-rf="delcode" placeholder="${c}" style="max-width:170px" autocomplete="off"><button class="btn-danger btn-sm" data-act="root-del" data-codigo="${c}">Apagar turma</button></div>
      </div>
    </div>
  </div>`;
}
/* ================== ESPAÇOS (backoffice) ==================
   Um espaço é uma escola. É daqui que sai a marca que a app veste, e é por
   isso que ele existe: para o nome de uma instituição deixar de estar
   escrito no código. ========================================= */
let espacosRows = [];

/* Os campos por que se pergunta. A carga horária e a designação legal com
   NIF são as duas que escapam sempre e depois fazem falta - a primeira ao
   selo e ao relatório, a segunda ao aviso legal, que sem ela teria de ser
   texto fixo. Por isso estão aqui em vez de ficarem para "depois". */
/* o nome da coluna na base, quando não é igual ao da chave */
const ESPACO_COL = { logo:'logo_url', logoEscuro:'logo_escuro_url', favicon:'favicon_url',
  legalNome:'legal_nome', emailContacto:'email_contacto', responsavelDados:'responsavel_dados',
  remetenteNome:'remetente_nome', emailResposta:'email_resposta', seloEmissor:'selo_emissor',
  seloLigado:'selo_ligado', seloTexto:'selo_texto', refsCurso:'refs_curso' };
const ESPACO_CAMPOS = [
  ['nome','Nome da escola','text'], ['slug','Endereço (slug)','text'],
  ['logo','Logótipo (URL)','text'], ['cor','Cor principal','text'],
  ['legalNome','Designação legal','text'], ['nif','NIF','text'],
  ['morada','Morada','text'], ['emailContacto','Email de contacto','email'],
  ['responsavelDados','Responsável pelos dados','text'],
  ['remetenteNome','Nome do remetente','text'], ['emailResposta','Email de resposta','email'],
  ['modulos','Módulos','text'], ['horas','Carga horária','text'],
  ['formador','Formador por omissão','text'],
  ['seloEmissor','Emissor do selo','text'],
  /* só faz sentido onde o curso existe: fora do IEFP, um "UFCD 10868"
     e um "slide 114" apontam para material que a escola não tem */
  ['refsCurso','Mostrar referências ao curso (UFCD e slides)','checkbox'],
];

function espacoCardHTML(e){
  const v = k => esc((e && e[k] != null ? e[k] : '') + '');
  const id = e ? e.id : '';
  return `<div class="root-card" data-espaco="${esc(id)}">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <strong style="flex:1">${e ? esc(e.nome) : 'Novo espaço'}</strong>
      ${e && e.arquivado ? '<span class="pill amber" style="font-size:.66rem">Arquivado</span>' : ''}
      ${e ? `<span class="muted" style="font-size:.72rem">/?e=${esc(e.slug)}</span>` : ''}
    </div>
    <div class="grid2" style="gap:8px">
      ${ESPACO_CAMPOS.map(([k,rot,t]) => t === 'checkbox'
        ? `<label class="field" style="flex-direction:row;align-items:center;gap:9px;cursor:pointer">
            <input data-ef="${k}" type="checkbox" style="width:16px;height:16px;flex:none" ${e && e[ESPACO_COL[k] || k] ? 'checked' : ''}>
            <span>${rot}</span></label>`
        : `<div class="field"><label>${rot}</label>
        <input data-ef="${k}" type="${t}" value="${v(ESPACO_COL[k] || k)}"></div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn" data-act="espaco-guardar">Guardar</button>
      ${e ? `<button class="btn-sec" data-act="espaco-turma">Criar turma aqui</button>
             <button class="btn-sec" data-act="espaco-arquivar">${e.arquivado ? 'Reativar' : 'Arquivar'}</button>` : ''}
    </div>
  </div>`;
}

/* Arquivar, nunca apagar: os links continuam a abrir e o que já foi emitido
   continua verificável - só não se cria nada de novo. */
function espacosHTML(){
  return `<details class="def-sec" open style="margin:0 0 14px">
    <summary><strong>Espaços</strong> <span class="muted" style="font-weight:400">· ${espacosRows.length} escola(s)</span></summary>
    <div style="padding:10px 0">
      ${espacosRows.map(espacoCardHTML).join('') || '<div class="muted" style="padding:6px 2px">Ainda não há espaços. Cria o primeiro.</div>'}
      <div id="espacoNovoBox"></div>
      <button class="btn-sec" data-act="espaco-novo" style="margin-top:8px">+ Novo espaço</button>
    </div>
  </details>`;
}

function rootPaint(filter){
  const box=$(rootBoxSel); if(!box) return;
  const f=(filter||'').trim().toLowerCase();
  const match=t=> !f || (t.codigo||'').includes(f) || (t.nome||'').toLowerCase().includes(f)
      || (t.formador_email||t.criado_por||'').toLowerCase().includes(f) || rootFmtName(t).toLowerCase().includes(f);
  const rows=rootRows.filter(match); const r=rootResumo||{};
  box.innerHTML=`
    <div class="an-kpis">
      <div class="an-kpi"><span class="an-kpi-n">${r.turmas||0}</span><span class="an-kpi-l">Turmas</span></div>
      <div class="an-kpi"><span class="an-kpi-n">${r.formadores||0}</span><span class="an-kpi-l">Formadores</span></div>
      <div class="an-kpi"><span class="an-kpi-n">${r.formandos||0}</span><span class="an-kpi-l">Formandos</span></div>
      <div class="an-kpi"><span class="an-kpi-n">${r.entregas||0}</span><span class="an-kpi-l">Entregas</span></div>
    </div>
    <div class="toolbar" style="margin:12px 0 10px;align-items:center"><div class="search-inp" style="flex:1;max-width:340px"><input id="rootSearch" placeholder="Pesquisar turma, código ou formador…" value="${esc(filter||'')}" autocomplete="off"></div><a class="legal-link" data-act="root-end" style="margin-left:auto;cursor:pointer">Terminar suporte</a></div>
    <div class="root-cards">${rows.map(rootRowHTML).join('')||'<div class="muted" style="padding:10px">Sem turmas.</div>'}</div>`;
  const si=$('#rootSearch'); if(si){ si.oninput=()=>rootPaint(si.value); if((filter||'').length){ si.focus(); try{si.setSelectionRange(filter.length,filter.length);}catch(e){} } }
}
async function renderRootPanel(sel){
  if(sel) rootBoxSel=sel;
  const box=$(rootBoxSel); if(!box) return;
  try{
    /* os espaços à parte: se a migração ainda não tiver corrido, a lista
       fica vazia e o resto do painel continua a funcionar como sempre */
    const [resumo,turmas]=await Promise.all([ supaRpc('root_resumo',{p_token:rootSession}), supaRpc('root_turmas',{p_token:rootSession}) ]);
    rootResumo=resumo; rootRows=turmas||[]; rootPaint('');
  }catch(e){
    box.innerHTML=`<div class="callout warn" style="margin:0">${ic('alert',16)}<div class="ctxt">Não foi possível carregar (${esc(supaMsg(e)||'')}). Se for a 1.ª vez, falta correr o <code>schema.sql</code> atualizado (novos RPCs <code>root_*</code>) no Supabase. Se a sessão de suporte expirou, volta a entrar como suporte.</div></div>`;
  }
}
function rootCardOf(el){ return el.closest('.root-card'); }

/* Lê o cartão inteiro de uma vez. O servidor só aplica as chaves que
   conhece, por isso mandar tudo é seguro e poupa comparações aqui. */
function espacoLer(card){
  const d={}; card.querySelectorAll('[data-ef]').forEach(i=>{
    d[i.dataset.ef] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
  return d;
}
function espacoGuardar(el){
  const card=el.closest('.root-card'); if(!card) return;
  const id=card.dataset.espaco||null, d=espacoLer(card);
  if(!d.slug){ toast('Falta o endereço','O slug identifica a escola no endereço','warn'); return; }
  el.disabled=true;
  supaRpc('espaco_guardar',{p_token:rootSession,p_id:id||null,p_dados:d})
    .then(()=>{ toast('Guardado',d.nome||d.slug); renderRootPanel(); })
    .catch(e=>{ toast('Erro',supaMsg(e),'err'); el.disabled=false; });
}
function espacoArquivar(el){
  const card=el.closest('.root-card'); if(!card) return;
  const id=card.dataset.espaco; const d=espacoLer(card);
  const eRow=espacosRows.find(x=>x.id===id); const vai=!(eRow&&eRow.arquivado);
  supaRpc('espaco_guardar',{p_token:rootSession,p_id:id,p_dados:Object.assign(d,{arquivado:vai})})
    .then(()=>{ toast(vai?'Arquivado':'Reativado', d.nome||d.slug); renderRootPanel(); })
    .catch(e=>toast('Erro',supaMsg(e),'err'));
}

/* O formador não se inscreve: é criado aqui, com as credenciais à mão.
   Sete campos, e o uiPrompt desta app só aceita um - por isso o formulário
   abre dentro do próprio cartão, em vez de se inventar um diálogo novo. */
const TURMA_CAMPOS = [
  ['codigo','Código da turma'], ['nome','Nome da turma'],
  ['fnome','Nome do formador'], ['fapelido','Apelido'],
  ['femail','Email do formador'], ['user','Utilizador'], ['pass','Password inicial'],
];
function espacoCriarTurma(el){
  const card=el.closest('.root-card'); if(!card) return;
  let box=card.querySelector('.espaco-turma-box');
  if(box){ box.remove(); return; }                 /* segundo clique fecha */
  box=document.createElement('div');
  box.className='espaco-turma-box';
  box.style.cssText='margin-top:10px;padding:10px;border-top:1px solid var(--border)';
  box.innerHTML='<div class="grid2" style="gap:8px">'+
    TURMA_CAMPOS.map(([k,rot])=>'<div class="field"><label>'+rot+'</label>'+
      '<input data-tf="'+k+'" type="'+(k==='pass'?'text':'text')+'"></div>').join('')+
    '</div><button class="btn" data-act="espaco-turma-criar" style="margin-top:8px">Criar turma</button>';
  card.appendChild(box);
}

/* O código de recuperação aparece UMA vez: na base fica só o resumo
   cifrado. Por isso vai num aviso que não fecha sozinho, e não num toast. */
async function espacoTurmaCriar(el){
  const card=el.closest('.root-card'), box=el.closest('.espaco-turma-box');
  if(!card||!box) return;
  const slug=(card.querySelector('[data-ef="slug"]')||{}).value||'';
  const g=k=>{ const i=box.querySelector('[data-tf="'+k+'"]'); return i?i.value.trim():''; };
  if(!TURMA_RE.test(g('codigo'))){ toast('Código inválido','2 a 24 caracteres: letras, números, ponto ou hífen','warn'); return; }
  if(!g('user')||!g('pass')){ toast('Faltam credenciais','Utilizador e password são obrigatórios','warn'); return; }
  el.disabled=true;
  try{
    const d=await supaRpc('criar_turma_em',{p_token:rootSession,p_slug:slug,
      p_codigo:g('codigo'),p_nome_turma:g('nome'),p_nome:g('fnome'),p_apelido:g('fapelido'),
      p_email:g('femail'),p_username:g('user'),p_password:g('pass')});
    await uiAlert('Turma '+g('codigo')+' criada em /'+slug+'.\n\n'+
      'Código de recuperação do formador:\n'+((d&&d.recovery)||'-')+'\n\n'+
      'Guarda-o agora: não volta a ser mostrado.',
      {title:'Turma criada',okText:'Já guardei'});
    renderRootPanel();
  }catch(e){ toast('Erro',supaMsg(e),'err'); el.disabled=false; }
}
function rootEndSupport(){ if(rootSession&&supa()) supaRpc('logout_root',{p_token:rootSession}).catch(()=>{}); try{sessionStorage.removeItem('crm-root-tok');}catch(_){} rootSession=null; toast('Suporte terminado','Sessão de root encerrada'); render(); }
function rootSave(el){
  const card=rootCardOf(el); if(!card) return; const cod=el.dataset.codigo;
  const g=n=>{ const i=card.querySelector('[data-rf="'+n+'"]'); return i?i.value:''; };
  el.disabled=true;
  Promise.all([
    supaRpc('root_renomear_turma',{p_token:rootSession,p_codigo:cod,p_nome:g('nome')}),
    supaRpc('root_editar_formador',{p_token:rootSession,p_codigo:cod,p_nome:g('fnome'),p_apelido:g('fapelido'),p_email:g('femail')})
  ]).then(()=>{ toast('Guardado','Turma '+cod+' atualizada'); renderRootPanel(); })
   .catch(e=>{ toast('Erro',supaMsg(e),'err'); el.disabled=false; });
}
async function rootRecovery(el){
  const card=rootCardOf(el); if(!card) return; const cod=el.dataset.codigo;
  if(!(await uiConfirm('O código anterior deixa de funcionar.',{title:'Novo código de recuperação - turma '+cod+'?',okText:'Gerar'}))) return;
  el.disabled=true;
  supaRpc('root_recovery_formador',{p_token:rootSession,p_codigo:cod}).then(d=>{
