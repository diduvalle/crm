/* Origem de cada item na revisão: 'manual' (formando), 'gerado' (botão gerador), 'base' (arranque).
   Usa a marca fonte; se faltar (entregas antigas), infere pelo criadoPor (seed = u1..u4). */
const SEED_UIDS=new Set(['u1','u2','u3','u4']);
function itemFonte(it){ if(!it) return ''; if(it.fonte) return it.fonte; if(it.criadoPor) return SEED_UIDS.has(it.criadoPor)?'base':'manual'; return ''; }
function fonteBadge(it){ const f=itemFonte(it);
  if(f==='manual') return `<span class="chip" style="background:var(--g100);color:var(--g700);font-weight:700" title="Criado manualmente pelo formando">Manual</span>`;
  if(f==='gerado') return `<span class="chip" style="background:var(--surface3);color:var(--muted)" title="Gerado pelo botão Gerador de dados de exemplo">Gerado</span>`;
  if(f==='base')   return `<span class="chip" style="background:var(--surface3);color:var(--muted2)" title="Veio nos dados de exemplo (arranque)">Base</span>`;
  return `<span class="muted" style="font-size:.72rem" title="Origem não registada (entrega anterior a esta funcionalidade)">-</span>`; }
/* ================== ANÁLISE DE UMA ENTREGA ==================
   A submissão traz o estado inteiro do CRM do formando. O problema nunca foi
   o que se captura - é o que se consegue LER. Isto transforma o payload num
   conjunto de indicadores comparáveis entre formandos.

   Regra central: separar o que veio no BERÇO (dados de exemplo, iguais para
   todos) do que a pessoa CRIOU. Sem isto, 13 formandos parecem todos iguais. */

/* ids do seed sao curtos e fixos (cl1, pt2, au3); os criados usam uid() =
   prefixo + 6 caracteres aleatorios (empab12cd) */
/* PROVENIÊNCIA - a app já a regista em cada registo, no campo `fonte`:
     base   = veio com a app (dados de exemplo do arranque)
     gerado = veio do "Gerador de dados de exemplo" (um clique, dezenas de registos)
     manual = criado à mão pela pessoa      <- é isto que conta como trabalho
     form   = entrou pelo formulário web-to-lead (também é ação dela)
   Onde `fonte` existe, é a fonte da verdade. Nem tudo a tem (automações,
   modelos, campos personalizados...), e aí cai-se na forma do id: os do
   arranque são curtos e fixos (cl1, pt2, au3), os criados usam uid(). */
const ehSeedId = id => /^[a-z]{1,4}[0-9]{1,3}$/.test(String(id||""));
const FONTE_PROPRIA=["manual","form"];
function ehProprio(x){
  const f=x&&x.fonte;
  if(f) return FONTE_PROPRIA.includes(f);
  return !ehSeedId(x&&x.id);
}
function ehGerado(x){ return !!(x&&x.fonte==="gerado"); }
function proprios(lista){ return (Array.isArray(lista)?lista:[]).filter(ehProprio); }
/* quantos registos vieram do gerador - mostra-se, não se esconde */
function contaGerador(p){
  p=p||{};
  return ["empresas","clientes","propostas","produtos","casos","retencoes","consentimentos","pedidos","tarefas","campanhas"]
    .reduce((t,k)=>t+(p[k]||[]).filter(ehGerado).length,0);
}
const pc=(n,d)=>d?Math.round(n/d*100):0;

/* Práticas esperadas: cada uma é um SIM/NÃO verificável no trabalho entregue.
   A "cobertura" é a percentagem destas que a pessoa demonstrou - é isso que
   permite comparar A com B sem inventar uma nota. */
function praticasEntrega(p){
  p=p||{};
  const cli=p.clientes||[], emp=p.empresas||[], prop=p.propostas||[], prod=p.produtos||[];
  const camp=p.campanhas||[], auto=p.automacoes||[], tpl=p.templates||[], mod=p.propostaTemplates||[];
  const casos=p.casos||[], ret=p.retencoes||[], cons=p.consentimentos||[], ped=p.pedidos||[];
  const ropa=p.ropa||[], viol=p.violacoes||[], tar=p.tarefas||[], cx=p.camposExtra||[];
  const set=p.settings||{};
  const pEmp=proprios(emp), pCli=proprios(cli), pProp=proprios(prop), pProd=proprios(prod);
  const pCamp=proprios(camp), pAuto=proprios(auto), pTpl=proprios(tpl), pMod=proprios(mod);
  const pCasos=proprios(casos), pRet=proprios(ret), pCons=proprios(cons), pPed=proprios(ped);
  const pTar=proprios(tar), pRopa=proprios(ropa), pViol=proprios(viol);

  /* Estes sinais olham SÓ para o que a pessoa criou. Se olhassem para o conjunto
     todo, os dados de exemplo davam-nos de graça a toda a gente - e quem não
     fez nada aparecia com meia dúzia de práticas cumpridas. */
  const temLinhasCatalogo = pProp.some(x=>(x.linhas||[]).some(l=>l.produtoId));
  const estadosUsados = new Set(pProp.map(x=>x.estado).filter(Boolean));
  const perdidaComMotivo = pProp.some(x=>x.estado==="Perdida") && pProp.filter(x=>x.estado==="Perdida").every(x=>String(x.motivoPerda||"").trim());
  const modComTags = pMod.some(m=>(m.blocks||[]).some(b=>/\{\{[\w.]+\}\}/.test(String(b.conteudo||""))));
  const autoMultiPasso = pAuto.some(a=>(a.passos||[]).length>1);
  const autoComCondicao = pAuto.some(a=>(a.condSegmento&&a.condSegmento!=="Todos")||a.condFase||a.condScore||a.condNivel);
  const autoNaoEmail = pAuto.some(a=>(a.passos||[]).some(x=>(x.tipo||"email")!=="email"));
  const autoComSaida = pAuto.some(a=>a.saida);
  const casosFechados = pCasos.filter(c=>/Resolvid|Fechad/i.test(String(c.estado||""))).length;
  const casosComCsat = pCasos.filter(c=>c.csat!=null&&c.csat!=="").length;
  /* responder a um pedido do seed É trabalho dele - mas o seed já traz um
     concluído (d1), por isso só conta a partir do segundo */
  const pedRespondidos = ped.filter(x=>/Conclu/i.test(String(x.estado||""))).length;
  const pedAlemDoSeed = pedRespondidos > 1;
  const cliComEmpresa = pCli.filter(c=>c.empresaId).length;
  const prodComStock = pProd.filter(x=>x.controlaStock).length;

  /* Cada prática: chave, rótulo, cumpriu, área, e - o que interessa para
     avaliar - QUANTOS e QUAIS. Sem os nomes, "criou empresas" não diz nada. */
  const P_=(k,l,feito,mod,n,itens)=>({k,l,feito:!!feito,mod,n:n||0,itens:(itens||[]).filter(Boolean)});
  const nomeCli=c=>((c.nome||'')+' '+(c.apelido||'')).trim()||c.email||'(sem nome)';
  const nomeProp=x=>(x.numero?x.numero+' · ':'')+(x.titulo||'(sem título)');
  const L=[
    P_("emp","Criou empresas próprias", pEmp.length>0, "Contas", pEmp.length,
       pEmp.map(x=>x.nome+(x.dimensao?' · '+x.dimensao:'')+(x.fase?' · '+x.fase:''))),
    P_("cli","Criou contactos próprios", pCli.length>0, "Contas", pCli.length,
       pCli.map(c=>nomeCli(c)+(c.empresa?' · '+c.empresa:' · (sem empresa)'))),
    P_("assoc","Ligou os contactos que criou a empresas", pCli.length>0 && pc(cliComEmpresa,pCli.length)>=80, "Contas", cliComEmpresa,
       pCli.filter(c=>!c.empresaId).map(c=>nomeCli(c)+' - por ligar')),
    P_("prod","Criou artigos no catálogo", pProd.length>0, "Catálogo", pProd.length,
       pProd.map(x=>x.nome+(x.preco!=null?' · '+money(x.preco):''))),
    P_("stock","Usou controlo de stock", prodComStock>0, "Catálogo", prodComStock,
       pProd.filter(x=>x.controlaStock).map(x=>x.nome+' · stock '+(x.stock!=null?x.stock:'-'))),
    P_("prop","Criou propostas próprias", pProp.length>0, "Vendas", pProp.length,
       pProp.map(x=>nomeProp(x)+' · '+(x.estado||'-'))),
    P_("cat","Propostas com artigos do catálogo", temLinhasCatalogo, "Vendas",
       pProp.filter(x=>(x.linhas||[]).some(l=>l.produtoId)).length,
       pProp.filter(x=>(x.linhas||[]).some(l=>l.produtoId)).map(x=>nomeProp(x)+' · '+(x.linhas||[]).filter(l=>l.produtoId).length+' artigo(s)')),
    P_("pipe","Moveu propostas no pipeline (≥3 estados)", estadosUsados.size>=3, "Vendas", estadosUsados.size,
       [...estadosUsados].map(e=>e+' · '+pProp.filter(x=>x.estado===e).length+' proposta(s)')),
    P_("ganha","Fechou pelo menos uma proposta", estadosUsados.has("Ganha"), "Vendas",
       pProp.filter(x=>x.estado==="Ganha").length,
       pProp.filter(x=>x.estado==="Ganha").map(nomeProp)),
    P_("perda","Registou o motivo de todas as perdas", perdidaComMotivo, "Vendas",
       pProp.filter(x=>x.estado==="Perdida").length,
       pProp.filter(x=>x.estado==="Perdida").map(x=>nomeProp(x)+' · '+(String(x.motivoPerda||'').trim()||'SEM MOTIVO'))),
    P_("mod","Construiu um modelo de proposta", pMod.length>0, "Modelos", pMod.length,
       pMod.map(m=>(m.nome||'(sem nome)')+' · '+((m.blocks||[]).length)+' bloco(s)')),
    P_("modtag","Usou tags dinâmicas no modelo", modComTags, "Modelos",
       pMod.filter(m=>(m.blocks||[]).some(b=>/\{\{[\w.]+\}\}/.test(String(b.conteudo||"")))).length,
       pMod.filter(m=>(m.blocks||[]).some(b=>/\{\{[\w.]+\}\}/.test(String(b.conteudo||"")))).map(m=>{
         const t=new Set(); (m.blocks||[]).forEach(b=>String(b.conteudo||'').replace(/\{\{([\w.]+)\}\}/g,(x,g)=>{t.add(g);return x;}));
         return (m.nome||'(sem nome)')+' · '+[...t].join(', '); })),
    P_("tpl","Criou/editou templates de email", pTpl.length>0, "Marketing", pTpl.length,
       pTpl.map(t=>(t.nome||'(sem nome)')+(t.assunto?' · '+t.assunto:''))),
    P_("camp","Criou campanhas", pCamp.length>0, "Marketing", pCamp.length,
       pCamp.map(c=>(c.nome||'(sem nome)')+' · '+(c.segmento||'Todos')+(c.nivel?' + '+c.nivel:'')+' · '+(c.estado||'-'))),
    P_("auto","Criou automações próprias", pAuto.length>0, "Marketing", pAuto.length,
       pAuto.map(a=>(a.nome||'(sem nome)')+' · '+triggerLabel(a.trigger))),
    P_("autopass","Automação com mais do que um passo", autoMultiPasso, "Marketing",
       pAuto.filter(a=>(a.passos||[]).length>1).length,
       pAuto.filter(a=>(a.passos||[]).length>1).map(a=>(a.nome||'-')+' · '+(a.passos||[]).map(x=>passoDescricao(x,tpl)).join(' → '))),
    P_("autocond","Automação com condições", autoComCondicao, "Marketing",
       pAuto.filter(a=>(a.condSegmento&&a.condSegmento!=="Todos")||a.condFase||a.condScore||a.condNivel).length,
       pAuto.filter(a=>(a.condSegmento&&a.condSegmento!=="Todos")||a.condFase||a.condScore||a.condNivel).map(a=>(a.nome||'-')+' · '+condicoesTexto(a))),
    P_("autoacao","Automação com ação que não é email", autoNaoEmail, "Marketing",
       pAuto.filter(a=>(a.passos||[]).some(x=>(x.tipo||"email")!=="email")).length,
       pAuto.filter(a=>(a.passos||[]).some(x=>(x.tipo||"email")!=="email")).map(a=>(a.nome||'-')+' · '+(a.passos||[]).filter(x=>(x.tipo||'email')!=='email').map(x=>passoDescricao(x,tpl)).join(' + '))),
    P_("autosaida","Automação com critério de saída", autoComSaida, "Marketing",
       pAuto.filter(a=>a.saida).length,
       pAuto.filter(a=>a.saida).map(a=>(a.nome||'-')+' · sai se '+saidaLabel(a.saida))),
    P_("caso","Abriu casos de apoio", pCasos.length>0, "Serviço", pCasos.length,
       pCasos.map(c=>(c.titulo||c.assunto||'(sem título)')+' · '+(c.estado||'-'))),
    P_("casofecha","Resolveu casos", casosFechados>0, "Serviço", casosFechados,
       pCasos.filter(c=>/Resolvid|Fechad/i.test(String(c.estado||""))).map(c=>c.titulo||c.assunto||'(sem título)')),
    P_("csat","Registou satisfação (CSAT/NPS)", casosComCsat>0, "Serviço", casosComCsat,
       pCasos.filter(c=>c.csat!=null&&c.csat!=="").map(c=>(c.titulo||'(sem título)')+' · CSAT '+c.csat)),
    P_("ret","Trabalhou retenção/churn", pRet.length>0, "Serviço", pRet.length,
       pRet.map(r=>{const e=(emp.find(x=>x.id===r.empresaId)||{}).nome||'(empresa)'; return e+' · '+(r.estado||'-')+(r.motivo?' · '+r.motivo:'');})),
    P_("cons","Registou consentimentos", pCons.length>0, "RGPD", pCons.length,
       pCons.map(c=>{const t=cli.find(x=>x.id===c.clienteId); return (t?nomeCli(t):'(titular)')+' · '+(c.finalidade||'-')+' · '+(c.base||'-')+' · '+(c.estado||'-');})),
    P_("ped","Respondeu a pedidos de titular", pedAlemDoSeed, "RGPD", pedRespondidos,
       ped.map(x=>{const t=cli.find(c=>c.id===x.clienteId); return (x.tipo||'-')+' · '+(t?nomeCli(t):'(titular)')+' · '+(x.estado||'-');})),
    P_("ropa","Preencheu o ROPA", pRopa.length>0, "RGPD", pRopa.length,
       pRopa.map(r=>(r.atividade||'(sem nome)')+(r.base?' · '+r.base:''))),
    P_("viol","Registou violações de dados", pViol.length>0, "RGPD", pViol.length,
       pViol.map(v=>(v.descricao||v.tipo||'(sem descrição)'))),
    P_("cx","Criou campos personalizados", cx.length>0, "Parametrização", cx.length,
       cx.map(c=>(c.titulo||'-')+' · {{cliente.'+(c.chave||'')+'}} · '+(c.tipo||'texto'))),
    P_("ent","Personalizou a entidade", !!String(set.entidade||"").trim(), "Parametrização",
       set.entidade?1:0, [String(set.entidade||'(por preencher)')]),
    P_("tar","Agendou tarefas próprias", pTar.length>0, "Parametrização", pTar.length,
       pTar.map(t=>(t.titulo||'(sem título)')+' · '+(t.data?dPT(t.data):'-')+' · '+(t.estado||'-'))),
  ];
  return {lista:L, feitas:L.filter(x=>x.feito).length, total:L.length,
    numeros:{
      empresas:pEmp.length, contactos:pCli.length, produtos:pProd.length, propostas:pProp.length,
      modelos:pMod.length, templates:pTpl.length, campanhas:pCamp.length, automacoes:pAuto.length,
      casos:pCasos.length, retencoes:pRet.length, consentimentos:pCons.length, pedidos:pPed.length,
      tarefas:pTar.length, campos:cx.length,
      totalCriado:pEmp.length+pCli.length+pProd.length+pProp.length+pMod.length+pTpl.length+
                  pCamp.length+pAuto.length+pCasos.length+pRet.length+pCons.length+pPed.length+pTar.length+cx.length
    }};
}
/* módulos com pelo menos uma prática cumprida */
function modulosCobertos(pr){
  const m={}; pr.lista.forEach(x=>{ if(x.feito) m[x.mod]=true; });
  return Object.keys(m);
}
/* Barra de cobertura reutilizada nas duas vistas */
function barraCob(feitas,total){
  const p=total?Math.round(feitas/total*100):0;
  const cor=p>=75?"var(--g600)":p>=45?"#d97706":"var(--danger)";
  return `<div title="${feitas} de ${total} práticas" style="min-width:120px">
    <div style="height:8px;border-radius:99px;background:var(--surface3);overflow:hidden"><div style="height:100%;width:${p}%;background:${cor}"></div></div>
    <div class="muted" style="font-size:.7rem;margin-top:3px">${p}% · ${feitas}/${total}</div></div>`;
}

/* ---------- A TAÇA DO PERCURSO ----------
   O nível nunca desce e ninguém é prejudicado por fazer menos: o piso é
   o mesmo para todos. O que se organiza é o fazer MAIS, em patamares
   que se desbloqueiam por ÁREAS cobertas (8), nunca por práticas (30)
   nem por cliques - Marketing tem 7 práticas e Catálogo 2, e contar
   práticas ensinava a ir por onde rende mais. As práticas ficam por
   baixo, como o detalhe de cada área e a barra até ao próximo patamar.
   Ninguém chega aos 100% numa turma de duas semanas: por isso há seis
   degraus antes do último, e o penúltimo ("Quase lá") é o teto real. */
const PATAMARES=[
  {min:0, nome:'Ponto de partida',  frase:'A taça está vazia, mas é tua. Cada área do CRM que experimentares acende-a um pouco.'},
  {min:1, nome:'Primeiro passo',    frase:'Já mexeste numa área. As outras sete estão à espera.'},
  {min:2, nome:'A ganhar ritmo',    frase:'Duas ou três áreas cobertas. O CRM começa a ser teu.'},
  {min:4, nome:'Meio percurso',     frase:'Metade do mapa é teu. Daqui para a frente é curiosidade.'},
  {min:6, nome:'Quase lá',          frase:'Seis ou sete áreas. Poucos chegam aqui numa turma.'},
  {min:8, nome:'Percurso completo', frase:'As oito áreas. Não ficou nada por experimentar.'},
];
const AREAS_ORDEM=['Contas','Catálogo','Vendas','Modelos','Marketing','Serviço','RGPD','Parametrização'];
/* para onde leva cada área, quando falta */
const AREA_ROTA={Contas:'empresas',Catálogo:'produtos',Vendas:'propostas',Modelos:'modelos',Marketing:'campanhas',Serviço:'helpdesk',RGPD:'rgpd',Parametrização:'definicoes'};

/* o estado inteiro do mapa, calculado do trabalho local */
function mapaPratica(p){
  const pr=praticasEntrega(p||state);
  const areas=AREAS_ORDEM.map(a=>{ const L=pr.lista.filter(x=>x.mod===a);
    return {a, feitas:L.filter(x=>x.feito).length, total:L.length, coberta:L.some(x=>x.feito), faltam:L.filter(x=>!x.feito)}; });
  const cobertas=areas.filter(x=>x.coberta).length;
  let i=0; PATAMARES.forEach((pt,k)=>{ if(cobertas>=pt.min) i=k; });
  const atual=PATAMARES[i], prox=PATAMARES[i+1]||null;
  return {areas, cobertas, praticas:pr.feitas, total:pr.total, i, atual, prox,
    resumo:{patamar:atual.nome, nivel:i, areas:cobertas, praticas:pr.feitas, total:pr.total, em:todayISO()}};
}

/* o botão do rodapé: a taça, o patamar, e a barra até ao próximo */
function tacaHTML(){
  if(!canFeat('taca')) return '';
  const m=mapaPratica();
  const pct=Math.round(m.cobertas/8*100);
  return `<button class="taca" data-act="taca" title="A tua taça do percurso">
    <span class="taca-ic">${ic('taca',18)}</span>
    <span class="taca-txt"><strong>${esc(m.atual.nome)}</strong><span>${m.cobertas} de 8 áreas · ${m.praticas}/${m.total} práticas</span>
    <span class="taca-bar"><i style="width:${pct}%"></i></span></span></button>`;
}

/* o painel: os patamares como uma escada, e as áreas com o que falta
   escrito como convite, com um atalho para o sítio certo */
function openTaca(){
  const m=mapaPratica();
  editing={type:'__taca'};
  $('#modalTitle').textContent='A tua taça do percurso';
  $('#modalSub').textContent=m.atual.nome+' · '+m.cobertas+' de 8 áreas';
  $('#modal').classList.add('wide'); $('#modalDelete').style.display='none';
  { const sv=$('[data-act="modal-save"]'); if(sv){ sv.style.display=''; sv.disabled=false; sv.textContent='Fechar'; } }
  const escada=PATAMARES.map((pt,k)=>{ const on=k<=m.i, agora=k===m.i;
    return `<div class="taca-deg ${on?'on':''} ${agora?'agora':''}"><span class="taca-deg-ic">${ic(on?'check':'lock',13)}</span>
      <span class="taca-deg-n">${esc(pt.nome)}</span><span class="muted" style="font-size:.72rem">${pt.min===0?'início':pt.min+(pt.min===8?' áreas':'+ áreas')}</span></div>`; }).join('');
  const proximo = m.prox ? `<div class="callout info" style="margin:12px 0">${ic('taca',16)}<div class="ctxt"><strong>Próximo patamar: ${esc(m.prox.nome)}</strong> - ${(m.prox.min-m.cobertas)===1?'falta 1 área':'faltam '+(m.prox.min-m.cobertas)+' áreas'}. ${esc(m.atual.frase)}</div></div>`
                          : `<div class="callout green" style="margin:12px 0">${ic('check',16)}<div class="ctxt"><strong>${esc(m.atual.frase)}</strong></div></div>`;
  /* as áreas por visitar primeiro: quem tem menos feito aparece em cima */
  const areas=m.areas.slice().sort((a,b)=>(a.coberta-b.coberta)||(a.feitas/a.total-b.feitas/b.total)).map(a=>{
    const pct=Math.round(a.feitas/a.total*100);
    const faltam=a.faltam.slice(0,3).map(x=>`<li>${esc(x.l)}</li>`).join('');
    return `<details class="taca-area ${a.coberta?'ok':''}"><summary><span class="taca-area-ic">${ic(a.coberta?'check':'circle',14)}</span>
      <strong>${esc(a.a)}</strong><span class="muted">${a.feitas}/${a.total}</span><span class="taca-mini"><i style="width:${pct}%"></i></span>
      <a class="btn-ghost btn-xs" href="#${AREA_ROTA[a.a]}" data-act="close-modal-go">Ir ${ic('chevR',12)}</a></summary>
      ${faltam?`<div class="muted" style="font-size:.78rem;margin:6px 0 2px">Ainda por experimentar:</div><ul class="taca-faltam">${faltam}</ul>`:'<div class="muted" style="font-size:.78rem;margin:6px 0">Tudo feito nesta área.</div>'}
    </details>`; }).join('');
  $('#modalForm').innerHTML=`<div class="taca-topo"><div class="taca-grande">${ic('taca',44)}</div><div><div class="taca-nome">${esc(m.atual.nome)}</div>
      <div class="muted">${m.cobertas} de 8 áreas · ${m.praticas} de ${m.total} práticas</div></div></div>
    ${proximo}
    <div class="grid cols-2" style="gap:16px;align-items:start"><div><h4 class="taca-h4">Os patamares</h4><div class="taca-escada">${escada}</div>
      <p class="muted" style="font-size:.76rem;margin-top:8px">O nível nunca desce. Conta só o que fizeste no CRM - não a presença, nem a nota.</p></div>
    <div><h4 class="taca-h4">As oito áreas</h4>${areas}</div></div>`;
  $('#modalBack').classList.add('open');
}

/* Ficha detalhada de UMA entrega: o que criou, por módulo, e que práticas demonstrou */
/* Uma prática: se houver itens, o rótulo abre uma gaveta com os nomes.
   "Criou empresas" sem dizer quantas nem quais não serve para avaliar. */
const MAX_ITENS=25;
function praticaHTML(x){
  const cor = x.feito ? "var(--g600)" : "var(--muted)";
  const marca = x.feito ? ic("check",14) : "-";
  const cont = x.n ? `<span class="pill ${x.feito?"green":"grey"}" style="font-size:.62rem;flex:0 0 auto">${x.n}</span>` : "";
  const rot = `<span style="${x.feito?"":"color:var(--muted)"};flex:1">${esc(x.l)}</span>${cont}`;
  const cab = `<span style="color:${cor};flex:0 0 auto;line-height:1">${marca}</span>`;
  if(!x.itens.length){
    return `<div style="display:flex;gap:8px;align-items:center;padding:3px 0;font-size:.83rem">${cab}${rot}</div>`;
  }
  const mostra=x.itens.slice(0,MAX_ITENS);
  const resto=x.itens.length-mostra.length;
  return `<details style="padding:2px 0">
    <summary style="display:flex;gap:8px;align-items:center;font-size:.83rem;cursor:pointer;list-style:none">${cab}${rot}
      <span class="muted" style="flex:0 0 auto;font-size:.7rem">ver</span></summary>
    <div style="margin:4px 0 6px 22px;padding-left:10px;border-left:2px solid var(--border)">
      ${mostra.map(i=>`<div class="muted" style="font-size:.78rem;padding:1px 0">${esc(i)}</div>`).join("")}
      ${resto>0?`<div class="muted" style="font-size:.74rem;padding-top:2px">… e mais ${resto}</div>`:""}
    </div></details>`;
}

/* Carrega o payload de cada entrega. São pedidos separados (um por entrega),
   por isso mostra-se o progresso - numa turma de 13 são 13 pedidos. */
async function carregarComparacao(force){
  const box=()=>$("#compBox");
  if(compCache&&!force){ desenharComparacao(compCache); return; }
  try{
    const list=await supaListarSubmissoes();
    /* uma linha por FORMANDO: a entrega mais recente é a que conta */
    const ultima={};
    (list||[]).forEach(sb=>{ const k=String(sb.username||"").toLowerCase();
      if(!ultima[k]||String(sb.criado_em)>String(ultima[k].criado_em)) ultima[k]=sb; });
    const alvos=Object.values(ultima);
    if(!alvos.length){ box().innerHTML=empty("Ainda não há entregas","Assim que os formandos submeterem, a comparação aparece aqui."); return; }
    const linhas=[];
    for(let i=0;i<alvos.length;i++){
      const sb=alvos[i];
      if(box()) box().innerHTML=`<span class="muted">A ler entregas… ${i+1} de ${alvos.length}</span>`;
      try{
        const pay=await supaObterSubmissao(sb.id);
        const pr=praticasEntrega(pay);
        linhas.push({id:sb.id,nome:sb.nome||sb.username,username:sb.username,quando:sb.criado_em,
                     entregas:(list||[]).filter(x=>String(x.username||"").toLowerCase()===String(sb.username||"").toLowerCase()).length,
                     pr,areas:modulosCobertos(pr).length});
      }catch(e){ linhas.push({id:sb.id,nome:sb.nome||sb.username,username:sb.username,quando:sb.criado_em,erro:supaMsg(e)}); }
    }
    compCache=linhas; desenharComparacao(linhas);
  }catch(e){ if(box()) box().innerHTML=`<div class="callout warn" style="margin:0">${ic("alert",16)}<div class="ctxt">${esc(supaMsg(e))}</div></div>`; }
}
let compOrd="cobertura";
function desenharComparacao(linhas){
  const box=$("#compBox"); if(!box) return;
  const val=(l,k)=>{ if(l.erro) return -1;
    if(k==="cobertura") return l.pr.feitas;
    if(k==="areas") return l.areas;
    if(k==="criado") return l.pr.numeros.totalCriado;
    return l.pr.numeros[k]||0; };
  const ord=[...linhas].sort((a,b)=>val(b,compOrd)-val(a,compOrd)||String(a.nome).localeCompare(String(b.nome),"pt"));
  const cols=[["cobertura","Cobertura"],["areas","Áreas"],["criado","Criados"],["propostas","Prop."],["modelos","Mod."],
              ["automacoes","Autom."],["campanhas","Camp."],["casos","Casos"],["consentimentos","Consent."],["campos","Campos"]];
  const med=k=>{ const v=linhas.filter(l=>!l.erro).map(l=>val(l,k)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:0; };
  box.innerHTML=`
  <div class="callout info" style="margin:0 0 12px">${ic("info",16)}<div class="ctxt">Cada linha é a <strong>entrega mais recente</strong> de cada formando. Clica num cabeçalho para ordenar; clica no <strong>nome</strong> para abrir a ficha completa.</div></div>
  <div class="table-wrap"><table><thead><tr><th>Formando</th>
    ${cols.map(c=>`<th data-act="comp-ord" data-k="${c[0]}" style="cursor:pointer;white-space:nowrap" title="Ordenar">${c[1]}${compOrd===c[0]?" ▾":""}</th>`).join("")}</tr></thead><tbody>
    ${ord.map(l=>l.erro?`<tr><td>${esc(l.nome)}</td><td colspan="${cols.length}" class="muted">${esc(l.erro)}</td></tr>`:`<tr>
      <td data-act="comp-abrir" data-id="${l.id}" data-nome="${esc(l.nome)}" style="cursor:pointer">
        <div class="cell-main" style="color:var(--g700);text-decoration:underline;text-underline-offset:2px">${esc(l.nome)}</div>
        <div class="cell-sub">${esc(l.username)} · ${esc(dtPT(l.quando))}${l.entregas>1?" · "+l.entregas+" entregas":""}</div></td>
      <td>${barraCob(l.pr.feitas,l.pr.total)}</td>
      <td><strong>${l.areas}</strong>/8</td>
      <td><strong>${l.pr.numeros.totalCriado}</strong></td>
      ${cols.slice(3).map(c=>`<td>${l.pr.numeros[c[0]]||0}</td>`).join("")}
    </tr>`).join("")}
  </tbody><tfoot><tr><td class="muted"><strong>Média da turma</strong></td>
    <td class="muted">${med("cobertura")} práticas</td><td class="muted">${med("areas")}</td><td class="muted">${med("criado")}</td>
    ${cols.slice(3).map(c=>`<td class="muted">${med(c[0])}</td>`).join("")}</tr></tfoot></table></div>
  <div class="toolbar" style="margin-top:12px">
    <button class="btn-sec btn-sm" type="button" data-act="comp-csv">${ic("download",15)} Exportar CSV</button>
    <button class="btn-sec btn-sm" type="button" data-act="comp-recarregar">${ic("rotate",15)} Recarregar</button>
  </div>
  <span class="hint" style="display:block;margin-top:8px">A <strong>cobertura</strong> é a percentagem de práticas esperadas demonstradas no trabalho - não é uma nota. Serve para ver <em>onde</em> cada pessoa está, e o que ficou por tocar.</span>`;
}
function comparacaoCSV(){
  if(!compCache) return;
  const cab=["Formando","Utilizador","Entrega","Entregas","Praticas","Total praticas","Cobertura %","Areas","Criados",
             "Empresas","Contactos","Produtos","Propostas","Modelos","Templates","Campanhas","Automacoes","Casos","Retencoes","Consentimentos","Pedidos","Tarefas","Campos"];
  const linhas=compCache.filter(l=>!l.erro).map(l=>{ const n=l.pr.numeros; return [
    l.nome,l.username,dtPT(l.quando),l.entregas,l.pr.feitas,l.pr.total,Math.round(l.pr.feitas/l.pr.total*100),l.areas,n.totalCriado,
    n.empresas,n.contactos,n.produtos,n.propostas,n.modelos,n.templates,n.campanhas,n.automacoes,n.casos,n.retencoes,n.consentimentos,n.pedidos,n.tarefas,n.campos];});
  const esc2=v=>{ const t=String(v==null?"":v); return /[";\n]/.test(t)?('"'+t.replace(/"/g,'""')+'"'):t; };
  const csv=[cab.join(";")].concat(linhas.map(r=>r.map(esc2).join(";"))).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="comparacao-turma-"+todayISO()+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("CSV exportado",compCache.length+" formando(s)");
}

// Gera o PDF de uma proposta DA ENTREGA (troca o state temporariamente). O HTML

function printEntregaProp(propId){
  if(!revisaoPayload||!propId) return;
  const bak=state;
  // Usa os modelos DA ENTREGA (os que o formando criou). Se a entrega não
  // trouxer modelos, cai nos do formador para gerar na mesma.
  const tpls=(revisaoPayload.propostaTemplates&&revisaoPayload.propostaTemplates.length)?revisaoPayload.propostaTemplates:bak.propostaTemplates;
  try{ state=Object.assign({}, revisaoPayload, {propostaTemplates:tpls}); printProposal(propId); }
  catch(e){ toast('Não foi possível gerar o PDF',String(e&&e.message||e),'err'); }
  finally{ state=bak; }
}

let importDraft=null;
function importTurmaCSV(file){
  const r=new FileReader();
  r.onload=e=>{
    let rows; try{ rows=parseCSV(e.target.result); }catch(err){ toast('Erro no ficheiro','Verifique o formato','err'); return; }
    if(!rows||rows.length<2){ toast('Ficheiro vazio','Use o modelo e preencha pelo menos uma linha','warn'); return; }
    const head=rows[0].map(h=>h.trim().toLowerCase()); const idx=n=>head.indexOf(n);
    const c={nome:idx('nome'),apelido:idx('apelido'),email:idx('email'),email2:idx('email_pessoal'),username:idx('username'),password:idx('password'),papel:idx('papel')};
    if(c.nome<0||c.apelido<0||c.email<0){ toast('Cabeçalho inválido','Precisa das colunas nome, apelido e email (use o Modelo)','err'); return; }
    toast('A validar…','','');
    supaRoster().then(roster=>{
      const existing=new Set((roster||[]).map(u=>(u.username||'').toLowerCase()));
      const seen=new Set();
      importDraft=rows.slice(1).filter(cols=>cols.some(v=>(v||'').trim())).map((cols,i)=>{
        const g=k=>c[k]>=0?(cols[c[k]]||'').trim():'';
        const nome=g('nome'), apelido=g('apelido'), email=g('email'), email2=g('email2');
        let username=g('username'); let password=g('password'); let papel=g('papel')||'Formando';
        if(papel!=='Formador'&&papel!=='Formando') papel='Formando';
        if(username.charAt(0)==='=') username='';   // fórmula por avaliar (não aberto no Excel)
        if(password.charAt(0)==='=') password='';
        const autoUser=!username;
        if(autoUser) username=userFromName(nome,apelido);   // 1.ª letra do nome + apelido (dvale)
        username=username.toLowerCase();
        // se o utilizador foi gerado pela regra e já existe, desambigua (jferreira → jferreira2) em vez de rejeitar a linha
        if(autoUser && username){ const base=username; let k=2; while(seen.has(username)||existing.has(username)){ username=base+k; k++; } }
        if(!password) password=genFormandoPwd(email,nome,apelido,username);   // mesma regra do resto da app
        const errs=[];
        if(!nome) errs.push('nome');
        if(!apelido) errs.push('apelido');
        if(!email) errs.push('email em falta'); else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errs.push('email inválido');
        if(username){ if(seen.has(username)) errs.push('repetido no ficheiro'); else seen.add(username); if(existing.has(username)) errs.push('já existe na turma'); }
        return {i:i+2, nome, apelido, email, email2, username, password, papel, errs};
      });
      openImportPreview();
    }).catch(err=>{ toast('Não foi possível validar',supaMsg(err),'err'); });
  };
  r.readAsText(file);
}

function confirmImport(){
  const valid=(importDraft||[]).filter(r=>!r.errs.length); if(!valid.length){ closeModal(); return; }
  const sv=$('[data-act="modal-save"]'); if(sv){ sv.disabled=true; sv.textContent='A importar…'; }

    for(const r of valid){ try{ await supaAddFormando({username:r.username,password:r.password,nome:r.nome,apelido:r.apelido,email:r.email,email2:r.email2,papel:r.papel}); ok++;

/* Consumo do EmailJS.
   O endpoint /history do EmailJS exige a chave PRIVADA - que nao pode andar neste
   ficheiro, porque o site e publico. Por isso passa por uma Edge Function que a
   guarda como segredo, tal como o nif-lookup. */
let emailUso=null;
async function carregarUsoEmail(){
  const r=await fetch(SUPA_URL+"/functions/v1/emailjs-uso",{method:"POST",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({diaCiclo:Number(state.settings.emailDiaCiclo)||1})});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function renderUsoEmail(){
  const box=$("#emailUsoBox"); if(!box) return;
  box.innerHTML="<span class=\"muted\" style=\"font-size:.82rem\">A consultar o EmailJS…</span>";
  carregarUsoEmail().then(d=>{
    emailUso=d;
    const teto=Number(state.settings.emailPlano)||200;
    const n=Number(d.mes)||0; const pc=Math.min(100,Math.round(n/teto*100));
    const cor=pc>=90?"var(--danger)":pc>=70?"#d97706":"var(--g600)";
    const hist=(d.recentes||[]).slice(0,12);
    box.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <strong style="font-size:1.5rem;color:${cor}">${n}</strong><span class="muted" style="margin-left:6px">de ${teto} neste ciclo</span>
        ${d.falhas?`<span class="pill red">${d.falhas} falha(s)</span>`:""}

        <button class="btn-sec btn-xs" data-act="uso-email">Atualizar</button>
      </div>
      <div style="height:8px;border-radius:99px;background:var(--surface3);margin:10px 0 4px;overflow:hidden"><div style="height:100%;width:${pc}%;background:${cor}"></div></div>
      <div class="muted" style="font-size:.76rem">Restam ${Math.max(0,teto-n)} envios${d.repoeEm?" · repõe a "+dPT(d.repoeEm):""}. ${custoConvitesTexto()}</div>
      ${hist.length?`<div class="table-wrap" style="margin-top:12px;max-height:240px;overflow:auto"><table><thead><tr><th>Quando</th><th>Estado</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td class="muted" style="white-space:nowrap">${esc(h.quando||"-")}</td><td><span class="pill ${h.ok?"green":"red"}">${h.ok?"Enviado":"Falhou"}</span></td></tr>`).join("")}
      </tbody></table></div><span class="hint" style="display:block;margin-top:6px">O EmailJS não devolve o destinatário no histórico - para ver a quem foi, use o painel do EmailJS.</span>`:""}`;
  }).catch(e=>{
    box.innerHTML=`<div class="callout warn" style="margin:0">${ic("alert",16)}<div class="ctxt">Não consegui ler o consumo do EmailJS (${esc(String(e.message||e))}). Confirme que a função <code>emailjs-uso</code> está publicada e que o segredo <code>EMAILJS_PRIVATE_KEY</code> está definido.</div></div>`;
  });
}

const opt = (arr,val)=>arr.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?'selected':''}>${esc(o.t)}</option>`).join('');
const refClientes = ()=>state.clientes.map(c=>({v:c.id,t:`${c.numero} · ${c.nome} ${c.apelido}`}));
// Função da pessoa na empresa (a quem recorrer em cada tema) - modelo Account/Contact.
// FUNCOES = lista PADRÃO; a lista ativa é editável em Definições (state.settings.funcoes).
const FUNCOES=['','Dono / Sócio-gerente','Administração','Financeiro / Contabilidade','Comercial / Vendas','Compras','Marketing','Técnico / Operações','Recursos Humanos','Rececionista / Geral','Outro'];
/* Segmentos = dimensao da empresa. Editaveis em Definicoes, tal como as origens.
   NAO confundir com os niveis de fidelizacao (Bronze/Prata/Ouro), que sao outra coisa
   e tem a sua propria lista - antes partilhavam o mesmo campo e baralhavam-se. */
const SEGMENTOS_DEF=['Micro','PME','Grande Empresa'];
function segmentosList(){ const f=state.settings&&state.settings.segmentos; return (Array.isArray(f)&&f.length)?f:SEGMENTOS_DEF.slice(); }
function niveisList(){ return (state.loyalty||[]).filter(l=>l.estado!=='Inativo').map(l=>l.nome); }
function funcoesList(){ const f=state.settings&&state.settings.funcoes; return (Array.isArray(f)&&f.length)?f:FUNCOES.filter(Boolean); }
// Ciclo de vida do contacto (gestão de leads): Lead → MQL (interesse) → SQL (oportunidade) → Cliente
const FASES=['Lead','MQL','SQL','Cliente','Perdido'];
const faseColor=f=>({Lead:'grey',MQL:'blue',SQL:'amber',Cliente:'green',Perdido:'red'}[f]||'grey');
/* ---------- CAMPOS PERSONALIZADOS DO CONTACTO ----------
   Sao definidos uma vez e valem para TODOS os contactos: e isso que permite
   usa-los como tag {{cliente.<chave>}} nos modelos de proposta e de email.
   O valor de cada contacto fica em c.extra[chave]. */

function cxField(c){

   Fontes partilhadas: sempre ordenadas; a 1.ª entrada é a opção "nenhum". */
const COMBO_SRC = {
  empresas: ()=>[{v:'',t:'- sem empresa (particular) -',none:1}].concat(
    (state.empresas||[]).slice().sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt'))
      .map(e=>({v:e.id,t:`${e.nome}${e.nipc?' · '+e.nipc:''}`}))),
  /* o contacto da proposta so pode ser de quem trabalha na empresa escolhida:
     enquanto nao houver empresa mostra todos (permite comecar pelo contacto) */
  clientesDaEmpresa: ()=>{
    const emp=(typeof propDraft!=='undefined'&&propDraft)?propDraft.empresaId:'';
    const sel=(typeof propDraft!=='undefined'&&propDraft)?propDraft.clienteId:'';
    const lista=(state.clientes||[]).filter(c=>!emp||c.empresaId===emp||c.id===sel);
    return [{v:'',t:'- nenhum -',none:1}].concat(
      lista.slice().sort((a,b)=>(`${a.nome||''} ${a.apelido||''}`).localeCompare(`${b.nome||''} ${b.apelido||''}`,'pt'))
        .map(c=>({v:c.id,t:`${c.nome||''} ${c.apelido||''}${c.empresa?' · '+c.empresa:''}`.trim()})));
  },
  clientes: ()=>[{v:'',t:'- nenhum -',none:1}].concat(
    (state.clientes||[]).slice().sort((a,b)=>(`${a.nome||''} ${a.apelido||''}`).localeCompare(`${b.nome||''} ${b.apelido||''}`,'pt'))
      .map(c=>({v:c.id,t:`${c.nome||''} ${c.apelido||''}${c.empresa?' · '+c.empresa:''}`.trim()}))),
};
function comboNorm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function comboOptsFor(wrap){ const src=wrap&&wrap.dataset.comboSrc; const fn=src&&COMBO_SRC[src]; return fn?fn():[]; }
function comboLabel(src,v){ const all=(COMBO_SRC[src]?COMBO_SRC[src]():[]); const o=all.find(x=>String(x.v)===String(v||'')); return o?(o.none?'':o.t):''; }
function comboRender(input){
  const wrap=input.closest('.combo'); if(!wrap) return;
  const menu=wrap.querySelector('[data-combo-menu]'); if(!menu) return;
  const all=comboOptsFor(wrap); const q=comboNorm(input.value.trim());
  const none=all.find(o=>o.none); const rest=all.filter(o=>!o.none);
  const matched=q?rest.filter(o=>comboNorm(o.t).includes(q)):rest;
  const CAP=12, shown=matched.slice(0,CAP);
  const oHTML=o=>`<button type="button" class="combo-opt" data-combo-opt data-val="${esc(o.v)}"${o.none?' data-none="1"':''}>${esc(o.t)}</button>`;
  let html=(none?oHTML(none):'')+shown.map(oHTML).join('');
  if(matched.length>shown.length) html+=`<div class="combo-more">+${matched.length-shown.length} - escreva mais para refinar</div>`;
  if(q&&!matched.length) html+=`<div class="combo-empty">Sem resultados para "${esc(input.value.trim())}"</div>`;
  menu.innerHTML=html; menu.hidden=false; input.setAttribute('aria-expanded','true');
}
function comboPick(optEl){
  const wrap=optEl.closest('.combo'); if(!wrap) return;
  const hid=wrap.querySelector('input[type="hidden"]');
  hid.value=optEl.dataset.val||'';
  wrap.querySelector('[data-combo-input]').value=optEl.dataset.none?'':optEl.textContent;
  comboClose(wrap);
  hid.dispatchEvent(new Event('change',{bubbles:true}));  // formularios que reagem (ex.: totais da proposta)
}
// markup interno do combo (input escondido + pesquisa + menu) - reutilizavel fora do SCHEMAS
function comboInner(name, src, value, placeholder){
  return `<input type="hidden" name="${name}" value="${esc(value||'')}">
    <input type="text" class="combo-input" data-combo-input value="${esc(comboLabel(src,value))}" placeholder="${esc(placeholder||'Escreva para procurar…')}" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
    <div class="combo-menu" data-combo-menu hidden></div>`;
}

function fieldHTML(f,item){

    let opts=typeof f.opts==='function'?f.opts():f.opts;
    // se o valor gravado já não está na lista (ex.: responsável que saiu da turma), mantém-no
    // como opção - senão o select mostrava outro nome e a gravação trocava o responsável em silêncio

      const lbl=(typeof f.labelFor==='function' ? f.labelFor(v) : '') || String(v);

  if(f.type==='avatar'){ const ini=initialsOf(item); return `<div class="${cls}"><label>${esc(f.l)}</label><div style="display:flex;align-items:center;gap:14px"><div id="avPreview" class="avatar" style="width:58px;height:58px;padding:0;overflow:hidden;font-size:1.15rem">${v?`<img src="${esc(v)}" style="width:100%;height:100%;object-fit:cover">`:esc(ini)}</div><label class="btn-sec btn-sm" style="cursor:pointer">${ic('image',15)} Carregar foto<input type="file" accept="image/*" data-avatar style="display:none"></label><input type="hidden" name="avatar" value="${esc(v)}"><button type="button" class="btn-ghost btn-sm" data-act="av-clear" ${v?'':'style="display:none"'}>Remover</button></div><span class="hint">Imagem quadrada recomendada. ${TURMA?'Fica guardada na sua conta, no servidor, e volta sempre que iniciar sessão - também noutro computador. É apagada com a conta.':'Fica guardada no perfil do utilizador.'}</span></div>`; }

    const selHTML=(opts,val)=>opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');

  }
  if(f.type==='check'){ return `<div class="${cls}"><label style="cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" name="${f.n}" ${v?'checked':''} style="width:15px;height:15px;accent-color:var(--g600)">${esc(f.l)}</label>${hint}</div>`; }
  const t=f.type||'text';

function saveProfile(){
  const u=currentUser(); if(!u){ closeModal(); return; }
  const fd=new FormData($('#modalForm'));
  const nome=String(fd.get('nome')||'').trim();
  if(!nome){ toast('Nome obrigatório','','warn'); return; }
  u.nome=nome; u.apelido=String(fd.get('apelido')||'').trim();
  u.email=String(fd.get('email')||'').trim(); u.telefone=String(fd.get('telefone')||'').trim();
  u.cargo=String(fd.get('cargo')||'').trim(); u.avatar=fd.get('avatar')||'';
  /* a assinatura tem de ser lida ANTES do envio, senao ia por gravar no servidor */
  const ed=$('#sigEditor'); if(ed) u.assinatura=ed.innerHTML;
  const ff=$('#modalForm [data-sigfont]'); if(ff) u.assinaturaFont=ff.value;
  const fz=$('#modalForm [data-sigsize]'); if(fz) u.assinaturaSize=fz.value;
  // numa turma o perfil é do Supabase → gravar no servidor E na sessão em cache,
  // senão ingestSupaUser() revertia-o no próximo arranque
  if(TURMA && supaToken()){
    supaAtualizarPerfil(u).then(()=>perfilCache(u))
      .catch(e=>toast('Perfil por gravar no servidor',supaMsg(e),'err'));
  }
  const pw=String(fd.get('password')||'');
  if(pw){
    if(TURMA && supaToken()){
      const atual=String(fd.get('pwatual')||'');
      if(!atual){ toast('Falta a palavra-passe atual','Para mudar, escreva primeiro a palavra-passe atual','warn'); return; }
      supaMudarMinhaPwd(atual,pw).then(()=>toast('Palavra-passe alterada','Use a nova no próximo início de sessão')).catch(e=>toast('Não foi possível mudar a palavra-passe',supaMsg(e),'err'));
    } else { u.password=hashPwd(pw); }
  }
  save(); closeModal(); render(); toast('Perfil atualizado',`As suas alterações foram guardadas`);
}

function savePropModal(closeAfter){

  if(!propDraft.empresaId && propDraft.clienteId){ const cc=getC(propDraft.clienteId); if(cc&&cc.empresaId) propDraft.empresaId=cc.empresaId; }
  // a venda é SEMPRE a uma empresa (ENI incluído): sem empresa, não se guarda
  if(!propDraft.empresaId){ toast('Falta a empresa','A venda é sempre a uma empresa. Escolha a empresa (para clientes em nome individual, crie a empresa a partir do contacto).','warn'); return; }
  if(!propDraft.titulo.trim()){ toast('Falta o título','Indique um título para a proposta','warn'); return; }
  if(!(propDraft.linhas||[]).some(l=>l.produtoId)){ toast('Sem artigos','Adicione pelo menos um artigo do catálogo','warn'); return; }
  /* o estado é uma decisão, não um valor por omissão: obriga a dizer em que ponto está */
  if(!propDraft.estado){
    toast('Falta o estado','Indique em que ponto está a proposta - o campo está no fim do formulário','warn');
    const sel=$('#modalForm [name="estado"]');
    if(sel){ sel.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>sel.focus(),300); }
    return;
  }
  /* mesmo princípio dos outros formulários: "Outro" tem de dizer qual */
  const semQual=(mv,nota,campo,lbl)=>{ if(mv!=='Outro'||String(nota||'').trim()) return false;
    toast('Diga qual', lbl+': escolheu "Outro" - escreva-o na caixa por baixo.','warn');
    const el=$('#modalForm [name="'+campo+'"]'); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>el.focus(),300); } return true; };
  if(semQual(propDraft.motivoPerda,propDraft.motivoPerdaNota,'motivoPerdaNota','Motivo da perda')) return;
  if(semQual(propDraft.motivoGanho,propDraft.motivoGanhoNota,'motivoGanhoNota','Motivo do ganho')) return;
  const i=state.propostas.findIndex(x=>x.id===propDraft.id);
  const oldEstado=i>=0?state.propostas[i].estado:null;
  /* proposta NOVA que ja nasce ganha: confirmar, porque as consequências
     saem do CRM (podem enviar email ao cliente) */
  if(i<0 && propDraft.estado==='Ganha' && !propDraft._confirmadaGanha){
    const acc=propAccObj(propDraft);
    const efeitos=[];
    if(acc && (acc.fase||'Lead')!=='Cliente') efeitos.push('a conta '+(acc.nome||'')+' passa a Cliente');
    { const arts=(propDraft.linhas||[]).filter(l=>{ const pr=(state.produtos||[]).find(x=>x.id===l.produtoId); return pr&&pr.controlaStock; });
      if(arts.length) efeitos.push('o stock de '+arts.length+' artigo(s) é abatido'); }
    { const n=(state.automacoes||[]).filter(a=>a.estado==='Ativa'&&a.trigger==='proposta-ganha').length;
      if(n) efeitos.push(n+' automação(ões) de "proposta ganha" disparam - podem enviar email'); }
    efeitos.push('o valor entra na receita e no nível de fidelização');
    propDraft._confirmadaGanha=true;
    uiConfirm('Ao guardar já como Ganha: '+efeitos.join('; ')+'.',
      {title:'Registar a proposta já como ganha?',okText:'Registar como ganha'}).then(o=>{
        if(o) savePropModal(closeAfter); else propDraft._confirmadaGanha=false;
      });
    return;
  }
  const uid2=currentUser()?currentUser().id:null;
  delete propDraft._confirmadaGanha;
  propDraft.alteradoPor=uid2; propDraft.alteradoEm=todayISO();
  const isNew=i<0;
  if(isNew){ propDraft.criadoPor=uid2; propDraft.criadoEm=todayISO(); if(!propDraft.fonte) propDraft.fonte='manual'; }
  // ciclo de aprovação (10865): se o estado-alvo excede a regra e não está aprovada, retém em "Criada" e pede aprovação ao gestor
  let enviadaAprovacao=false;
  if(APROV_ALVOS.includes(propDraft.estado) && propBloqueada(propDraft)){
    propDraft.aprovacao={estado:'pendente', alvo:propDraft.estado, pedidaPor:uid2, pedidaEm:todayISO(), motivo:aprovMotivo(propDraft)};
    propDraft.estado='Criada'; enviadaAprovacao=true;
  }
  // grava uma CÓPIA no estado; propDraft continua a ser o rascunho editável (guardar não fecha)
  const stored=clone(propDraft); stored.linhas=(stored.linhas||[]).filter(l=>l.produtoId);
  if(i>=0) state.propostas[i]=stored; else state.propostas.push(stored);
  recalcLoyalty(); save();
  if(enviadaAprovacao) toast('Enviada para aprovação', stored.numero+' aguarda decisão do gestor','warn');
  else toast(isNew?'Proposta criada':'Proposta guardada', stored.numero);
  { const acc=propAccObj(stored); if(acc) advanceFase(acc, stored.estado==='Ganha'?'Cliente':'SQL'); save(); }   // proposta ⇒ a CONTA avança p/ SQL (ganha ⇒ Cliente)
  if(isNew) fireAutomations('proposta-criada',{clienteId:stored.clienteId,proposta:stored});
  onPropStatusChange(stored, oldEstado, stored.estado);
  maybeLeadQuente(stored.clienteId);   // proposta pode ter subido o score → gatilho comportamental
  if(closeAfter){ closeModal(); render(); }
  else { render(); renderPropForm(); const cx=$('.modal-foot [data-act="close-modal"]'); if(cx) cx.textContent='Fechar'; }   // guardado: janela fica aberta e "Cancelar" passa a "Fechar"
}
function onPropStatusChange(p, oldS, newS){
  if(!newS||newS===oldS) return;
  applyStockForProp(p, oldS, newS);   // abate/repõe stock dos artigos
  { const acc=propAccObj(p); if(acc){ if(newS==='Ganha') advanceFase(acc,'Cliente'); else if(['Criada','Enviada','Negociação'].includes(newS)) advanceFase(acc,'SQL'); } }
  if(newS==='Ganha') fireAutomations('proposta-ganha',{clienteId:p.clienteId,proposta:p});
  else if(newS==='Enviada') fireAutomations('proposta-enviada',{clienteId:p.clienteId,proposta:p});
  else if(newS==='Perdida' && !p.motivoPerda){ toast('Registe o motivo da perda','Porque perdeu este negócio?','warn'); setTimeout(()=>openModal('proposta',p.id),350); }
  if(newS==='Ganha' && !p.motivoGanho) toast('Registe o motivo do ganho','O que fez o cliente decidir? É isso que se quer repetir','info');
}

/* ---------- eliminar ---------- */
const STORE_OF={cliente:'clientes',empresa:'empresas',tarefa:'tarefas',produto:'produtos',familia:'familias',subfamilia:'subfamilias',proposta:'propostas',caso:'casos',retencao:'retencoes',utilizador:'utilizadores',loyalty:'loyalty',campanha:'campanhas',consentimento:'consentimentos',pedido:'pedidos',ropa:'ropa',violacao:'violacoes',automacao:'automacoes'};
async function deleteEntity(type,id){
  const store=STORE_OF[type]; if(!store) return;
  const item=state[store].find(x=>x.id===id);
  if(type==='utilizador' && item && (item.id==='u1'||item.protegido)){ toast('Não permitido','O perfil de administrador/criador não pode ser removido.','warn'); return; }
  const nm=type==='cliente'?clientName(id):(item?.nome||item?.numero||item?.atividade||item?.descricao||'registo');
  if(!(await uiConfirm(`Eliminar "${nm}"? Esta ação não pode ser anulada.`,{title:'Eliminar '+esc(type)+'?',danger:true,okText:'Eliminar'}))) return;
  if(type==='proposta' && item && item.stockAbatido) applyStockForProp(item, 'Ganha', 'Perdida');   // apagar uma venda repõe o stock
  state[store]=state[store].filter(x=>x.id!==id);
  if(type==='cliente'){ // limpar dependências
    state.propostas=state.propostas.filter(p=>p.clienteId!==id);
    state.consentimentos=state.consentimentos.filter(c=>c.clienteId!==id);
    state.pedidos=state.pedidos.filter(p=>p.clienteId!==id);
  }
  recalcLoyalty(); save(); closeDrawer(); render(); toast('Eliminado',nm);
}

function sendSubmitWork(){
  const u=currentUser(); if(!u){ closeModal(); return; }
  if(submitEnvios && submitEnvios.enviados>=submitEnvios.limite){ toast('Limite atingido','Já usou as '+submitEnvios.limite+' entregas','warn'); return; }

  const sv=$('[data-act="modal-save"]'); if(sv){ sv.disabled=true; sv.textContent='A submeter…'; }

     badge o lê - o localStorage edita-se com F12, o snapshot não */

  supaSubmeter(msg, pay).then(res=>{
    /* O aviso era um toast que desaparecia em segundos - e a pergunta que

    submitFeito={n:res.enviados, de:res.limite, em:new Date()};
    renderSubmitFeito();

    if(emailjsActive()){
      const sigT=sigHtmlToText(u.assinatura);
      const body=`${msg||'(sem mensagem)'}\n\n---\nRESUMO DO TRABALHO\n${resumoTrabalho()}\n\nEntrega ${res.enviados}/${res.limite} · ${(u.nome||'')} ${(u.apelido||'')}${TURMA?' · Turma '+TURMA:''} · ${todayISO()}\n\n${sigT}`;
      const fromName=(`${(u.nome||'').trim()} ${(u.apelido||'').trim()}`.trim()||u.username||'Formando')+' ('+brandName()+')';
      sendViaEmailJS({toEmail:to,toName:'Formador',subject,message:emailTextoHTML(body,fromName),fromName,replyTo:u.email||''}).catch(()=>{});
      /* cópia para o próprio: o comprovativo é dele, não do formador.
         email2 é o pessoal; se não houver, vai para o institucional. */
      const meu=(u.email2||'').trim()||(u.email||'').trim();
      if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(meu)){
        const corpo=`Confirmação da sua entrega ${res.enviados}/${res.limite}.\n\n`+
          `Submetido em ${dPT(todayISO())} às ${pad(new Date().getHours(),2)}:${pad(new Date().getMinutes(),2)}`+
          (TURMA?` · Turma ${TURMA}`:'')+`\n\n---\nO QUE FOI ENTREGUE\n${resumoTrabalho()}\n\n`+
          `Esta é a sua cópia. O trabalho ficou registado no servidor - se este email não chegasse, a entrega continuaria válida.`;
        sendViaEmailJS({toEmail:meu,toName:(u.nome||'')+' '+(u.apelido||''),subject:'A sua entrega ficou registada',message:emailTextoHTML(corpo,brandName()),fromName:brandName(),replyTo:to}).catch(()=>{});
      }
    }
  }).catch(e=>{ const sv2=$('[data-act="modal-save"]'); if(sv2){ sv2.disabled=false; sv2.textContent='Submeter trabalho'; } toast('Não foi possível submeter',supaMsg(e),'err'); });

/* Um lead que entra pelo formulario e uma pessoa que levantou a mao. O toast do
   momento desaparece em segundos e, se ninguem estivesse a olhar, ninguem soube.
   Este alerta fica no sino ATE HAVER SEGUIMENTO - nao ate ser lido.

   "Seguimento" e uma acao a serio: um email enviado, uma tarefa marcada, ou a
   conta ter avancado de Lead. Marcar como visto nao conta: ver nao e atender. */
function leadPorAtender(c){
  if((c.fonte!=="form") && (c.origem!=="Formulário")) return false;
  /* o email de boas-vindas que a AUTOMACAO dispara nao e seguimento: e a
     maquina a responder a maquina. Se contasse, o alerta apagava-se sozinho um
     segundo depois de nascer - que era exatamente o que acontecia. */
  if((state.envios||[]).some(e=>e.clienteId===c.id && e.origem!=="Automação")) return false;
  if((state.tarefas||[]).some(t=>t.clienteId===c.id)) return false;
  const emp=c.empresaId?(state.empresas||[]).find(e=>e.id===c.empresaId):null;
  if(emp && !["Lead","MQL"].includes(emp.fase||"Lead")) return false;
  return true;
}
function leadsPorAtender(){ return (state.clientes||[]).filter(leadPorAtender); }
function computeAlerts(){
  const a=[]; const t=todayISO();
  state.propostas.filter(p=>p.validade&&!['Ganha','Perdida'].includes(p.estado)&&daysBetween(t,p.validade)>=0&&daysBetween(t,p.validade)<=15).forEach(p=>a.push({i:'doc',c:'amber',t:`Proposta ${p.numero} a expirar`,s:`Validade ${dPT(p.validade)} · ${clientName(p.clienteId)}`,k:'prop',id:p.id}));
  state.pedidos.filter(p=>p.estado!=='Concluído'&&daysBetween(t,p.prazo)<0).forEach(p=>a.push({i:'shield',c:'red',t:'Pedido RGPD fora de prazo',s:`${p.tipo} · ${clientName(p.clienteId)} · prazo ${dPT(p.prazo)}`,k:'rgpd'}));
  state.pedidos.filter(p=>p.estado!=='Concluído'&&daysBetween(t,p.prazo)>=0&&daysBetween(t,p.prazo)<=7).forEach(p=>a.push({i:'shield',c:'amber',t:'Pedido RGPD a vencer',s:`${p.tipo} · ${clientName(p.clienteId)} · prazo ${dPT(p.prazo)}`,k:'rgpd'}));
  leadsPorAtender().forEach(c=>{ const n=((c.nome||'')+' '+(c.apelido||'')).trim();
    a.push({i:'target',c:'green',t:'Nova subscrição por atender',
      s:n+(c.email?' · '+c.email:'')+' · '+dPT(c.criado),k:'lead',id:c.id}); });
  const venc=(state.agendamentos||[]).filter(x=>x.dataAgendada<=t).length; if(venc) a.push({i:'bell',c:'blue',t:`${venc} email(s) agendado(s) vencido(s)`,s:'Abrir Comunicação → Agendados',k:'agend'});
  (state.tarefas||[]).filter(x=>x.estado!=='Concluída'&&x.data<t).forEach(x=>a.push({i:'calendar',c:'amber',t:'Tarefa em atraso',s:`${x.titulo} · ${dPT(x.data)}`,k:'tarefa'}));
  (state.tarefas||[]).filter(x=>x.estado!=='Concluída'&&x.data===t).forEach(x=>a.push({i:'calendar',c:'blue',t:'Tarefa para hoje',s:x.titulo,k:'tarefa'}));
  (state.produtos||[]).filter(pr=>stockLow(pr)).forEach(pr=>a.push({i:'box',c:'red',t:`Stock baixo: ${pr.nome}`,s:`${Number(pr.stock||0)} em armazém · mínimo ${Number(pr.stockMin||0)}`,k:'produto',id:pr.id}));
  return a;
}

/* ---------- Mini-painel de analítica do site (Definições) ---------- */
function prettyPath(p){
  if(!p) return '(raiz)';
  let s=String(p).replace(/^\/manual\/?/,'').replace(/\/$/,'').replace(/\.html$/,'');
  if(!s||s==='index') return 'Manual - Início';
  s=s.split('/').pop().replace(/-/g,' ');
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function prettyVideo(l){
  if(!l) return '-';
  return String(l).replace(/\.(webm|mp4)$/,'').replace(/-(pt|en)$/,'').replace(/-/g,' ').replace(/^\w/,c=>c.toUpperCase());
}
function anList(items, fmt){
  const max=Math.max(1,...items.map(i=>i.n));
  return items.length? items.map(i=>`<div class="an-row"><div class="an-bar" style="width:${Math.max(6,Math.round(i.n/max*100))}%"></div><span class="an-lbl">${esc(fmt(i))}</span><span class="an-n">${i.n}</span></div>`).join('') : '<div class="muted" style="padding:4px 2px">Sem dados ainda.</div>';
}
function anSplit(obj, map){
  const ent=Object.entries(obj||{}).filter(([k])=>k!=='?'); const tot=ent.reduce((a,[,v])=>a+v,0)||1;
  return ent.length? ent.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="an-chip"><span>${esc(map[k]||k)}</span><strong>${Math.round(v/tot*100)}%</strong><span class="muted">(${v})</span></div>`).join('') : '<span class="muted">-</span>';
}
let anData=null, anDays=14;
function anFlag(cc){ return /^[A-Z]{2}$/.test(cc)? cc.replace(/./g,c=>String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65)) : '🏳️'; }
function anCountryName(cc){ try{ return new Intl.DisplayNames([getLang()==='en'?'en':'pt'],{type:'region'}).of(cc)||cc; }catch(e){ return cc; } }
function anWorldMap(paises){
  const W=window.CRM_WORLD;
  if(!W){ return '<div class="muted" style="padding:6px 2px">Mapa indisponível.</div>'; }
  const byCC={}; let unknown=0;
  (paises||[]).forEach(p=>{ const cc=W.tz[p.tz]; if(cc){ byCC[cc]=(byCC[cc]||0)+p.n; } else { unknown+=p.n; } });
  const entries=Object.entries(byCC).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ return '<div class="muted" style="padding:6px 2px">Ainda sem dados de país (o fuso horário é registado a partir de agora).</div>'; }
  const max=Math.max(...entries.map(e=>e[1])); const [VW,VH]=W.vb;
  const bubbles=entries.map(([cc,n])=>{ const xy=W.cc[cc]; if(!xy)return ''; const r=(3+Math.sqrt(n/max)*15).toFixed(1); return `<circle cx="${xy[0]}" cy="${xy[1]}" r="${r}" class="an-bubble"><title>${esc(anCountryName(cc))}: ${n}</title></circle>`; }).join('');
  const top=entries.slice(0,8).map(([cc,n])=>`<div class="an-chip"><span>${anFlag(cc)} ${esc(anCountryName(cc))}</span><strong>${n}</strong></div>`).join('');
  const unk= unknown? `<div class="an-chip"><span>🏳️ Desconhecido</span><strong>${unknown}</strong></div>` : '';
  return `<div class="an-map"><svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet" class="an-map-svg" role="img" aria-label="Mapa de acessos por país"><path d="${W.path}" class="an-land"/>${bubbles}</svg></div><div class="an-chips" style="margin-top:10px">${top}${unk}</div>`;
}

/* ---------- Cards colapsáveis nas Definições ---------- */
let defCollapsed=(()=>{ try{ return new Set(JSON.parse(localStorage.getItem('crm-def-collapsed')||'[]')); }catch(e){ return new Set(); } })();
function saveDefCollapsed(){ try{ localStorage.setItem('crm-def-collapsed', JSON.stringify([...defCollapsed])); }catch(e){} }
function makeDefCollapsible(){
  const sec=$('#content .view'); if(!sec) return;
  const firstRun = localStorage.getItem('crm-def-collapsed')===null;
  const cards=[...sec.querySelectorAll(':scope > .card.card-pad')].filter(c=>c.querySelector(':scope > .section-head'));
  cards.forEach((card,i)=>{
    const head=card.querySelector(':scope > .section-head');
    card.classList.add('collapsible-card');
    const h3=head.querySelector('h3');
    const key=((h3?h3.textContent:head.textContent)||'').trim().slice(0,48)||('card'+i);
    card.dataset.ckey=key;
    if(firstRun) defCollapsed.add(key);              // 1.ª visita → tudo recolhido (página compacta)
    if(defCollapsed.has(key)) card.classList.add('collapsed');
    head.addEventListener('click',e=>{ if(e.target.closest('button,a,input,select,textarea,label')) return; const k=card.dataset.ckey; card.classList.toggle('collapsed'); if(card.classList.contains('collapsed')) defCollapsed.add(k); else defCollapsed.delete(k); saveDefCollapsed(); });
  });
  if(firstRun) saveDefCollapsed();
}

/* ---------- Marca & Aparência (white-label) ---------- */
/* O espaço MANDA sobre o que está guardado no browser. Se não houver espaço,
   vale o local - é o que deixa a app funcionar solta, fora de qualquer escola. */
function brandCfg(){
  const local = state.settings.brand||{};
  if(!ESPACO) return local;
  return { nome:    ESPACO.nome || local.nome,
           logo:    ESPACO.logo || local.logo,
           cor:     ESPACO.cor  || local.cor,
           loginBg: local.loginBg };
}
/* Os valores de recurso são da PLATAFORMA, não de uma escola: é isto que
   impede o nome de uma instituição de reaparecer por omissão. */
/* Esta escola quer ver as referências ao curso? Os códigos das UFCD e
   os números de slide são de um curso concreto: fora dele não querem
   dizer nada, e apontam para material que a escola não tem. */
/* devolve o pedaço com a referência, ou nada - para se poder colar no
   meio de uma frase sem a partir */
function ufcd(txt){ return refsCurso() ? txt : ''; }
function refsCurso(){ try{
  if (!ESPACO) return true;                    /* turma sem escola: é o CRM de quem o escreveu */
  if (!('refsCurso' in ESPACO)) return true;   /* coluna ainda não criada: não se muda nada */
  return !!ESPACO.refsCurso;
}catch(e){ return true; } }
function brandName(){ const b=brandCfg(); return (b.nome&&b.nome.trim())||'CRM'; }
/* A cor que a app está MESMO a usar, e de onde ela vem. O campo das
   Definições mostrava o que estava guardado no browser, e por isso ficava
   vazio quando a cor vinha da escola - enquanto a app ia toda pintada. */
/* A paleta dos relatorios em PDF. Vinha escrita a verde do IEFP em tres
   folhas de estilo diferentes, e uma escola recebia os documentos com a
   cor de outra instituicao. Agora deriva da marca; as neutras ficam
   neutras, porque um cinzento com tinta verde ao lado de um azul e pior
   do que um cinzento sem tinta nenhuma. */
function mixHex(a,b,p){ const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));
  const A=h(a[0]==='#'?a:'#'+a), B=h(b[0]==='#'?b:'#'+b);
  return '#'+A.map((v,i)=>Math.round(v*p+B[i]*(1-p)).toString(16).padStart(2,'0')).join(''); }
/* A cor por omissao de um modelo de proposta ou de email. Era o verde do
   IEFP: um formando de outra escola comecava com a cor de uma instituicao
   que nao e a dele. O try existe porque isto tambem corre no arranque,
   antes de o estado existir. */
function corBase(){ try{ return brandCorEfetiva().cor; }catch(e){ return '#0078bf'; } }
function pdfPaleta(){
  const m = brandCorEfetiva().cor;
  return { forte:m, escuro:mixHex(m,'#000000',.78), chapa:mixHex(m,'#ffffff',.09),
           tinta:'#1b1f24', fraco:'#5c6672', linha:'#dde2e8', fundo:'#eef1f4' };
}

function brandCorEfetiva(){
  const b = brandCfg();
  if (b.cor) return { cor: b.cor[0]==='#' ? b.cor : '#'+b.cor,
                      fonte: (ESPACO && ESPACO.cor) ? 'escola' : 'local' };
  return { cor: '#0078bf', fonte: 'plataforma' };
}
/* contraste do branco sobre a cor, pela regra do costume (WCAG). */
function _lum(hex){ const c=_hexRgb(hex).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); });
  return .2126*c[0] + .7152*c[1] + .0722*c[2]; }
function contrasteBranco(hex){ try{ return 1.05/(_lum(hex)+.05); }catch(e){ return 21; } }
function brandCorNota(){
  const e = brandCorEfetiva();
  /* o texto branco por cima da cor da marca é o que se parte primeiro */
  const fraco = contrasteBranco(e.cor) < 3 ? ' - clara demais: o texto branco por cima quase não se lê' : '';
  if (e.fonte === 'escola')     return e.cor + ' - definida em ' + (ESPACO.nome || 'escola') + fraco;
  if (e.fonte === 'local')      return e.cor + fraco;
  return 'cor da plataforma (predefinido)';
}
function logoURL(){ const b=brandCfg(); return b.logo||'favicon.svg'; }
/* sem imagem por omissão: o fundo passa a ser o gradiente da marca, que
   já existia como último recurso e nunca se via. Uma escola que queira uma
   fotografia põe-na, e ela volta a ganhar. */
function loginBgURL(){ const b=brandCfg(); return b.loginBg||''; } /* absoluto: o --login-bg é usado por estilo/componentes.css, onde um relativo resolvia p/ /estilo/background.png (404) */
function _hexRgb(h){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function _rgbHex(r){ return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function _mix(hex,target,t){ const a=_hexRgb(hex),b=_hexRgb(target); return _rgbHex(a.map((v,i)=>v+(b[i]-v)*t)); }
function applyBrand(){
  const b=brandCfg(); const r=document.documentElement;
  // nome + logótipo (sidebar estático)
  try{ document.title=brandName()+' - Plataforma de Formação'; const h=$('.brand-txt h1'); if(h) h.textContent=brandName(); $$('.brand-logo img').forEach(i=>{ if(i.getAttribute('src')!==logoURL()) i.src=logoURL(); }); }catch(e){}
  // cor principal → paleta derivada
  if(b.cor && /^#?[0-9a-fA-F]{3,6}$/.test(b.cor)){ const c=b.cor[0]==='#'?b.cor:'#'+b.cor;
    const map={'--g900':_mix(c,'#000',.36),'--g800':_mix(c,'#000',.22),'--g700':_mix(c,'#000',.1),'--g600':c,'--g500':_mix(c,'#fff',.12),'--g400':_mix(c,'#fff',.28),'--g300':_mix(c,'#fff',.55),'--g100':_mix(c,'#fff',.88),'--g50':_mix(c,'#fff',.95),'--accent':_mix(c,'#fff',.2)};
    Object.keys(map).forEach(k=>r.style.setProperty(k,map[k]));
  } else { ['--g900','--g800','--g700','--g600','--g500','--g400','--g300','--g100','--g50','--accent'].forEach(k=>r.style.removeProperty(k)); }
  // fundo do login
  const bg = loginBgURL();
  if (bg) r.style.setProperty('--login-bg', `url('${bg}')`);
  else r.style.setProperty('--login-bg', 'none');
}
function brandImgUpload(input){
  /* Isto tinha um if(!isAdmin()) return: a seccao Marca aparecia ao formando
     (a feat brand esta no papel dele), o botao Carregar abria o seletor de
     ficheiros, escolhia-se a imagem... e nao acontecia NADA. Sem erro, sem
     aviso. Um ecra que oferece uma coisa e a recusa em silencio e pior do que
     um ecra que nao a oferece.
     A marca vive em state.settings.brand, que e LOCAL a sandbox de cada um -
     nao ha nada a proteger. A imagem e redimensionada (240px o logotipo,
     1280px o fundo) e guardada como data URI. */
  const k=input.dataset.brandimg; const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=ev=>{ const im=new Image(); im.onload=()=>{ const max=k==='loginBg'?1280:240; let w=im.width,h=im.height; if(w>max){ h=Math.round(h*max/w); w=max; } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); const url=cv.toDataURL(k==='loginBg'?'image/jpeg':'image/png', .82); state.settings.brand[k]=url; save(); applyBrand(); render(); toast('Imagem aplicada', k==='loginBg'?'Fundo do login':'Logótipo'); }; im.src=ev.target.result; }; rd.readAsDataURL(f); input.value='';
}

/* ---------- diálogos com o look da app (substituem confirm/prompt/alert) ---------- */
function uiDialog(o){ o=o||{}; return new Promise(res=>{
  const isInput=o.input!=null;
  const back=document.createElement('div'); back.className='dlg-back';
  back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">
    ${o.title?`<div class="dlg-title">${o.icon?ic(o.icon,18):''}${esc(o.title)}</div>`:''}
    ${o.message?`<div class="dlg-msg">${o.html?o.message:esc(o.message).replace(/\n/g,'<br>')}</div>`:''}
    ${isInput?`<input class="dlg-input" value="${esc(o.input)}" placeholder="${esc(o.placeholder||'')}">`:''}
    <div class="dlg-foot">${o.cancelText===null?'':`<button class="btn-sec" data-dlg="cancel">${esc(o.cancelText||'Cancelar')}</button>`}<button class="btn${o.danger?'-danger':''}" data-dlg="ok">${esc(o.okText||'OK')}</button></div>
  </div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
  const inp=back.querySelector('.dlg-input'); const okBtn=back.querySelector('[data-dlg="ok"]');
  setTimeout(()=>{ (inp||okBtn).focus(); if(inp) inp.select(); },30);
  function done(val){ document.removeEventListener('keydown',onKey,true); back.classList.remove('open'); setTimeout(()=>back.remove(),170); res(val); }
  function onKey(ev){ if(ev.key==='Escape'){ ev.preventDefault(); done(isInput?null:false); } else if(ev.key==='Enter'){ ev.preventDefault(); done(isInput?(inp?inp.value:true):true); } }
  document.addEventListener('keydown',onKey,true);
  back.addEventListener('mousedown',ev=>{ if(ev.target===back) done(isInput?null:false); });
  back.addEventListener('click',ev=>{ const b=ev.target.closest('[data-dlg]'); if(!b) return; done(b.dataset.dlg==='ok'?(isInput?(inp?inp.value:true):true):(isInput?null:false)); });
}); }
/* ---------- Calendário próprio (o nativo do browser não é estilável) ----------
   Mantém o <input type="date"> por baixo: o value continua em ISO, por isso
   tudo o que lê estes campos (setDateField, validade, etc.) fica igual.
   Só escondemos o ícone nativo (que abria o popup do browser) e abrimos este. */
const DP_MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DP_WD=[['S','segunda'],['T','terça'],['Q','quarta'],['Q','quinta'],['S','sexta'],['S','sábado'],['D','domingo']];
let dpPop=null, dpInput=null, dpY=0, dpM=0, dpMode='days';
const dpPad=n=>String(n).padStart(2,'0');
const dpISO=dt=>dt.getFullYear()+'-'+dpPad(dt.getMonth()+1)+'-'+dpPad(dt.getDate());
const dpOpenNow=()=>!!(dpPop&&dpPop.classList.contains('open'));
function dpEnsure(){
  if(dpPop) return dpPop;
  dpPop=document.createElement('div'); dpPop.className='dp-pop';
  dpPop.addEventListener('mousedown',e=>e.preventDefault());   // não rouba o foco ao input
  dpPop.addEventListener('click',dpClick);
  document.body.appendChild(dpPop);
  return dpPop;
}
function dpRender(){
  const p=dpEnsure(); p.classList.toggle('is-months',dpMode==='months');
  const sel=(dpInput&&dpInput.value)||''; const hoje=todayISO();
  let body;
  if(dpMode==='months'){
    body=`<div class="dp-months">${DP_MESES.map((n,i)=>`<button type="button" class="dp-month${i===dpM?' is-sel':''}" data-dp="m" data-i="${i}">${n.slice(0,3)}</button>`).join('')}</div>`;
  }else{
    const start=(new Date(dpY,dpM,1).getDay()+6)%7;   // semana começa à segunda
    let cells='';
    for(let i=0;i<42;i++){ const dt=new Date(dpY,dpM,1-start+i); const iso=dpISO(dt);
      cells+=`<button type="button" class="dp-day${dt.getMonth()!==dpM?' is-out':''}${iso===hoje?' is-today':''}${iso===sel?' is-sel':''}" data-dp="d" data-iso="${iso}">${dt.getDate()}</button>`; }
    body=`<div class="dp-grid dp-wd">${DP_WD.map(([l,t])=>`<span title="${t}">${l}</span>`).join('')}</div><div class="dp-grid">${cells}</div>`;
  }
  p.innerHTML=`<div class="dp-head">
      <button type="button" class="dp-nav" data-dp="prev" aria-label="Anterior">${ic('chevL',18)}</button>
      <button type="button" class="dp-title" data-dp="mode">${dpMode==='months'?dpY:DP_MESES[dpM]+' '+dpY} ${ic('chevD',14)}</button>
      <button type="button" class="dp-nav" data-dp="next" aria-label="Seguinte">${ic('chevR',18)}</button>
    </div>${body}
    <div class="dp-foot"><button type="button" class="dp-link" data-dp="clear">Limpar</button><button type="button" class="dp-link dp-go" data-dp="today">Hoje</button></div>`;
}
function dpPlace(){
  if(!dpInput||!dpPop) return;
  const r=dpInput.getBoundingClientRect(); const w=dpPop.offsetWidth||300, h=dpPop.offsetHeight||330;
  let left=Math.min(Math.max(8,r.left), Math.max(8,innerWidth-w-8));
  let top=r.bottom+6; if(top+h>innerHeight-8) top=Math.max(8,r.top-h-6);
  dpPop.style.left=left+'px'; dpPop.style.top=top+'px';
}
function dpOpen(inp){
  dpInput=inp;
  const base=inp.value?new Date(inp.value+'T00:00:00'):new Date(todayISO()+'T00:00:00');
  dpY=base.getFullYear(); dpM=base.getMonth(); dpMode='days';
  dpRender(); dpPlace(); requestAnimationFrame(()=>{ dpPlace(); dpPop.classList.add('open'); });

function dpClose(){ if(dpPop) dpPop.classList.remove('open'); dpInput=null; }
function dpSet(iso){ const inp=dpInput; if(!inp) return; inp.value=iso;

function dpClick(e){
  const b=e.target.closest('[data-dp]'); if(!b) return;
  const k=b.dataset.dp;
  if(k==='prev'){ if(dpMode==='months') dpY--; else { dpM--; if(dpM<0){dpM=11;dpY--;} } dpRender(); dpPlace(); }
  else if(k==='next'){ if(dpMode==='months') dpY++; else { dpM++; if(dpM>11){dpM=0;dpY++;} } dpRender(); dpPlace(); }
  else if(k==='mode'){ dpMode=(dpMode==='days')?'months':'days'; dpRender(); dpPlace(); }
  else if(k==='m'){ dpM=+b.dataset.i; dpMode='days'; dpRender(); dpPlace(); }
  else if(k==='d') dpSet(b.dataset.iso);
  else if(k==='today') dpSet(todayISO());
  else if(k==='clear') dpSet('');
}

    case 'cal-view': { const novo=el.dataset.view;
      if(novo!==agendaView){
        if(novo==='semana'){
          /* Mes -> Semana: fica no mes que se esta a ver. Se for o mes corrente

             qualquer, abre na semana do dia 1. */
          const ym=agendaYM||curYM();
          if(ym===curYM()){ agendaWeek=mondayOf(todayISO()); }
          else {
            /* A primeira semana QUE PERTENCE a esse mes, pela mesma regra da
               quinta-feira. Sem isto, pedir Novembro de 2026 (em que o dia 1 e
               domingo) abria a semana 26/out-01/nov: a pessoa pedia um mes e
               via o titulo de outro. */
            let w=mondayOf(ym+'-01');
            if(addDays(w,3).slice(0,7)!==ym) w=addDays(w,7);
            agendaWeek=w;
          }
        } else {
          /* Semana -> Mes: o mes a que a semana pertence. Uma semana pode cair
             em dois meses (28/09 a 04/10), por isso usa-se a QUINTA-FEIRA, que
             e a regra da ISO 8601 para decidir a que mes uma semana pertence -
             a maioria dos seus dias esta sempre do lado dela. */
          const wk=agendaWeek||mondayOf(todayISO());

function saveGroup(){
  const f=$('#modalForm'); const nome=f.querySelector('[name="gnome"]').value.trim();
  if(!nome){ toast('Falta o nome','Indique o nome do grupo','warn'); return; }
  const gestor=f.querySelector('[name="ggestor"]').checked;
  const ocultar=f.querySelector('[name="gocultar"]').checked;
  const feats=[...f.querySelectorAll('[name="gfeat"]:checked')].map(c=>c.value);
  const orig=groupDraft&&groupDraft.orig;
  if(!orig && state.roles[nome]){ toast('Já existe','Esse grupo já existe','warn'); return; }
  if(orig){
    const role=state.roles[orig]||{modules:[]};
    role.gestor=gestor; role.ocultarFinanceiro=ocultar; role.feats=feats; if(gestor) role.modules=NAV_FLAT.map(n=>n.id);
    if(nome!==orig){ delete state.roles[orig]; state.roles[nome]=role; state.utilizadores.forEach(u=>{ if(u.papel===orig) u.papel=nome; }); }
    else state.roles[nome]=role;
  } else {
    const copy=f.querySelector('[name="gcopy"]')?.value;
    const modules = gestor?NAV_FLAT.map(n=>n.id):(copy&&state.roles[copy]?state.roles[copy].modules.slice():[]);
    state.roles[nome]={modules,gestor,ocultarFinanceiro:ocultar,feats};
  }
  save(); editing=null; groupDraft=null; closeModal(); render(); toast('Grupo guardado',nome);
}
async function delGroup(name){

  if(!(await uiConfirm(`Eliminar o grupo "${name}"?`,{title:'Eliminar grupo?',danger:true,okText:'Eliminar'}))) return;

function togglePerm(role,mod,on,el){
  const r=state.roles[role]; if(!r) return;
  const u=currentUser();
  // impedir que o utilizador atual se bloqueie a si próprio das Definições
  if(!on && mod==='definicoes' && u && u.papel===role){ if(el) el.checked=true; toast('Ação bloqueada','Não pode remover o seu próprio acesso às Definições','warn'); return; }
  r.modules=r.modules||[];
  if(on){ if(!r.modules.includes(mod)) r.modules.push(mod); } else r.modules=r.modules.filter(m=>m!==mod);
  save();
  // se mexeu no papel do utilizador atual, atualizar a navegação
  if(u && u.papel===role) buildNav();
  toast('Permissões atualizadas',`${role}: ${mod} ${on?'ativado':'removido'}`);
}

/* ---------- Importação de clientes via CSV ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const nl=text.indexOf('\n'); const head=nl>=0?text.slice(0,nl):text;
  const delim=(head.split(';').length>head.split(',').length)?';':',';
  const rows=[]; let i=0,field='',row=[],q=false;
  const pf=()=>{row.push(field);field='';}; const pr=()=>{rows.push(row);row=[];};
  while(i<text.length){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} q=false;i++;continue; } field+=ch;i++;continue; }
    if(ch==='"'){q=true;i++;continue;}
    if(ch===delim){pf();i++;continue;}
    if(ch==='\r'){i++;continue;}
    if(ch==='\n'){pf();pr();i++;continue;}
    field+=ch;i++;
  }
  if(field.length||row.length){pf();pr();}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importClientsCSV(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const rows=parseCSV(e.target.result); if(rows.length<2) throw 0;
      const head=rows[0].map(h=>h.trim().toLowerCase());
      const idx=n=>head.indexOf(n);
      const cols={nome:idx('nome'),apelido:idx('apelido'),empresa:idx('empresa'),email:idx('email'),telefone:idx('telefone'),nif:idx('nif'),cidade:idx('cidade'),segmento:idx('segmento'),origem:idx('origem')};
      if(cols.nome<0){ toast('CSV inválido','Falta a coluna "nome"','err'); return; }
      let added=0, skipped=0;
      rows.slice(1).forEach(c=>{
        const g=k=>cols[k]>=0?(c[cols[k]]||'').trim():'';
        const nome=g('nome'); if(!nome){skipped++;return;}

  if(low==='root'||low==='suporte'){ loginMode='root'; renderLogin(); return; }   // suporte
  const d=raw;
  if(!TURMA_RE.test(d)){
    if(err) err.textContent='O código da turma tem entre 2 e 24 caracteres: letras, números, ponto ou hífen.';
    return;
  }
  const go=()=>{ location.href=location.pathname+'?t='+d; };
  const btn=f.querySelector('[data-act="enter-turma"]'); if(btn){ btn.disabled=true; btn.textContent='A verificar…'; }
  supaRpc('turma_existe',ESPACO_SLUG?{p_codigo:d,p_espaco:ESPACO_SLUG}:{p_codigo:d}).then(existe=>{
    if(existe!==false){ go(); }   // existe (true) ou resposta inesperada → avança
    else { if(err) err.textContent='Turma '+d+' não encontrada nesta escola. Confirme o número com o formador.'; if(btn){ btn.disabled=false; btn.textContent='Entrar'; } }
  }).catch(()=>{ go(); });        // função ainda não criada / rede → não bloquear (cai no login normal)
}
