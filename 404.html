/* ---------- gráficos SVG ---------- */
/* Cada fatia leva um `tip` (o que representa) e, se quiseres, um `act` (para onde leva).
   Sem isso, o gráfico é bonito mas mudo: ve-se a fatia verde e nao se sabe o que e. */
/* Tooltip flutuante para qualquer elemento com data-tip. Serve o SVG do donut,
   onde o truque de CSS das barras não funciona. Linhas separadas por " | ";
   a primeira fica em destaque. */
let _gtipEl=null;
function gtip(){ if(_gtipEl) return _gtipEl;
  _gtipEl=document.createElement('div'); _gtipEl.className='bar-tip gtip'; _gtipEl.style.display='none';
  document.body.appendChild(_gtipEl); return _gtipEl; }
function gtipShow(el,x,y){
  const txt=el.getAttribute('data-tip')||''; if(!txt) return;
  const linhas=txt.split(' | ');
  const t=gtip();
  t.innerHTML='<strong>'+esc(linhas[0])+'</strong>'+linhas.slice(1).map(l=>'<div>'+esc(l)+'</div>').join('');
  t.style.display='block'; t.style.opacity='1'; gtipMove(x,y);
}
function gtipMove(x,y){
  const t=gtip(); if(t.style.display==='none') return;
  const r=t.getBoundingClientRect();
  let L=x+14, T=y-r.height-12;
  if(L+r.width>innerWidth-8) L=x-r.width-14;
  if(T<8) T=y+18;
  t.style.left=Math.max(8,L)+'px'; t.style.top=T+'px';
}
function gtipHide(){ if(_gtipEl){ _gtipEl.style.display='none'; } }
document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) gtipShow(el,e.clientX,e.clientY); });
document.addEventListener('mousemove',e=>{ if(_gtipEl&&_gtipEl.style.display!=='none'){ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) gtipMove(e.clientX,e.clientY); else gtipHide(); } });
document.addEventListener('mouseout',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) gtipHide(); });
document.addEventListener('scroll',gtipHide,true);
function donut(segs, size=148){
  const total=segs.reduce((s,x)=>s+x.v,0)||1; const r=size/2-14, cx=size/2, cy=size/2, C=2*Math.PI*r; let off=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{ const len=s.v/total*C; const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"${s.tip?` style="cursor:${s.act?'pointer':'default'}"`:''}${s.act?` data-act="${s.act}"`:''}${s.tip?` data-tip="${esc(s.tip)}"`:''} stroke-linecap="butt"/>`; off+=len; return el; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="20"/>${arcs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${fmtN(total)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--muted)">TOTAL</text></svg>`;
}
function barShort(v){ if(!v) return ''; return v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.',',')+'k€':Math.round(v)+'€'; }
function bars(data, h=150, fill){
  const max=Math.max(...data.map(d=>d.v),1);
  return `<div class="barchart"${fill?' style="flex:1;display:flex;flex-direction:column"':''}>
    <div class="barchart-plot" style="${fill?`flex:1;min-height:${h}px`:`height:${h}px`}">
      ${data.map(d=>{const p=Math.round(d.v/max*100);
        const tip=(d.tip&&d.tip.length)?`<div class="bar-tip"><strong>${esc(d.l)} · ${money(d.v)}</strong>${d.tip.map((t,i)=>`<div>${i+1}. ${esc(t.nome)} · ${money(t.v)}</div>`).join('')}${d.mais?`<div class="mais">… e mais ${d.mais}</div>`:''}</div>`:'';
        return `<div class="barchart-col" title="${esc(d.l)}: ${money(d.v)}">${tip}<div class="barchart-val">${barShort(d.v)}</div><div class="barchart-fill" style="height:${d.v?Math.max(3,p):0}%"></div></div>`;}).join('')}
    </div>
    <div class="barchart-labels">${data.map(d=>`<div>${esc(d.l)}</div>`).join('')}</div>
  </div>`;
}
function ring(p, size=78, label=''){
  const r=size/2-8, c=2*Math.PI*r, v=Math.max(0,Math.min(100,p));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${v/100*c} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="${size/2}" y="${size/2+2}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">${Math.round(v)}%</text>${label?`<text x="${size/2}" y="${size/2+15}" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.8)">${label}</text>`:''}</svg>`;
}

function monthlyRevenue(props){
  props=props||state.propostas;
  const names=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const m={};  // chave absoluta ano*12+mês (aguenta várias anos)
  const porEmp={};   // quem gerou o valor de cada mes - alimenta o detalhe do gráfico
  props.filter(p=>p.estado==='Ganha').forEach(p=>{ const d=(p.criada||''); const yr=+d.slice(0,4), mi=+d.slice(5,7)-1;
    if(yr&&mi>=0){ const k=yr*12+mi; const v=propTotal(p); m[k]=(m[k]||0)+v;
      const e=(state.empresas||[]).find(x=>x.id===p.empresaId);
      const nome=(e&&e.nome)||p.empresa||clientName(p.clienteId)||'(sem empresa)';
      porEmp[k]=porEmp[k]||{}; porEmp[k][nome]=(porEmp[k][nome]||0)+v; } });
  const now=todayISO(); const nowKey=(+now.slice(0,4))*12+(+now.slice(5,7)-1);
  const dk=Object.keys(m).map(Number);
  let hi=dk.length?Math.max(nowKey,...dk):nowKey;
  let lo=dk.length?Math.min(...dk):nowKey-5;
  if(hi-lo<5) lo=hi-5;                 // janela mínima de 6 meses para o gráfico não ficar "vazio"
  if(hi-lo>11) lo=hi-11;               // no máximo 12 meses
  const out=[];
  for(let k=lo;k<=hi;k++){
    const todas=Object.entries(porEmp[k]||{}).map(([nome,v])=>({nome,v})).sort((a,b)=>b.v-a.v);
    out.push({l:names[((k%12)+12)%12], v:m[k]||0, tip:todas.slice(0,5), mais:Math.max(0,todas.length-5)});
  }
  return out;
}

/* ---------- Paginação reutilizável ---------- */
let _pages={};
const PAGE_SIZE=12;
function paginate(list,key){
  const total=list.length; const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  let p=_pages[key]||1; if(p>pages)p=pages; if(p<1)p=1; _pages[key]=p;
  const start=(p-1)*PAGE_SIZE; const slice=list.slice(start,start+PAGE_SIZE);
  return {slice,p,pages,total,start};
}
function pager(key,pg){
  const {p,pages,total,start,slice}=pg; if(total===0) return '';
  const info=`${start+1}-${start+slice.length} de ${total}`;
  if(pages<=1) return `<div class="pager"><span class="pager-info">${total} registo(s)</span></div>`;
  let nums=''; const win=2; const lo=Math.max(1,p-win), hi=Math.min(pages,p+win);
  if(lo>1){ nums+=`<button class="pg-num" data-act="page" data-key="${key}" data-p="1">1</button>`; if(lo>2) nums+=`<span class="pg-dots">…</span>`; }
  for(let i=lo;i<=hi;i++) nums+=`<button class="pg-num${i===p?' active':''}" data-act="page" data-key="${key}" data-p="${i}">${i}</button>`;
  if(hi<pages){ if(hi<pages-1) nums+=`<span class="pg-dots">…</span>`; nums+=`<button class="pg-num" data-act="page" data-key="${key}" data-p="${pages}">${pages}</button>`; }
  return `<div class="pager">
    <span class="pager-info">${info}</span>
    <div class="pager-btns">
      <button class="btn-sec btn-xs" data-act="page" data-key="${key}" data-p="${p-1}" ${p<=1?'disabled':''}>‹ Anterior</button>
      ${nums}
      <button class="btn-sec btn-xs" data-act="page" data-key="${key}" data-p="${p+1}" ${p>=pages?'disabled':''}>Seguinte ›</button>
    </div>
  </div>`;
}

  csat:'só os casos com CSAT respondido',nps:'só os casos com NPS respondido'};

function casoRefresca(){
  const box=$('#casoBody'); if(!box){ render(); return; }

function casoBodyHTML(){
  const filtroE=state._casoEstado||''; const q=(state._q||'').toLowerCase().trim();
  const fk=state._casoKpi||'';
  let list=(state.casos||[]).slice();
  if(filtroE) list=list.filter(c=>c.estado===filtroE);
  if(fk==='abertos') list=list.filter(casoAberto);
  else if(fk==='risco') list=list.filter(c=>casoAberto(c)&&['risco','violado'].includes(casoSla(c).estado));
  else if(fk==='csat') list=list.filter(c=>c.csat!=null&&c.csat!=='');
  else if(fk==='nps') list=list.filter(c=>c.nps!=null&&c.nps!=='');
  if(q) list=list.filter(c=>[c.numero,c.assunto,casoAccount(c),clientName(c.clienteId)].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>{ const oa=casoAberto(a)?0:1, ob=casoAberto(b)?0:1; if(oa!==ob) return oa-ob; return (casoPrazo(a)<casoPrazo(b)?-1:1); });
  const avisoKpi = fk?`<div class="callout info" style="margin:0 0 12px">${ic('info',16)}<div class="ctxt" style="flex:1">A mostrar <strong>${esc(CASO_KPI_ROT[fk]||fk)}</strong> · ${list.length} caso(s).</div><button class="btn-sec btn-xs" data-act="caso-kpi" data-f="">Limpar filtro</button></div>`:'';
  return avisoKpi+`${q?`<div class="muted" style="font-size:.78rem;margin:0 0 10px">${ic('eye',12)} ${list.length} resultado(s) para "${esc(state._q)}" · <a href="#" data-act="prop-clearq" style="color:var(--g700)">limpar</a></div>`:''}
    <div class="table-wrap"><table><thead><tr><th>Caso</th><th>Empresa</th><th>Canal</th><th>Prioridade</th><th>Estado</th><th>SLA</th><th>Responsável</th><th>Atualizado</th></tr></thead><tbody>
    ${list.length?list.map(c=>`<tr data-act="open-caso" data-id="${c.id}" style="cursor:pointer">
      <td><div class="cell-main">${esc(c.numero)}</div><div class="cell-sub">${esc(c.assunto)}</div></td>
      <td>${esc(casoAccount(c))}</td>
      <td><span class="chip">${esc(c.canal||'-')}</span></td>
      <td><span class="pill ${casoPrioCor(c.prioridade)}">${esc(c.prioridade||'-')}</span></td>
      <td><span class="pill ${casoEstadoCor(c.estado)}">${esc(c.estado)}</span></td>
      <td>${casoSlaBadge(c)||'<span class="muted">-</span>'}</td>
      <td class="muted" style="font-size:.82rem">${esc(casoResponsavel(c)||'- por atribuir -')}</td>
      <td class="muted">${dPT(c.atualizado||c.aberto)}</td>
    </tr>`).join(''):`<tr><td colspan="8">${empty('Sem casos')}</td></tr>`}
    </tbody></table></div>`;
}

/* ---------- O codigo para colar no site ----------
   O formulario aqui ao lado SIMULA a captacao. Faltava a ponte para o mundo:
   o HTML que se cola numa landing page e que faz o lead entrar mesmo.

   E ILUSTRATIVO de proposito - o endpoint fica por preencher. Ligar isto a
   serio exige um servidor (CORS, validacao, protecao contra spam) e isso e a
   licao: um formulario de site nao fala diretamente com a base de dados. */
function w2lSnippet(){
  const ent=(state.settings&&state.settings.entidade)||{};
  const nome=(ent.nome||brandName()||"A sua empresa");
  return [
"<!-- Formulário de captação · gerado pelo "+nome+" -->",
"<!-- 1. Cole isto na página do seu site.                                  -->",
"<!-- 2. Substitua O_SEU_ENDPOINT pelo endereço que recebe os dados.       -->",
"<!-- 3. O endpoint tem de validar tudo outra vez: nunca confie no browser.-->",
"",
"<form id=\"lead\" novalidate>",
"  <label>Nome *<br><input name=\"nome\" required></label><br>",
"  <label>Email *<br><input name=\"email\" type=\"email\" required></label><br>",
"  <label>Empresa<br><input name=\"empresa\"></label><br>",
"  <label>Telefone<br><input name=\"telefone\"></label><br>",
"  <label>Mensagem<br><textarea name=\"mensagem\"></textarea></label><br>",
"",
"  <!-- Consentimento: obrigatorio e NAO pode vir pre-marcado (RGPD art. 7.º).",
"       Guarde tambem a data e o texto exato que a pessoa aceitou. -->",
"  <label><input type=\"checkbox\" name=\"consentimento\" required value=\"1\">",
"    Aceito receber comunicações de "+nome+" e li a política de privacidade.</label><br>",
"",
"  <!-- Armadilha anti-spam: invisivel para pessoas, os robots preenchem-na. -->",
"  <input name=\"website\" tabindex=\"-1\" autocomplete=\"off\" style=\"position:absolute;left:-9999px\">",
"",
"  <button type=\"submit\">Subscrever</button>",
"  <p id=\"lead-msg\" role=\"status\"></p>",
"</form>",
"",
"<script>",
"document.getElementById('lead').addEventListener('submit', async function (e) {",
"  e.preventDefault();",
"  var f = e.target, d = Object.fromEntries(new FormData(f));",
"  if (d.website) return;                    // robot: finge que correu bem",
"  if (!d.consentimento) { document.getElementById('lead-msg').textContent =",
"    'Precisamos do seu consentimento para lhe escrever.'; return; }",
"  d.origem = 'Formulário';                  // e assim que o CRM sabe de onde veio",
"  d.consentidoEm = new Date().toISOString(); // prova de QUANDO consentiu",
"  try {",
"    var r = await fetch('O_SEU_ENDPOINT', {",
"      method: 'POST',",
"      headers: { 'Content-Type': 'application/json' },",
"      body: JSON.stringify(d)",
"    });",
"    if (!r.ok) throw new Error(r.status);",
"    f.reset();",
"    document.getElementById('lead-msg').textContent = 'Obrigado! Entraremos em contacto.';",
"  } catch (err) {",
"    document.getElementById('lead-msg').textContent = 'Não foi possível enviar. Tente mais tarde.';",
"  }",
"});",
"<\/script>"
  ].join("\n");
}
function segmentBreakdown(){

  const map={}; state.clientes.forEach(c=>{const s=accSegOf(c)||'Particular';map[s]=(map[s]||0)+1;});
  return Object.entries(map).map(([l,v])=>({l,v,c:colors[l]||'#00A651'}));
}
function avgRate(field){ const c=state.campanhas.filter(x=>x.enviados>0); if(!c.length) return 0; return c.reduce((s,x)=>s+x[field]/x.enviados*100,0)/c.length; }

/* ---------- ANALYTICS ---------- */
/* ---------- filtro temporal reutilizável ---------- */
function inDateRange(iso, from, to){ if(!iso) return false; if(from && iso<from) return false; if(to && iso>to) return false; return true; }
function rangeOf(scope){ return {from:state['_'+scope+'From']||'', to:state['_'+scope+'To']||'', preset:state['_'+scope+'Preset']||''}; }
function rangeActive(scope){ const r=rangeOf(scope); return !!(r.from||r.to); }
function applyDatePreset(scope,key){
  const today=todayISO(); let from='',to='';
  if(key==='30d'){ from=addDays(today,-30); to=today; }
  else if(key==='90d'){ from=addDays(today,-90); to=today; }
  else if(key==='mes'){ from=today.slice(0,8)+'01'; to=today; }
  else if(key==='ano'){ from=today.slice(0,4)+'-01-01'; to=today; }
  state['_'+scope+'From']=from; state['_'+scope+'To']=to; state['_'+scope+'Preset']=key; render();
}
function setDateField(scope,which,val){ state['_'+scope+(which==='from'?'From':'To')]=val; state['_'+scope+'Preset']='custom'; render(); }
function clearDateRange(scope){ state['_'+scope+'From']=''; state['_'+scope+'To']=''; state['_'+scope+'Preset']=''; render(); }
function dateBar(scope, extra){
  const r=rangeOf(scope);
  const presets=[['','Tudo'],['30d','30 dias'],['90d','Trimestre'],['mes','Este mês'],['ano','Este ano']];
  return `<div class="card card-pad" style="padding:13px 16px">

      <div class="tabs">${presets.map(p=>`<button class="tab ${r.preset===p[0]?'active':''}" data-dpreset="${scope}:${p[0]}">${p[1]}</button>`).join('')}</div>
      <div class="toolbar" style="align-items:flex-end;gap:8px">
        <div class="field"><label style="font-size:.72rem">De</label><input type="date" data-drange="${scope}:from" value="${r.from}" style="padding:7px 34px 7px 10px" aria-label="Data inicial"></div>
        <div class="field"><label style="font-size:.72rem">Até</label><input type="date" data-drange="${scope}:to" value="${r.to}" style="padding:7px 34px 7px 10px" aria-label="Data final"></div>
        ${(r.from||r.to)?`<button class="btn-ghost btn-sm" data-dclear="${scope}">Limpar</button>`:''}
      </div>
    </div>
    ${(r.from||r.to)?`<div class="muted" style="font-size:.78rem;margin-top:9px">${ic('bell',13)} Período: <strong>${r.from?dPT(r.from):'início'}</strong> a <strong>${r.to?dPT(r.to):'hoje'}</strong>${extra?' · '+extra:''}</div>`:''}
  </div>`;
}
function cmp(cur,prev,invert){
  if(prev==null) return {};
  const d = prev===0 ? (cur>0?100:(cur<0?-100:0)) : (cur-prev)/prev*100;
  const flat=Math.abs(d)<0.05; const better=invert?d<0:d>0;
  return { delta:`${Math.abs(d).toLocaleString('pt-PT',{maximumFractionDigits:1})}% vs anterior`, dir:flat?'flat':(better?'up':'down') };
}
function analyticsMetrics(from,to){
  const props=state.propostas.filter(p=>inDateRange(p.criada,from,to));
  const ganhas=props.filter(p=>p.estado==='Ganha');
  const fechadas=ganhas.length+props.filter(p=>p.estado==='Perdida').length;
  const receita=ganhas.reduce((s,p)=>s+propTotal(p),0);
  const vba={}; ganhas.forEach(p=>{const k=accKeyOf(p); vba[k]=(vba[k]||0)+propTotal(p);});
  const nAcc=accountsCount(); const semGanho=nAcc-Object.keys(vba).length;
  return { receita, conv:fechadas?ganhas.length/fechadas*100:0, ticket:ganhas.length?receita/ganhas.length:0, churn:nAcc?semGanho/nAcc*100:0 };
}

/* ================== QUALIDADE DE DADOS: DUPLICADOS ==================
   A app já IMPEDE duplicados na criação (NIPC, email, NIF). O que faltava era
   limpar os que já lá estão - e entram: pela importação CSV, pelo gerador, e
   sempre que o email/NIF ficam vazios (aí a verificação não dispara).

   Não é só arrumação: um titular duplicado recebe o email duas vezes e o
   relatório de acesso (art. 15.º) sai incompleto. O RGPD exige exatidão
   (art. 5.º/1 d)). */

const dupTxt = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const dupDig = v => String(v||"").replace(/\D/g,"");
/* o nome da empresa compara-se sem a forma societária: "Silva & Filhos, Lda."
   e "Silva e Filhos Lda" são a mesma empresa */
const DUP_SUF=["lda","sa","unipessoal","eni","sociedade anonima","s a"];
function dupEmpNome(n){ let t=dupTxt(n).replace(/\b(e|and)\b/g," ");
  DUP_SUF.forEach(x=>{ t=t.replace(new RegExp("\\b"+x+"\\b","g")," "); });
  return t.replace(/\s+/g," ").trim(); }

/* Agrupa por uma chave; devolve só os grupos com mais do que um registo. */
function dupGrupos(lista, chaveFn, porque){
  const m={};
  (lista||[]).forEach(x=>{ const k=chaveFn(x); if(!k) return; (m[k]=m[k]||[]).push(x); });
  return Object.keys(m).filter(k=>m[k].length>1).map(k=>({chave:k, porque, itens:m[k]}));
}
/* Um registo só aparece num grupo: a regra mais forte ganha. */
function dupDetetar(){
  const emp=state.empresas||[], cli=state.clientes||[];
  const usado=new Set(); const out=[];
  const junta=gs=>gs.forEach(g=>{
    const itens=g.itens.filter(x=>!usado.has(x.id));
    if(itens.length>1){ itens.forEach(x=>usado.add(x.id)); out.push(Object.assign({},g,{itens})); }
  });
  junta(dupGrupos(emp, e=>dupDig(e.nipc).length===9?"nipc:"+dupDig(e.nipc):"", "NIPC igual"));
  junta(dupGrupos(emp, e=>{const n=dupEmpNome(e.nome); return n.length>2?"nome:"+n:"";}, "Mesmo nome (ignorando Lda/SA)"));
  const empOut=out.map(g=>Object.assign({},g,{tipo:"empresa"}));

  const usado2=new Set(); const out2=[];
  const junta2=gs=>gs.forEach(g=>{
    const itens=g.itens.filter(x=>!usado2.has(x.id));
    if(itens.length>1){ itens.forEach(x=>usado2.add(x.id)); out2.push(Object.assign({},g,{itens})); }
  });
  junta2(dupGrupos(cli, c=>c.email?"em:"+dupTxt(c.email):"", "Email igual"));
  junta2(dupGrupos(cli, c=>dupDig(c.nif).length===9?"nif:"+dupDig(c.nif):"", "NIF igual"));
  junta2(dupGrupos(cli, c=>dupDig(c.telefone).length>=9?"tel:"+dupDig(c.telefone):"", "Telefone igual"));
  junta2(dupGrupos(cli, c=>{const n=dupTxt((c.nome||"")+" "+(c.apelido||"")); return n.length>4?"nm:"+n:"";}, "Mesmo nome"));
  return empOut.concat(out2.map(g=>Object.assign({},g,{tipo:"contacto"})));
}

/* Reaponta QUALQUER referência ao registo que vai desaparecer. Percorre todo o
   state em vez de uma lista fixa de coleções: se amanhã houver uma coleção nova,
   continua a funcionar e não ficam referências penduradas. */
function dupReapontar(campo, de, para){
  let n=0;
  Object.keys(state).forEach(k=>{
    if(!Array.isArray(state[k])) return;
    state[k].forEach(x=>{ if(x && typeof x==="object" && x[campo]===de){ x[campo]=para; n++; } });
  });
  return n;
}
/* quantos campos preenchidos tem - serve para sugerir qual fica */
function dupRiqueza(o){ return Object.keys(o||{}).filter(k=>k[0]!=="_"&&o[k]!=null&&o[k]!==""&&!(Array.isArray(o[k])&&!o[k].length)).length; }

function dupFundir(tipo, ficaId, outrosIds){
  const store = tipo==="empresa" ? "empresas" : "clientes";
  const campo = tipo==="empresa" ? "empresaId" : "clienteId";
  const fica=(state[store]||[]).find(x=>x.id===ficaId); if(!fica) return null;
  let refs=0, campos=0;
  outrosIds.forEach(oid=>{
    const o=(state[store]||[]).find(x=>x.id===oid); if(!o) return;
    /* o que o principal não tem, herda do duplicado - não se perde informação */
    Object.keys(o).forEach(k=>{
      if(k==="id"||k[0]==="_") return;
      const v=fica[k];
      if(v==null||v===""||(Array.isArray(v)&&!v.length)){ if(o[k]!=null&&o[k]!==""){ fica[k]=o[k]; campos++; } }
    });
    refs+=dupReapontar(campo, oid, ficaId);
    state[store]=state[store].filter(x=>x.id!==oid);
  });
  /* o nome da empresa está copiado nos contactos e propostas: acertar */
  if(tipo==="empresa"){ (state.clientes||[]).forEach(c=>{ if(c.empresaId===ficaId) c.empresa=fica.nome; });
    (state.propostas||[]).forEach(p=>{ if(p.empresaId===ficaId) p.empresa=fica.nome; }); }
  recalcLoyalty(); save();
  return {refs, campos, apagados:outrosIds.length};
}
function dupRotulo(tipo,x){
  if(tipo==="empresa") return (x.nome||"(sem nome)")+(x.nipc?" · "+x.nipc:"")+(x.cidade?" · "+x.cidade:"");
  return (((x.nome||"")+" "+(x.apelido||"")).trim()||"(sem nome)")+(x.email?" · "+x.email:"")+(x.empresa?" · "+x.empresa:"");
}
/* o que este registo arrasta consigo - ajuda a decidir qual fica */
function dupPeso(tipo,x){
  const campo=tipo==="empresa"?"empresaId":"clienteId"; let n=0;
  Object.keys(state).forEach(k=>{ if(Array.isArray(state[k])) state[k].forEach(o=>{ if(o&&o[campo]===x.id) n++; }); });
  return n;
}

function respMatch(x,filtro){

/* ================== METAS DE VENDAS ==================
   Tinhamos previsão mas não tínhamos contra o que a comparar. Uma meta

function metasCfg(){ const m=(state.settings&&state.settings.metas)||{}; return {mensal:Number(m.mensal)||0, pessoas:m.pessoas||{}}; }
/* receita GANHA do mês corrente (opcionalmente só de uma pessoa) */
function receitaMes(userId){
  const hoje=todayISO(), ym=hoje.slice(0,7);

    .filter(p=>p.estado==='Ganha' && String(p.criada||'').slice(0,7)===ym)

}
/* projeção simples: ao ritmo de hoje, onde fecha o mês */

}

}

/* ================== PULSO · O ASSISTENTE DO CRM ==================
   O nome é de propósito o de uma ferramenta, e não o de uma pessoa: quase
   todos os chatbots se chamam Íris ou Sofia porque querem que se fale com
   eles como se fosse alguém - e aqui o objetivo é o contrário. "Tomar o
   pulso ao negócio" é o que ele faz: um número rápido sobre como as coisas
   estão, sem opinião nenhuma pelo meio.

   NÃO é inteligência artificial e não finge ser - a primeira coisa que diz é
   isso mesmo. É correspondência de palavras-chave para uma consulta fixa sobre
   o `state`. Fica assim de propósito, por três razões:

   1. É honesto. O artigo 50.º do AI Act obriga a dizer a quem interage que
      está a falar com uma máquina. Um assistente que se declarasse IA sem o
      ser ensinaria exatamente o contrário do que a formação diz.
   2. Funciona na sandbox de cada formando, sem chave, sem custo e offline.
   3. Quando não sabe, diz que não sabe - e é aí que se percebe que um
      assistente só chega onde os dados chegam.

   Ele NÃO altera nada: só responde e leva à vista certa. */

/* As sugestoes ocupavam cinco linhas e metade do painel. Ficam ABERTAS no
   inicio - que e quando ninguem sabe o que pode perguntar - e arrumam-se
   sozinhas assim que a pessoa faz a primeira pergunta, porque a partir dai
   o que interessa e ler a conversa. Voltam com um clique. */
let cbotSugAberto=true;

/* "as minhas propostas", "quanto vendi eu" - restringe ao utilizador atual */
const cbotMeu  = q => /(^| )(minha|minhas|meu|meus|eu)( |$)/.test(q);
const cbotMoney= v => money(v);

const cbotAbertas = () => (state.propostas||[]).filter(p=>!["Ganha","Perdida"].includes(p.estado));
function cbotFiltraResp(lista,q){ if(!cbotMeu(q)) return lista; const eu=cbotEu(); return eu?lista.filter(x=>x.responsavelId===eu):lista; }
function cbotNomeEmp(id){ const e=(state.empresas||[]).find(x=>x.id===id); return e?e.nome:""; }

/* ---- o que ele NAO soube responder ----
   Cada pergunta que cai no "nao sei" e a lista do que falta, escrita por quem
   usa em vez de adivinhada por quem programa. E, numa turma, e um sinal raro:
   o que se tenta perguntar e o que nao se percebeu. Se dez pessoas escreverem
   "como faco um orcamento", o problema nao esta no Pulso - esta em ninguem ter
   ligado "orcamento" a "proposta".

   Fica SO na sandbox (localStorage), como tudo o resto, e vai no retrato da
   entrega. Por isso e declarado a quem escreve - registar o que a pessoa
   escreve sem o dizer seria exatamente o contrario do que esta app ensina. */
const PULSO_LOG_MAX=120;
function pulsoRegista(q){
  const t=String(q||"").trim(); if(t.length<3) return;
  const chave=cbotNorm(t);
  const j=state.pulsoLog.findIndex(x=>cbotNorm(x.q)===chave);
  if(j>=0){ state.pulsoLog[j].n=(state.pulsoLog[j].n||1)+1; state.pulsoLog[j].data=todayISO(); }
  else { state.pulsoLog.unshift({q:t, n:1, data:todayISO(), onde:currentView()});
         if(state.pulsoLog.length>PULSO_LOG_MAX) state.pulsoLog.length=PULSO_LOG_MAX; }
  save();
}
/* usado na ficha de avaliação e no cartão das Definições */
function pulsoLogHTML(log,vazio){
  const l=(Array.isArray(log)?log:[]).slice().sort((a,b)=>(b.n||1)-(a.n||1));
  if(!l.length) return `<p class="muted" style="font-size:.84rem;margin:0">${esc(vazio)}</p>`;
  return `<div class="mini-list">${l.slice(0,25).map(x=>`<div class="mini-item">
    <span class="grow"><strong style="font-weight:600">${esc(x.q)}</strong>
      <span class="muted" style="font-size:.74rem">${dPT(x.data)}${x.onde?" · em "+esc(x.onde):""}</span></span>
    ${(x.n||1)>1?`<span class="pill amber">${x.n}×</span>`:""}</div>`).join("")}</div>`+
    (l.length>25?`<div class="muted" style="font-size:.76rem;margin-top:6px">… e mais ${l.length-25}</div>`:"");
}

/* ---- "como esta a X?" ----
   O salto de "quantos?" para "e este cliente, como esta?" - a pergunta que se
   faz mesmo, nos trinta segundos antes de uma chamada. Procura o nome da
   empresa dentro da frase e devolve a linha do tempo em tres linhas. */
/* "Silva & Filhos, Lda." escrito na conversa vem com &, virgulas e a forma
   juridica. Compara-se so por letras e numeros, dos dois lados. */
const pulsoChave = t => cbotNorm(t).replace(/[^a-z0-9]+/g," ").trim();
function pulsoEmpresa(q){
  const emps=state.empresas||[]; if(!emps.length) return null;
  const qc=" "+pulsoChave(q)+" ";
  const palavras=qc.trim().split(" ").filter(Boolean).length;
  /* 1. o nome inteiro na frase. O mais comprido ganha - "Nunes Hotelaria"
        antes de "Nunes", para nao responder sobre a empresa errada. */
  let achada=null, melhor=0;
  emps.forEach(e=>{ const nome=pulsoChave(dupEmpNome(e.nome));
    if(nome.length>=4 && qc.indexOf(" "+nome+" ")>=0 && nome.length>melhor){ melhor=nome.length; achada=e; } });
  if(achada) return achada;
  /* 2. so a primeira palavra ("a Silva ja pagou?"), e apenas se:
        - a frase for curta, senao um nome como "Email Lda" sequestrava
          "como faco um modelo de email";
        - nenhuma outra empresa comecar pela mesma palavra, senao respondia-se
          com confianca sobre a errada - que e o defeito que esta app ensina
          a nao ter. */
  if(palavras>5) return null;
  emps.forEach(e=>{ if(achada) return;
    const p1=(pulsoChave(dupEmpNome(e.nome)).split(" ")[0]||"");
    if(p1.length<4 || qc.indexOf(" "+p1+" ")<0) return;
    const ambigua=emps.filter(o=>(pulsoChave(dupEmpNome(o.nome)).split(" ")[0]||"")===p1).length>1;
    if(!ambigua) achada=e; });
  return achada;
}
function pulsoResumoEmpresa(e){
  const props=(state.propostas||[]).filter(p=>p.empresaId===e.id);
  const ganhas=props.filter(p=>p.estado==="Ganha");
  const abertas=props.filter(p=>!["Ganha","Perdida"].includes(p.estado));
  const valor=ganhas.reduce((t,p)=>t+propTotal(p),0);
  const pessoas=empContacts(e.id);
  const casos=(state.casos||[]).filter(c=>c.empresaId===e.id||pessoas.some(x=>x.id===c.clienteId)).filter(casoAberto);
  const ret=(state.retencoes||[]).filter(r=>r.empresaId===e.id&&!["Retido","Cancelado"].includes(r.estado));
  const ids=pessoas.map(x=>x.id);
  const semCons=pessoas.filter(c=>!(state.consentimentos||[]).some(x=>x.clienteId===c.id&&x.estado==="Ativo"));
  const ev=(typeof timelineEmpresa==="function")?timelineEmpresa(e.id):[];
  const ultimo=ev.find(x=>/Email|Caso|Proposta|Tarefa/.test(x.titulo));
  const resp=e.responsavelId?nomeMembro((equipaMembros()||[]).find(u=>u.id===e.responsavelId)||{}):"";

  const linhas=[];
  linhas.push("Fase "+(e.fase||"Lead")+" · "+(e.loyalty||"Bronze")+" · lead score "+empLeadScore(e)+(resp?" · "+resp:""));
  linhas.push(ganhas.length? ganhas.length+" proposta(s) ganha(s) · "+money(valor) : "Ainda sem propostas ganhas");
  if(abertas.length) linhas.push("Em aberto: "+abertas.map(p=>(p.numero||"")+" ("+money(propTotal(p))+", "+(p.estado||"")+")").join(", "));
  linhas.push(pessoas.length? pessoas.length+" contacto(s): "+pessoas.slice(0,3).map(c=>((c.nome||"")+" "+(c.apelido||"")).trim()).join(", ")+(pessoas.length>3?"…":"") : "Sem contactos registados");
  if(ultimo) linhas.push("Último movimento: "+ultimo.titulo+" · "+dPT(ultimo.data));

  /* o que interessa saber ANTES de ligar - e o que costuma correr mal */
  const avisos=[];
  if(casos.length) avisos.push(casos.length+" caso(s) de suporte por fechar");
  if(ret.length)   avisos.push("pedido de cancelamento em curso");
  if(semCons.length && ids.length) avisos.push(semCons.length+" contacto(s) sem consentimento ativo");

  return {t:"<strong>"+esc(e.nome)+"</strong>"+(e.numero?" · "+esc(e.numero):"")+"."+
      (avisos.length?"<br><br>⚠ Antes de ligar: <strong>"+esc(avisos.join(" · "))+"</strong>.":""),
    lista:linhas, ir:{h:"empresas",l:"Abrir a ficha"}};
}

   isso "pipeline" e "loyalty" nao entram como chave nua, mas "mrr" e "cac"
   entram, porque nao competem com nenhuma pergunta de dados. ================== */

/* Um formando escreve "como se CRIA", "como ADICIONO", "como EXPORTO" - e a
   lista de palavras-chave diz "criar", "adicionar", "exportar". Guardar as seis
   conjugacoes de cada verbo era interminavel, por isso corta-se a terminacao dos
   DOIS lados: sendo simetrico, nao inventa correspondencias, so tolera o verbo.
   E propositadamente grosseiro - "empresa" fica "empres" - mas como a chave
   sofre o mesmo corte, o resultado bate certo. */
const CBOT_FIM=["ando","endo","indo","aram","amos","ar","er","ir","ou","ei","am","em","es","as","os","a","e","o","s"];
function cbotRaiz(p){ if(p.length<4) return p;
  for(const f of CBOT_FIM){ if(p.length-f.length>=3 && p.endsWith(f)) return p.slice(0,-f.length); }
  return p; }
const cbotRaizes = t => cbotNorm(t).split(/[^a-z0-9]+/).filter(Boolean).map(cbotRaiz);

/* Palavras compridas valem mais: "motivos de perda" ganha a "perda" */
/* A MELHOR chave, nao a soma delas. Somar premiava as entradas com muitas
   chaves parecidas: "ver a equipa" (10) + "equipa" (6) davam 16 pontos a uma
   pergunta sobre PROPOSTAS que so por acaso dizia "equipa". Uma entrada vale o
   que vale a sua melhor correspondencia - nao o numero de sinonimos que eu me
   lembrei de escrever. */
function cbotScore(ks,q){ let n=0; const qr=cbotRaizes(q); const qs=" "+qr.join(" ")+" ";
  ks.forEach(k=>{ const kk=cbotNorm(k);
    /* 1. a frase tal e qual - o sinal mais forte */
    const curto = kk.length<=4;
    if(curto ? new RegExp("(^|[^a-z0-9])"+kk+"([^a-z0-9]|$)").test(q) : q.indexOf(kk)>=0){ n=Math.max(n,kk.length); return; }
    /* 2. as raizes todas presentes, por qualquer ordem - vale um pouco menos,
          para nunca ganhar a uma frase que bata exatamente */
    const kr=cbotRaizes(k).filter(w=>w.length>=3);
    /* uma chave de uma so palavra tambem conta pela raiz, desde que seja
       comprida - assim "agendar" apanha "agendo", sem que "sla" ou "ia"
       apanhem meia app */
    if(kr.length===1 && kr[0].length>=5 && qs.indexOf(" "+kr[0]+" ")>=0){ n=Math.max(n,Math.round(kk.length*0.8)); return; }
    if(kr.length>=2 && kr.every(w=>qs.indexOf(" "+w+" ")>=0)) n=Math.max(n,Math.round(kk.length*0.8)); });
  return n; }

/* Todas as entradas num sítio só - para pontuar, e para saber o que existe */
function cbotTodas(){
  return CBOT_META.map(x=>Object.assign({},x))
    .concat(CBOT.filter(i=>can(i.mod)))
    .concat(CBOT_NUM2.filter(i=>!i.mod||can(i.mod)))
    .concat(CBOT_AJUDA.concat(CBOT_AJUDA2,CBOT_AJUDA3,CBOT_AJUDA4).filter(i=>!i.mod||can(i.mod)).map(i=>Object.assign({ajuda:1},i)))
    .concat(CBOT_GLOS);
}
/* Rótulo legível de uma entrada, para a mostrar como sugestão.
   As chaves foram escritas como as pessoas escrevem, por isso a mais comprida
   costuma ser a frase mais natural. */
function cbotRotulo(i){
  if(i.rot) return i.rot;
  const k=(i.k||[]).slice().sort((a,b)=>b.length-a.length)[0]||"";
  const f=k.charAt(0).toUpperCase()+k.slice(1);
  return f+(/^(como|onde|quem|quanto|quantas|quantos|porque|o que|qual)/i.test(k)?"?":"");
}

/* ---------- Fall-forward ----------
   A pesquisa de design de chatbots e unanime nisto: um "nao sei" seco deixa a
   pessoa no mesmo sitio onde estava. O que funciona chama-se fall-forward -
   em vez de recuar, mostrar as opcoes MAIS PROXIMAS do que se escreveu.

   Aqui isso da-se de graca: o motor ja pontua todas as entradas, so nao estava
   a aproveitar as que ficaram por baixo do limiar. */
function cbotProximas(q, excluir, n){
  return cbotTodas()
    .map(i=>({i, p:cbotScore(i.k,q)}))
    .filter(x=>x.p>0 && x.i!==excluir)
    .sort((a,b)=>b.p-a.p)
    .slice(0, n||3)
    .map(x=>cbotRotulo(x.i));
}
function cbotChipsHTML(l, titulo){
  if(!l||!l.length) return "";
  return `<div class="cbot-perto"><span class="cbot-perto-t">${esc(titulo)}</span>`+
    l.map(x=>`<button class="cbot-chip" data-act="cbot-chip">${esc(x)}</button>`).join("")+`</div>`;
}
function cbotResponde(txt){
  const q=cbotNorm(txt);
  let melhor=null, pts=0;
  CBOT_META.forEach(i=>{ const p=cbotScore(i.k,q); if(p>pts){pts=p;melhor=i;} });
  CBOT.forEach(i=>{ if(!can(i.mod)) return; const p=cbotScore(i.k,q); if(p>pts){pts=p;melhor=i;} });
  /* CBOT ja foi percorrido acima - aqui so a segunda leva de numeros */
  CBOT_NUM2.forEach(i=>{ if(i.mod&&!can(i.mod)) return; const p=cbotScore(i.k,q); if(p>pts){pts=p;melhor=i;} });
  CBOT_AJUDA.concat(CBOT_AJUDA2,CBOT_AJUDA3,CBOT_AJUDA4).forEach(i=>{ if(i.mod&&!can(i.mod)) return; const p=cbotScore(i.k,q); if(p>pts){pts=p;melhor=Object.assign({ajuda:1},i);} });
  /* o glossario nao depende de modulo nenhum: um termo explica-se sempre */
  CBOT_GLOS.forEach(i=>{ const p=cbotScore(i.k,q); if(p>pts){pts=p;melhor=i;} });
  /* nome de empresa na frase: ganha a tudo o resto, porque é sempre mais
     específico do que uma pergunta genérica */
  if(can("empresas") && !(melhor&&melhor.ajuda&&pts>=12)){ const e=pulsoEmpresa(q); if(e) return pulsoResumoEmpresa(e); }
  /* LIMIAR DE CONFIANCA
     Antes, qualquer pontuacao acima de zero ganhava. Resultado: "quero ver as
     propostas do mes passado da equipa comercial" respondia sobre GRUPOS DE
     UTILIZADORES - porque a palavra "equipa" batia. Responder com confianca a
     partir de uma coincidencia fraca e exatamente o defeito que este
     assistente existe para nao ter.

     Um limiar absoluto nao chega, porque a pontuacao cresce com o tamanho da
     chave. O que separa mesmo e a COBERTURA: quanto da pergunta e que a chave
     explica. "equipa" dentro de uma frase de 57 caracteres explica 10% dela -
     nao e uma resposta, e uma coincidencia. */
  const qLen=Math.max(1,q.trim().length);
  const cobertura=pts/qLen;
  const convence = cobertura>=0.9        /* a chave e praticamente a pergunta */
                || pts>=18               /* frase longa a bater exatamente */
                || (pts>=5 && cobertura>=0.22);
  if(melhor && !convence){ melhor=null; }
  if(!melhor){
    pulsoRegista(txt);
    const perto=cbotProximas(q,null,3);
    /* Antes, o manual só era oferecido a quem escrevesse "como/onde/posso".
       Era uma subtileza minha que não servia a ninguém: quem pergunta uma
       coisa e leva um "não sei" seco fecha a janela. Agora o manual vai
       SEMPRE - dizer "não sei, mas está aqui" nunca está errado. */
    return {t:"Não sei responder a isso - só reconheço as frases para que fui programado."+
        (perto.length?"<br><br>Quis dizer alguma destas?":"<br><br>Mas o <strong>manual</strong> tem tudo, em português e inglês, com vídeos.")+
        "<br><br><span class=\"muted\" style=\"font-size:.76rem\">A sua pergunta ficou registada, para o formador saber o que falta.</span>",
      perto, doc:"", naoSei:true};
  }
  if(!melhor.f){
    /* depois de explicar um termo, o passo seguinte costuma ser ver o número.
       "O que é o MRR" → "qual o valor do meu pipeline". */
    if(melhor.glos) return Object.assign({},melhor,{perto:cbotProximas(melhor.termo||q,melhor,2)});
    return melhor;   /* as de ajuda são texto fixo */
  }
  try{ return Object.assign({ajuda:melhor.ajuda},melhor.f(q)); }
  catch(e){ return {t:"Encontrei a pergunta mas falhei a ir buscar os dados. Veja o módulo diretamente."}; }
}

/* ================== LINHA DO TEMPO DA CONTA ==================
   A ficha 360 mostrava secções separadas: contactos aqui, propostas ali,
   consentimentos mais abaixo. Para preparar uma chamada é preciso a ordem
   dos acontecimentos, não a arrumação por tipo. Isto junta tudo o que se
   passou com a conta numa só coluna, do mais recente para o mais antigo. */
function timelineEmpresa(empId){
  const ev=[]; const emp=(state.empresas||[]).find(x=>x.id===empId); if(!emp) return ev;
  const ids=empContacts(empId).map(c=>c.id);
  const nomeC=id=>{ const c=getC(id); return c?((c.nome||"")+" "+(c.apelido||"")).trim():""; };
  const add=(data,icone,cor,titulo,sub)=>{ if(!data) return; ev.push({data:String(data).slice(0,10),icone,cor,titulo,sub:sub||""}); };

  add(emp.criado,"building","#64748b","Conta criada",emp.nome);
  /* mudanças de fase que a app foi registando */
  (emp.historicoFases||[]).forEach(h=>add(h.data,"trend","#7c3aed","Fase: "+(h.de||"-")+" → "+(h.para||"-"),""));

  empContacts(empId).forEach(c=>add(c.criado,"users","#0891b2","Contacto adicionado",nomeC(c.id)+(c.cargo?" · "+c.cargo:"")));

  (state.propostas||[]).filter(p=>p.empresaId===empId).forEach(p=>{
    add(p.criada,"doc","#00A651","Proposta "+(p.numero||""),(p.titulo||"")+" · "+money(propTotal(p)));
    if(p.estado==="Ganha")   add(p.alteradoEm||p.criada,"check","#00A651","Proposta ganha",(p.numero||"")+" · "+money(propTotal(p))+(p.motivoGanho?" · "+motivoTxt(p.motivoGanho,p.motivoGanhoNota):""));
    if(p.estado==="Perdida") add(p.alteradoEm||p.criada,"alert","#dc2626","Proposta perdida",(p.numero||"")+(p.motivoPerda?" · "+motivoTxt(p.motivoPerda,p.motivoPerdaNota):""));
  });

  (state.envios||[]).filter(x=>ids.includes(x.clienteId)).forEach(x=>{
    add(x.data,"mail","#2563eb","Email enviado",(x.assunto||"")+" → "+nomeC(x.clienteId)+(x.aberto?" · aberto":"")+(x.clicado?" · clicado":""));
  });

  (state.casos||[]).filter(c=>c.empresaId===empId||ids.includes(c.clienteId)).forEach(c=>{
    add(c.aberto||c.data,"support","#d97706","Caso "+(c.numero||""),(c.assunto||"")+" · "+(c.estado||""));
    if(c.csat!=null&&c.csat!=="") add(c.fechado||c.aberto,"star","#00A651","Satisfação registada","CSAT "+c.csat+(c.nps!=null&&c.nps!==""?" · NPS "+c.nps:""));
  });

  (state.consentimentos||[]).filter(c=>ids.includes(c.clienteId)).forEach(c=>{
    add(c.data,"shield",c.estado==="Ativo"?"#00A651":"#dc2626",
      c.estado==="Ativo"?"Consentimento dado":"Consentimento retirado",
      (c.finalidade||"")+" · "+(c.base||"")+" · "+nomeC(c.clienteId));
  });
  (state.pedidos||[]).filter(p=>ids.includes(p.clienteId)).forEach(p=>
    add(p.data,"shield","#7c3aed","Pedido de titular: "+(p.tipo||""),nomeC(p.clienteId)+" · "+(p.estado||"")));

  (state.retencoes||[]).filter(r=>r.empresaId===empId||ids.includes(r.clienteId)).forEach(r=>
    add(r.aberto||r.data,"heart","#dc2626","Pedido de cancelamento",(r.artigo||"")+" · "+(r.estado||"")));

  (state.tarefas||[]).filter(t=>ids.includes(t.clienteId)).forEach(t=>
    add(t.data,"calendar",t.estado==="Concluída"?"#00A651":"#64748b",
      (t.estado==="Concluída"?"Tarefa concluída":"Tarefa agendada"),(t.titulo||"")+(t.hora?" · "+t.hora:"")));

  return ev.sort((a,b)=>b.data.localeCompare(a.data));
}
function timelineHTML(empId,limite){

  if(!ev.length) return "";

}

function motivoTxt(m,nota){ const v=String(m||'').trim(), d=String(nota||'').trim(); return (v==='Outro'&&d)?d:v; }
/* ================== CÓPIA DE SEGURANÇA DO TRABALHO ==================
   O trabalho de cada formando vivia num único sítio: o localStorage daquele
   navegador, naquele computador. Isso desaparece com outro computador, outro
   navegador, uma janela anónima ou um "limpar dados de navegação" - e nenhuma
   dessas coisas é erro de quem trabalha. Não havia aviso, cópia nem forma de
   voltar atrás: semanas de trabalho, sem rede por baixo.

   A peça difícil já estava provada - a submissão manda o estado inteiro para o
   Supabase. Isto é o mesmo, sem email e sem gastar nenhuma das entregas.

   Guarda-se com atraso de propósito: ninguém precisa de uma cópia por cada
   tecla. Um minuto depois da última alteração, e sempre que se fecha o
   separador (que é justamente quando as pessoas perdem coisas). ================== */
let rascunhoUltimo=0, rascunhoTimer=null, rascunhoAssinatura="", rascunhoEm=null, rascunhoAviso=false;
const RASCUNHO_ATRASO=60000;   /* 1 min depois de parar de mexer */

async function supaGuardarRascunho(){ return await supaRpc("guardar_rascunho",{p_token:supaToken(),p_payload:state}); }
async function supaTenhoRascunho(){  return await supaRpc("tenho_rascunho",{p_token:supaToken()}); }
async function supaObterRascunho(){  return await supaRpc("obter_rascunho",{p_token:supaToken()}); }

function rascunhoLigado(){ return !!(TURMA && supaToken()); }
/* assinatura barata do estado, para não enviar cópias iguais */
function rascunhoSig(){ try{ const s=JSON.stringify(state); return s.length+":"+s.charCodeAt(Math.floor(s.length/2))+":"+s.charCodeAt(s.length-1); }catch(e){ return String(Date.now()); } }

function rascunhoGuardar(motivo){
  if(!rascunhoLigado()) return Promise.resolve(false);
  const sig=rascunhoSig();
  if(sig===rascunhoAssinatura) return Promise.resolve(false);   /* nada mudou */
  return supaGuardarRascunho().then(r=>{
    rascunhoAssinatura=sig; rascunhoUltimo=Date.now(); rascunhoEm=(r&&r.em)||new Date().toISOString();
    const el=$("#rascEstado"); if(el) el.innerHTML=rascunhoEstadoHTML();
    return true;
  }).catch(e=>{
    /* falhar em silêncio seria repetir o erro que isto veio corrigir */
    if(!rascunhoAviso){ rascunhoAviso=true;
      toast("Cópia de segurança falhou", supaMsg(e)+" - o trabalho continua neste navegador, mas exporte-o por precaução","warn"); }
    return false; });
}
/* chamado a cada save(): reagenda, não envia */
function rascunhoAgenda(){
  if(!rascunhoLigado()) return;
  if(rascunhoTimer) clearTimeout(rascunhoTimer);
  rascunhoTimer=setTimeout(()=>rascunhoGuardar("periodico"), RASCUNHO_ATRASO);
}
/* fechar o separador é quando as pessoas perdem coisas: envia já */
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") rascunhoGuardar("saida"); });
window.addEventListener("pagehide",()=>{ rascunhoGuardar("saida"); });

function rascunhoEstadoHTML(){
  if(!rascunhoLigado()) return `<span class="muted">Sem ligação à turma - a cópia no servidor não se aplica.</span>`;
  if(!rascunhoEm) return `<span class="muted">Ainda sem cópia nesta sessão.</span>`;
  const d=new Date(rascunhoEm);
  return `${ic("check",14)} Última cópia: <strong>${dPT(rascunhoEm.slice(0,10))} às ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}</strong>`;
}

/* ---------- Recuperar ----------
   Só se oferece quando FAZ SENTIDO: sandbox praticamente por estrear e cópia no
   servidor. Perguntar a quem está a trabalhar bem seria assustar sem motivo. */
function sandboxPorEstrear(){
  const n=(state.empresas||[]).filter(ehProprio).length
         +(state.clientes||[]).filter(ehProprio).length
         +(state.propostas||[]).filter(ehProprio).length
         +(state.produtos||[]).filter(ehProprio).length;
  return n===0;
}
async function rascunhoOferecer(){
  if(!rascunhoLigado()) return;
  try{
    const r=await supaTenhoRascunho();
    if(!r||!r.existe) return;
    rascunhoEm=r.em;
    if(!sandboxPorEstrear()) return;   /* já há trabalho aqui: não mexer */
    const d=new Date(r.em);
    const quando=dPT(String(r.em).slice(0,10))+" às "+pad(d.getHours(),2)+":"+pad(d.getMinutes(),2);
    const sim=await uiConfirm(
      "Este navegador está sem trabalho seu, mas há uma cópia guardada no servidor de <strong>"+esc(quando)+"</strong>.<br><br>Isto acontece quando se muda de computador ou de navegador, ou quando se limpam os dados de navegação. <strong>Recuperar?</strong>",
      {title:"Encontrámos o seu trabalho", okText:"Recuperar", icon:"rotate", html:true});
    if(!sim) return;
    await rascunhoRepor();
  }catch(e){ /* sem cópia, ou sem ligação: segue-se em silêncio */ }
}
async function rascunhoRepor(){
  try{
    const r=await supaObterRascunho();
    if(!r||!r.payload) { toast("Sem cópia","Não há nenhuma cópia guardada para si","warn"); return; }
    const u=currentUser();
    /* escreve-se e volta a carregar: load() é que corre as migrações todas,
       e não existe um normalize() separado para chamar */
    localStorage.setItem(storeKey(), JSON.stringify(r.payload));
    load();
    if(u) ingestSupaUser({id:u.id,nome:u.nome,apelido:u.apelido,email:u.email,username:u.username,papel:u.papel});
    save(); render(); perfilDoServidor();
    rascunhoAssinatura=rascunhoSig();
    toast("Trabalho recuperado","Cópia de "+dPT(String(r.em).slice(0,10))+" reposta neste navegador");
  }catch(e){ toast("Não foi possível recuperar",supaMsg(e),"err"); }
}

/* ================== O QUE HÁ PARA FAZER HOJE ==================
   O hero dizia "Plataforma pedagógica de gestão de relação com clientes..." -
   uma descrição que ninguém lê duas vezes. Passa a dizer o que está à espera:
   os números que já existem, cada um clicável para o sítio respetivo.

   Um painel que só descreve é um cartaz. Um painel que aponta é um ponto de
   partida. ================== */
function trabalhoDeHoje(){
  const hoje=todayISO(); const it=[];
  const add=(n,sing,plur,hash,urgente)=>{ if(n>0) it.push({n,t:n===1?sing:plur,h:hash,u:!!urgente}); };

  if(can("clientes")) add((typeof leadsPorAtender==="function"?leadsPorAtender():[]).length,
    "subscrição por atender","subscrições por atender","clientes",true);

  if(can("agenda")){
    const t=(state.tarefas||[]).filter(x=>x.estado!=="Concluída");
    add(t.filter(x=>x.data&&x.data<hoje).length,"tarefa em atraso","tarefas em atraso","agenda",true);
    add(t.filter(x=>x.data===hoje).length,"tarefa para hoje","tarefas para hoje","agenda");
  }
  if(can("propostas")) add((state.propostas||[]).filter(p=>p.validade&&!["Ganha","Perdida"].includes(p.estado)
    &&daysBetween(hoje,p.validade)>=0&&daysBetween(hoje,p.validade)<=7).length,
    "proposta a expirar","propostas a expirar","propostas",true);

  if(can("casos")) add((state.casos||[]).filter(c=>casoAberto(c)&&casoSla(c).estado==="violado").length,
    "caso fora do prazo","casos fora do prazo","casos",true);

  if(can("rgpd")) add((state.pedidos||[]).filter(p=>p.estado!=="Concluído"&&p.prazo&&p.prazo<hoje).length,
    "pedido RGPD fora de prazo","pedidos RGPD fora de prazo","rgpd",true);

  return it;
}
function linhaDeHoje(){
  const u=currentUser(); const nome=(u&&(u.nome||"").trim().split(/\s+/)[0])||"";
  const it=trabalhoDeHoje();
  /* o titulo ao lado ja diz "Bem-vindo": repetir a saudacao aqui
     ficava a dizer bem-vindo duas vezes na mesma linha */
  const ola=nome?("<strong>"+esc(nome)+"</strong>, hoje tem "):"Hoje tem ";
  if(!it.length) return `<p class="hoje">${nome?"<strong>"+esc(nome)+"</strong>, nada":"Nada"} urgente hoje - bom dia para prospetar.</p>`;
  const peca=x=>`<a href="#${x.h}" class="hoje-n${x.u?" urg":""}">${x.n} ${esc(x.t)}</a>`;
  const partes=it.map(peca);
  const lista=partes.length===1?partes[0]
    :partes.slice(0,-1).join(", ")+" e "+partes[partes.length-1];
  return `<p class="hoje">${ola}${lista}.</p>`;
}

/* ---------- A leitura do gráfico da receita ----------
   O gráfico mostra; esta frase conclui. É a diferença entre ter dados e ter

/* o grafico usa abreviaturas; numa frase lem-se mal */

function leituraReceita(dados){
  const com=(dados||[]).filter(d=>d.v>0);
  if(com.length<2) return "";   /* com um mês só não há comparação a fazer */
  const melhor=com.slice().sort((a,b)=>b.v-a.v)[0];
  const atual=dados[dados.length-1];
  const pc=melhor.v?Math.round(atual.v/melhor.v*100):0;
  const hoje=todayISO(); const [y,m]=hoje.split("-").map(Number);
  const faltam=new Date(y,m,0).getDate()-(+hoje.slice(8,10));
  const igual=atual.l===melhor.l;
  return `<div class="callout ${igual?"green":"info"}" style="margin-top:12px">${ic(igual?"trend":"bulb",16)}<div class="ctxt">

     : atual.v===0 ? ` Em ${esc(mesLongo(atual.l))} ainda não há receita registada${faltam>0?`, e faltam ${faltam} dia(s)`:""}.`

}

function leadScore(c){
  let s=0; const props=state.propostas.filter(p=>p.clienteId===c.id&&!p.empresaId);
  if(props.some(p=>p.estado==='Ganha')) s+=35;
  s+=Math.min(20,props.length*7);
  const env=state.envios.filter(e=>e.clienteId===c.id);
  if(env.some(e=>e.clicado)) s+=20; else if(env.some(e=>e.aberto)) s+=10;
  s+= c.loyalty==='Ouro'?20:c.loyalty==='Prata'?10:3;
  s+= 4; // particular: sem dimensão de empresa
  return Math.min(100,Math.round(s));
}

function empLeadScore(e){
  if(!e) return 0; let s=0;
  const props=empProps(e.id);
  if(props.some(p=>p.estado==='Ganha')) s+=35;
  s+=Math.min(20,props.length*7);
  const ids=empContacts(e.id).map(c=>c.id);
  const env=state.envios.filter(x=>ids.includes(x.clienteId));
  if(env.some(x=>x.clicado)) s+=20; else if(env.some(x=>x.aberto)) s+=10;
  s+= e.loyalty==='Ouro'?20:e.loyalty==='Prata'?10:3;
  s+= e.dimensao==='Grande Empresa'?10:e.dimensao==='PME'?5:2;
  return Math.min(100,Math.round(s));
}

views.rgpd = () => {

  const fped=act?state.pedidos.filter(p=>inDateRange(p.data,rg.from,rg.to)):state.pedidos;

  ${dateBar('rg', act?`${fcons.length} consentimentos · ${fped.length} pedidos · ${fviol.length} violações`:'')}
  <div class="grid cols-4">
    ${kpi('Consentimentos ativos '+infoTip('consentimento'), fmtN(ativos), {icon:'check', sub:act?'no período':'', act:'rgpd-kpi', f:'ativos', on:state._rgpdFiltro==='ativos', title:'Ver os consentimentos ativos'})}
    ${kpi('Pedidos abertos '+infoTip('titular'), fmtN(abertos), {icon:'bell', sub:'titulares', act:'rgpd-kpi', f:'abertos', on:state._rgpdFiltro==='abertos', title:'Ver os pedidos por responder'})}
    ${kpi('Pedidos fora de prazo', fmtN(atrasados), {icon:'alert', dir:atrasados>0?'down':'flat', delta:atrasados>0?'urgente':'em dia', act:'rgpd-kpi', f:'atrasados', on:state._rgpdFiltro==='atrasados', title:'Ver os pedidos fora do prazo de 1 mês'})}
    ${kpi('Violações registadas '+infoTip('violacao'), fmtN(fviol.length), {icon:'shield', sub:'CNPD', act:'rgpd-kpi', f:'violacoes', on:state._rgpdTab==='violacoes'&&!state._rgpdFiltro, title:'Ver as violações de dados'})}

  </div>

/* O que cada separador do RGPD precisa. Numa função à parte para que filtrar
   ou trocar de separador troque SÓ a tabela, sem redesenhar a página. */
/* Troca só a caixa do separador, os separadores e as molduras dos KPIs.
   render() redesenhava a página inteira e piscava. */
function rgpdRefresca(){
  const box=$('#rgpdBox'); if(!box){ render(); return; }
  box.innerHTML=rgpdBoxHTML();
  $$('[data-rgpdtab]').forEach(t=>t.classList.toggle('active', t.dataset.rgpdtab===(state._rgpdTab||'consent')));
  $$('.kpi[data-f]').forEach(k=>{ const f=k.dataset.f;
    const on = f==='violacoes' ? (state._rgpdTab==='violacoes'&&!state._rgpdFiltro) : (state._rgpdFiltro===f);
    k.classList.toggle("kpi-on", !!on); });
}
function rgpdCtx(){
  const rg=rangeOf('rg'); const act=!!(rg.from||rg.to);
  return {act,
    fcons: act?state.consentimentos.filter(c=>inDateRange(c.data,rg.from,rg.to)):state.consentimentos,
    fped:  act?state.pedidos.filter(p=>inDateRange(p.data,rg.from,rg.to)):state.pedidos,
    fviol: act?state.violacoes.filter(v=>inDateRange(v.data,rg.from,rg.to)):state.violacoes};
}
/* Filtro vindo de um KPI: estreita a lista do separador. */
function rgpdAplicaFiltro(ctx){
  const f=state._rgpdFiltro;
  if(!f) return ctx;
  const o=Object.assign({},ctx);
  if(f==='ativos')    o.fcons=o.fcons.filter(c=>c.estado==='Ativo');
  if(f==='abertos')   o.fped =o.fped.filter(p=>p.estado!=='Concluído');
  if(f==='atrasados') o.fped =o.fped.filter(p=>p.estado!=='Concluído'&&daysBetween(todayISO(),p.prazo)<0);
  o.filtro=f;
  return o;
}
const RGPD_FILTRO_ROT={ativos:'só os ativos',abertos:'só os abertos',atrasados:'só os que estão fora de prazo'};
function rgpdBoxHTML(){
  const tab=state._rgpdTab||'consent';
  const ctx=rgpdAplicaFiltro(rgpdCtx());
  const aviso=ctx.filtro?`<div class="callout info" style="margin:0 0 12px">${ic('info',16)}<div class="ctxt" style="flex:1">A mostrar <strong>${esc(RGPD_FILTRO_ROT[ctx.filtro]||ctx.filtro)}</strong>.</div><button class="btn-sec btn-xs" data-act="rgpd-kpi" data-f="">Limpar filtro</button></div>`:'';
  return aviso+rgpdTab(tab, ctx);
}

    </tbody></table></div>`;
  if(tab==='ropa') return `
    <div class="section-head" style="margin-bottom:14px"><div><h3>Registo de Atividades de Tratamento (RoPA) ${infoTip('ropa')}</h3><div class="sub">Art. 30.º RGPD - documento que demonstra o cumprimento (responsabilização).</div></div><button class="btn" data-act="new" data-type="ropa">+ Atividade</button></div>
    <div class="grid" style="gap:14px">${state.ropa.map(r=>`<div class="card card-pad" style="box-shadow:none;border-color:var(--border)"><div class="section-head" style="margin-bottom:10px"><div><h3 style="font-size:.98rem">${esc(r.atividade)}</h3><div class="sub">${esc(r.finalidade)}</div></div><div class="row-actions"><button class="btn-sec btn-xs" data-act="edit" data-type="ropa" data-id="${r.id}">Editar</button><button class="btn-danger btn-xs" data-act="delete" data-type="ropa" data-id="${r.id}">✕</button></div></div><dl class="kv" style="grid-template-columns:auto 1fr;gap:6px 14px"><dt>Titulares</dt><dd style="text-align:left">${esc(r.titulares)}</dd><dt>Categorias</dt><dd style="text-align:left">${esc(r.categorias)}</dd><dt>Base legal</dt><dd style="text-align:left"><span class="chip">${esc(r.base)}</span></dd><dt>Conservação</dt><dd style="text-align:left">${esc(r.conservacao)}</dd><dt>Destinatários</dt><dd style="text-align:left">${esc(r.destinatarios)}</dd><dt>Segurança</dt><dd style="text-align:left">${esc(r.seguranca)}</dd></dl></div>`).join('')||empty('Sem atividades registadas')}</div>`;

    'Rever contratos com subcontratantes',
    'Procedimento de resposta a pedidos de titulares (1 mês)',
    'Plano de notificação de violações (72h à CNPD)',
    'Designar Encarregado de Proteção de Dados (EPD) quando aplicável',
    'Privacidade desde a conceção (by design) e por defeito',
  ];
  const gloss=[
    ['Dados pessoais','Qualquer informação relativa a uma pessoa singular identificada ou identificável.','10870 · slide 81'],
    ['Titular dos dados','A pessoa singular a quem os dados pessoais dizem respeito. Cada um de nós é proprietário dos seus dados.','10870 · slide 81'],
    ['Responsável pelo tratamento','Entidade que determina as finalidades e os meios do tratamento. Responde pelo cumprimento das regras.','10870 · slide 88'],

    const t=state.templates.find(x=>x.id===p.templateId);

/* Critério de saída: quando o lead reage, deixa de fazer sentido continuar a
   insistir. Cancela os passos ainda agendados dessa automação para aquele contacto. */
function aplicarSaida(evento,clienteId){
  if(!evento||!clienteId) return 0;
  const alvo=(state.automacoes||[]).filter(a=>a.saida===evento).map(a=>a.id);
  if(!alvo.length) return 0;
  const antes=(state.agendamentos||[]).length;
  state.agendamentos=(state.agendamentos||[]).filter(g=>!(g.clienteId===clienteId&&alvo.includes(g.automacaoId)));
  const n=antes-state.agendamentos.length;
  if(n){ save(); toast('Sequência interrompida',n+' passo(s) cancelado(s) - o cliente já reagiu','info'); }
  return n;
}
function fireAutomations(trigger, ctx){
  aplicarSaida(trigger, ctx.clienteId);     // o cliente reagiu → parar sequências à espera
  let fired=0, immediate=0, agendados=0; const cli=getC(ctx.clienteId);
  // condições avaliam a CONTA do contacto (empresa, ou o particular)
  (state.automacoes||[]).filter(a=>a.estado==='Ativa'&&a.trigger===trigger).forEach(a=>{
    if(a.condSegmento && a.condSegmento!=='Todos' && (!cli || !accMatchSeg(cli,a.condSegmento))) return;
    if(a.condFase && (!cli || accFaseOf(cli)!==a.condFase)) return;
    if(a.condNivel && !loyaltyTriggers.includes(trigger) && (!cli || !accMatchNivel(cli,a.condNivel))) return;   // nível atual da conta
    if(a.condScore && (!cli || scoreInfo(accScoreOf(cli)).l!==a.condScore)) return;
    if(a.condNivel && ctx.loyaltyPara && ctx.loyaltyPara!==a.condNivel) return;   // só para este nível de fidelização
    (a.passos||[]).forEach((p,idx)=>{
      const tipo=p.tipo||'email';
      if(tipo==='email'&&!p.templateId) return;
      if((+p.atrasoDias||0)<=0){ const r=executarPasso(p,ctx,a); if(r){ immediate++; autoLog(a,ctx.clienteId,trigger,r); } }
      else { scheduleSend({dataAgendada:addDays(todayISO(),+p.atrasoDias), clienteId:ctx.clienteId, tipo, templateId:p.templateId, fase:p.fase, texto:p.texto,
          propostaId:(trigger!=='novo-cliente'&&ctx.proposta)?ctx.proposta.id:null, automacaoId:a.id, nome:a.nome+' (passo '+(idx+1)+')'}); agendados++; }
    });
    a.disparos=(a.disparos||0)+1; fired++;
  });
  if(fired){ save(); toast('Automação',`${immediate} enviado(s)${agendados?` · ${agendados} agendado(s)`:''}`,'info'); }
  return fired;
}
/* Dispara as automações de fidelização. Corre fora do recalcLoyalty (via setTimeout)
   porque enviar um email volta a gravar o estado e chamaria o recalc outra vez. */
let _loyaltyBusy=false;
function dispararLoyalty(mudancas){
  if(_loyaltyBusy) return; _loyaltyBusy=true;
  try{
    (mudancas||[]).forEach(m=>{
      const alvo=empContacts(m.empresa.id)[0]; if(!alvo) return;   // sem ninguém a quem escrever
      const trig=m.subiu?'loyalty-subiu':'loyalty-desceu';
      fireAutomations(trig,{clienteId:alvo.id, loyaltyDe:m.de, loyaltyPara:m.para});
    });
  } finally { _loyaltyBusy=false; }
}
function scheduleSend(o){ state.agendamentos.push({id:uid('ag'),dataAgendada:o.dataAgendada,clienteId:o.clienteId,tipo:o.tipo||'email',templateId:o.templateId,fase:o.fase||null,texto:o.texto||null,propostaId:o.propostaId||null,automacaoId:o.automacaoId||null,nome:o.nome||'Agendado'}); }
// avança a fase da conta (só para a frente; nunca mexe em Perdido)
function advanceFase(acc, to){ if(!acc) return false; if((acc.fase||'Lead')==='Perdido') return false; const order=['Lead','MQL','SQL','Cliente']; const cur=order.indexOf(acc.fase||'Lead'), tgt=order.indexOf(to); if(tgt>cur){ acc.fase=to; return true; } return false; }
// gatilho comportamental: a EMPRESA (conta) fica "Quente" (score ≥ 70) - dispara UMA vez; engagement move Lead→MQL
function maybeLeadQuente(clienteId){ const c=getC(clienteId); if(!c) return; const emp=accEmpOf(c); if(!emp) return; // contacto sem empresa = não é conta
  advanceFase(emp,'MQL'); // uma pessoa da empresa demonstrou interesse
  const q=empLeadScore(emp)>=70;
  if(q&&!emp._quenteFired){ emp._quenteFired=true; save(); fireAutomations('lead-quente',{clienteId}); }
  else { if(!q&&emp._quenteFired) emp._quenteFired=false; save(); } }
// gatilho comportamental: EMPRESAS sem contacto há N dias (corre no processamento diário)
function runSemContacto(){ const autos=(state.automacoes||[]).filter(a=>a.estado==='Ativa'&&a.trigger==='sem-contacto'); if(!autos.length) return 0; let n=0;
  (state.empresas||[]).forEach(e=>{ if(e._scFired) return; if(['Cliente','Perdido'].includes(e.fase||'Lead')) return; const contacts=empContacts(e.id); const rep=contacts[0]; if(!rep) return;
    const ids=contacts.map(x=>x.id); const envs=state.envios.filter(x=>ids.includes(x.clienteId)); const last=envs.length?envs.map(x=>x.data).sort().pop():e.criado; const dias=last?daysBetween(last,todayISO()):9999; const score=empLeadScore(e);
    for(const a of autos){ if(a.condSegmento&&a.condSegmento!=='Todos'&&!accMatchSeg(rep,a.condSegmento)) continue; if(a.condFase&&(e.fase||'Lead')!==a.condFase) continue; if(a.condScore&&scoreInfo(score).l!==a.condScore) continue;
      if(dias>=(+a.condDias||7)){ e._scFired=true; fireAutomations('sem-contacto',{clienteId:rep.id}); n++; break; } } });
  if(n) save(); return n; }
function processAgendamentos(){
  const today=todayISO(); const due=(state.agendamentos||[]).filter(a=>a.dataAgendada<=today); let n=0;
  due.forEach(ag=>{ const prop=ag.propostaId?state.propostas.find(p=>p.id===ag.propostaId):null;
    const au=(state.automacoes||[]).find(x=>x.id===ag.automacaoId)||{id:ag.automacaoId,nome:ag.nome||'Agendado',trigger:''};
    const r=executarPasso({tipo:ag.tipo||'email',templateId:ag.templateId,fase:ag.fase,texto:ag.texto,atrasoDias:0},{clienteId:ag.clienteId,proposta:prop},au,0);
    if(r) autoLog(au,ag.clienteId,'agendado',r);
    n++; });
  if(n){ state.agendamentos=state.agendamentos.filter(a=>a.dataAgendada>today); save(); }
  n+=runSemContacto();
  return n;
}
function sendAgendamentoNow(id){
  const a=state.agendamentos.find(x=>x.id===id); if(!a) return;
  const prop=a.propostaId?state.propostas.find(p=>p.id===a.propostaId):null;
  const au=(state.automacoes||[]).find(x=>x.id===a.automacaoId)||{id:a.automacaoId,nome:a.nome||'Agendado',trigger:''};
  const r=executarPasso({tipo:a.tipo||'email',templateId:a.templateId,fase:a.fase,texto:a.texto,atrasoDias:0},{clienteId:a.clienteId,proposta:prop},au,0);
  if(r) autoLog(au,a.clienteId,'manual',r);
  state.agendamentos=state.agendamentos.filter(x=>x.id!==id); save(); render(); toast('Passo executado',r||'Agendamento processado');
}
function cancelAgendamento(id){ state.agendamentos=state.agendamentos.filter(x=>x.id!==id); save(); render(); toast('Agendamento cancelado'); }
/* ---------- Quem vai receber esta campanha ----------
   Antes disto, enviar uma campanha era um botao e um toast no fim. Nao se via
   a quem ia, e - o que e pior numa app que ensina RGPD - enviava a quem nunca
   deu consentimento.

   Marketing direto por email precisa de base legal (art. 6.º/1 a) do RGPD e
   art. 13.º-A da Lei 41/2004). Quem nao a deu fica de fora, e diz-se porque.
   E melhor licao um envio que se recusa do que um slide sobre consentimento. */
function temConsentimento(c){
  return (state.consentimentos||[]).some(x=>x.clienteId===c.id && x.estado==="Ativo");
}
function campAudiencia(cp){
  const alvo=(state.clientes||[]).filter(c=>accMatchSeg(c,cp.segmento)&&accMatchNivel(c,cp.nivel));
  const semEmail=alvo.filter(c=>!String(c.email||"").trim());
  const comEmail=alvo.filter(c=>String(c.email||"").trim());
  const semCons=comEmail.filter(c=>!temConsentimento(c));
  const enviaveis=comEmail.filter(temConsentimento);
  return {alvo, semEmail, semCons, enviaveis};
}
function audienciaLinha(cp){
  const a=campAudiencia(cp); const fora=a.semEmail.length+a.semCons.length;
  if(!a.alvo.length) return `<span class="muted" style="font-size:.72rem">sem destinatários no alvo</span>`;
  return `<span class="muted" style="font-size:.72rem" title="${esc(a.enviaveis.map(c=>((c.nome||"")+" "+(c.apelido||"")).trim()+" · "+(c.email||"")+(c.telefone?" · "+c.telefone:"")).join(" | ")||"ninguém")}">
    ${a.enviaveis.length} destinatário(s)${fora?` · <strong style="color:var(--warn)">${fora} de fora</strong>`:""}</span>`;
}
/* a lista, para o dialogo de confirmacao */
function audienciaHTML(a){
  const linha=c=>((c.nome||"")+" "+(c.apelido||"")).trim()+(c.email?" · "+c.email:"")+(c.telefone?" · "+c.telefone:"");
  const bloco=(t,l,cor)=>l.length?`<div style="margin-top:8px"><div style="font-size:.74rem;font-weight:800;letter-spacing:.03em;color:${cor}">${t} (${l.length})</div>
    <div style="font-size:.8rem;color:var(--muted);line-height:1.5">${l.slice(0,8).map(c=>esc(linha(c))).join("<br>")}${l.length>8?"<br>… e mais "+(l.length-8):""}</div></div>`:"";
  return bloco("VAI RECEBER",a.enviaveis,"var(--g700)")+
         bloco("SEM CONSENTIMENTO ATIVO - EXCLUÍDO",a.semCons,"var(--danger)")+
         bloco("SEM EMAIL - EXCLUÍDO",a.semEmail,"var(--warn)");
}
async function sendCampaign(id){
  const cp=state.campanhas.find(c=>c.id===id); if(!cp) return;
  /* o alvo e o cruzamento dos dois filtros: segmento (dimensao) E nivel de fidelizacao */
  const aud=campAudiencia(cp); const alvo=aud.enviaveis;
  if(!aud.alvo.length){ const q=[cp.segmento&&cp.segmento!=='Todos'?('segmento '+cp.segmento):'',cp.nivel?('nível '+cp.nivel):''].filter(Boolean).join(' + ')||'todos';
    toast('Sem destinatários','Nenhum cliente em: '+q,'warn'); return; }
  if(!alvo.length){ toast('Ninguém pode receber','Dos '+aud.alvo.length+' do alvo, nenhum tem email E consentimento ativo. Registe os consentimentos em RGPD.','warn'); return; }
  /* nada sai sem se ver primeiro a quem vai - e porque e que alguem ficou de fora */
  const fora=aud.semEmail.length+aud.semCons.length;
  if(!await uiConfirm(audienciaHTML(aud),{title:'Enviar para '+alvo.length+' contacto(s)?',okText:'Enviar',icon:'send',html:true})) return;
  const tplId=cp.templateId||(state.templates[0]&&state.templates[0].id);
  let ab=0,cl=0;
  alvo.forEach(c=>{ const ev=sendEmail({clienteId:c.id, templateId:tplId, assunto:cp.nome, origem:'Campanha', campanhaId:cp.id}); if(ev.aberto)ab++; if(ev.clicado)cl++; });
  cp.enviados=(cp.enviados||0)+alvo.length; cp.abertos=(cp.abertos||0)+ab; cp.cliques=(cp.cliques||0)+cl; if(cp.estado==='Planeada') cp.estado='Ativa';
  save(); render();
  toast('Campanha enviada',`${alvo.length} enviados · ${ab} abertos · ${cl} cliques`+(fora?` · ${fora} excluído(s)`:''));
}

/* Descricao de um passo, seja qual for a accao. Usada na tabela E na jornada:
   antes a tabela assumia sempre um template de email e mostrava "-" no resto. */
/* tpls: ao avaliar uma entrega, os templates sao os DO FORMANDO, nao os meus */
function passoDescricao(p,tpls){
  const tp=p.tipo||'email';
  if(tp==='email'){ const lista=tpls||state.templates||[]; const t=lista.find(x=>x.id===p.templateId); return 'Email: '+((t&&t.nome)||'-'); }
  if(tp==='fase')   return 'Fase → '+(p.fase||'-');
  if(tp==='tarefa') return 'Tarefa: '+(p.texto||'-');
  return 'Nota: '+(p.texto||'-');
}
/* Todas as condicoes ativas, nao so a primeira. */
function condicoesTexto(a){
  const r=[];
  if(a.condSegmento&&a.condSegmento!=='Todos') r.push('segmento '+a.condSegmento);
  if(a.condNivel) r.push('nível '+a.condNivel);
  if(a.condFase) r.push('fase '+a.condFase);
  if(a.condScore) r.push('score '+a.condScore);
  return r.length?r.join(' · '):'todos';
}
function journeyHTML(a){
  const passos=(a.passos||[]);
  const nodes=[journeyNode('bell','Início',triggerLabel(a.trigger),'#d97706')];
  passos.forEach(p=>{ const atr=+p.atrasoDias||0; const tp=p.tipo||'email';
    if(atr>0) nodes.push(journeyNode('clock','Esperar',atr+' dia(s)','#2563eb'));
    if(tp==='email'){ const t=state.templates.find(x=>x.id===p.templateId); nodes.push(journeyNode('mail','Email',(t?t.nome:'-'),'#00A651')); }
    else if(tp==='fase') nodes.push(journeyNode('trend','Fase',p.fase||'-','#7c3aed'));
    else if(tp==='tarefa') nodes.push(journeyNode('check','Tarefa',p.texto||'-','#0891b2'));
    else nodes.push(journeyNode('list','Nota',p.texto||'-','#64748b'));
  });
  if(a.saida) nodes.push(journeyNode('flag','Sai se',saidaLabel(a.saida).replace(/^Quando /,''),'#dc2626'));
  const cond=condicoesTexto(a);
  const arrow=`<div style="flex:0 0 auto;align-self:center;color:var(--muted);font-size:1.1rem">→</div>`;
  return `<div style="border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap"><div><strong>${esc(a.nome)}</strong> <span class="pill ${a.estado==='Ativa'?'green':'grey'}" style="font-size:.62rem">${esc(a.estado)}</span></div><div class="muted" style="font-size:.76rem">Condição: ${esc(cond)} · ${fmtN(a.disparos||0)} disparos</div></div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px">${nodes.map((n,i)=>i<nodes.length-1?n+arrow:n).join('')}</div>
    <div class="toolbar" style="margin-top:10px"><button class="btn-sec btn-xs" data-act="auto-edit" data-id="${a.id}">Editar jornada</button></div>
  </div>`;
}

/* ---------- Proposta online (link rastreável + adjudicação) ----------
   Publica um snapshot da proposta no Supabase (Edge Function "proposta"),
   dá um link público #p/<token> que conta aberturas e deixa o cliente adjudicar. */
const PUB_FN=SUPA_URL+'/functions/v1/proposta';
function pubUrl(token){ try{ return location.origin+location.pathname+'#p/'+token; }catch(e){ return 'https://crm.cr0x.org/#p/'+token; } }
function pubToken(){ return 'pp'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6); }
async function pubPost(body){ const r=await fetch(PUB_FN,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json(); }
async function pubGet(token,stats){ const r=await fetch(PUB_FN+'?t='+encodeURIComponent(token)+(stats?'&stats=1':''),{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}}); return r.json(); }
function propDocFor(p){ const tpl=(state.propostaTemplates||[]).find(t=>t.id===p.templateId)||(state.propostaTemplates||[])[0]; return tpl?proposalDocHTML(tpl,p):('<div style="padding:40px;font-family:sans-serif">Proposta '+esc(p.numero||'')+'</div>'); }
async function pubPublish(p){
  const token=(p.online&&p.online.token)||pubToken();
  const res=await pubPost({action:'publish',token,numero:p.numero,titulo:p.titulo,entidade:state.settings.entidade||'',cliente:propAccount(p),turma:(typeof TURMA!=='undefined'?TURMA:'')||'',html:propDocFor(p)});
  if(res&&res.ok){ p.online=Object.assign({},p.online,{token,publicadoEm:todayISO()}); return {ok:true,token,url:pubUrl(token)}; }
  return {ok:false,error:(res&&res.error)||'sem ligação'};
}
function pubDT(s){ return s?String(s).slice(0,16).replace('T',' '):''; }
function loadPubStats(token){ if(!token) return; pubGet(token,true).then(r=>{ const el=$('#pubStats'); if(!r||!r.ok){ if(el) el.innerHTML='<span class="muted">Ainda sem dados (o link é publicado no envio).</span>'; return; }

async function supaAtualizarPerfil(p){
  const so=v=>v==null?null:String(v);   /* null = nao mexer; '' = apagar */
  const base={p_token:supaToken(),p_nome:p.nome||'',p_apelido:p.apelido||'',p_email:p.email||''};
  const cheio=Object.assign({},base,{p_avatar:so(p.avatar),p_assinatura:so(p.assinatura),
    p_assinatura_font:so(p.assinaturaFont),p_assinatura_size:so(p.assinaturaSize),
    p_telefone:so(p.telefone),p_cargo:so(p.cargo)});
  try{ return await supaRpc('atualizar_meu_perfil',cheio); }
  catch(e){
    /* migracao do perfil ainda por correr no servidor: grava ao menos nome/email */
    const m=String((e&&(e.code||e.message))||'');
    if(/PGRST202|Could not find|does not exist/i.test(m)) return await supaRpc('atualizar_meu_perfil',base);
    throw e;

}

function baixarJSON(obj,fname){ const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); URL.revokeObjectURL(a.href); }
