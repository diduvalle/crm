<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Space+Mono:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1080px;height:1080px;background:#efe9dd;color:#171412;
       font-family:Archivo,system-ui,sans-serif;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:0}
  .carimbo{width:712px;height:776px;margin-top:-58px}
  .carimbo svg{width:100%;height:100%}
  .rotulo{font-family:'Space Mono',monospace;font-size:26px;letter-spacing:.22em;
          text-transform:uppercase;color:#005e95;margin-top:26px}
  .nome{font-size:78px;font-weight:800;letter-spacing:-.02em;margin-top:14px;text-align:center;
        line-height:1.05;max-width:940px}
  .curso{font-size:34px;font-weight:800;color:#4a423c;margin-top:12px}
  .risco{width:210px;height:5px;background:#005e95;border-radius:3px;margin-top:26px}
  .rodape{font-family:'Space Mono',monospace;font-size:21px;letter-spacing:.14em;
          text-transform:uppercase;color:#8a7f75;margin-top:24px}
  /* Cum laude: o emblema, as estrelas e os acentos vao a ouro. O
     #6b4f08 e o stop escuro do proprio gradiente - dourado e legivel. */
  #bSelo.ouro [stroke="#171412"]{stroke:url(#ouroG)}
  #bSelo.ouro [fill="#171412"]{fill:url(#ouroG)}
  #bSelo.ouro [fill="#0078bf"]{fill:url(#ouroC)}
  #bSelo.ouro #seloDistincao polygon{fill:url(#ouroG)}
  body.cumlaude .rotulo{color:#6b4f08}
  body.cumlaude .risco{background:#6b4f08}
</style></head><body class="{{CLASSE_BODY}}">
  <div class="carimbo"><svg id="bSelo" class="{{CLASSE_OURO}}" viewBox="0 -18 200 218" role="img" aria-label="Badge de conclusão">
  <defs>
    <linearGradient id="ouroG" gradientUnits="userSpaceOnUse" x1="100" y1="18" x2="100" y2="182">
      <stop offset="0" stop-color="#d4af37"/><stop offset=".45" stop-color="#a8801a"/><stop offset="1" stop-color="#6b4f08"/>
    </linearGradient>
    <linearGradient id="ouroC" gradientUnits="userSpaceOnUse" x1="100" y1="70" x2="100" y2="130">
      <stop offset="0" stop-color="#a8801a"/><stop offset="1" stop-color="#6b4f08"/>
    </linearGradient>
  </defs>
  <g id="seloDistincao">{{ESTRELAS}}</g>
  <g transform="rotate(-5 100 100)">
    <circle cx="100" cy="100" r="76" fill="none" stroke="#171412" stroke-width="7"/>
    <circle cx="100" cy="100" r="64" fill="none" stroke="#171412" stroke-width="2.5"/>
    <path id="ra7cp55GGy" d="M100,100 m-51,0 a51,51 0 1,1 102,0 a51,51 0 1,1 -102,0" fill="none"/>
    <text font-family="'Space Mono',monospace" font-size="9.5" font-weight="600" fill="#171412" letter-spacing="1.5">
      <textPath href="#ra7cp55GGy" startOffset="25%" text-anchor="middle">FORMAÇÃO EM CRM</textPath>
    </text>
    <path id="rb7cp55GGy" d="M100,100 m-50,0 a50,50 0 1,0 100,0 a50,50 0 1,0 -100,0" fill="none"/>
    <text font-family="'Space Mono',monospace" font-size="9.5" fill="#171412" letter-spacing="3">
      <textPath href="#rb7cp55GGy" startOffset="25%" text-anchor="middle">2026</textPath>
    </text>
    <rect x="55" y="77" width="28" height="47" rx="4" fill="none" stroke="#171412" stroke-width="3.4"/>
    <rect x="86" y="77" width="28" height="47" rx="4" fill="none" stroke="#171412" stroke-width="3.4"/>
    <rect x="117" y="77" width="28" height="47" rx="4" fill="#0078bf"/>
    <rect x="60" y="83" width="18" height="3.4" rx="1.7" fill="#171412"/>
    <rect x="91" y="83" width="18" height="3.4" rx="1.7" fill="#171412"/>
    <rect x="122" y="83" width="18" height="3.4" rx="1.7" fill="#efe9dd"/>
    <rect x="60" y="93" width="18" height="7" rx="2" fill="#171412" opacity=".34"/>
    <rect x="60" y="104" width="18" height="7" rx="2" fill="#171412" opacity=".34"/>
    <rect x="91" y="93" width="18" height="7" rx="2" fill="#171412" opacity=".34"/>
    <rect x="122" y="93" width="18" height="7" rx="2" fill="#efe9dd"/>
    <rect x="122" y="104" width="18" height="7" rx="2" fill="#efe9dd" opacity=".5"/>
  </g></svg></div>
  <p class="rotulo">Concluiu a formação</p>
  <h1 class="nome">{{NOME}}</h1>
  <p class="curso">Formação prática em CRM</p>
  <div class="risco"></div>
  <p class="rodape">{{MES}} · crm.cr0x.org</p>
</body></html>
